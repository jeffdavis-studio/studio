<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unison 808</title>
<style>
  :root{
    --bg:#0f1012; --panel:#191b1e; --panel2:#212428; --line:#33383e;
    --ink:#eceef0; --dim:#868c95; --hot:#e8a33d; --acc:#e0574f; --go:#5fbf7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.35 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none
  }
  #app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}

  /* ---------------- transport ---------------- */
  header{
    display:flex;align-items:center;gap:16px;padding:9px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap
  }
  header h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  header h1 span{color:var(--dim);font-weight:400;letter-spacing:.04em;text-transform:none}
  .tbtn{
    font:inherit;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    padding:8px 16px;border-radius:8px;cursor:pointer;
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);white-space:nowrap
  }
  .tbtn:hover{border-color:#4c535b}
  #play.on{background:var(--go);color:#08170e;border-color:var(--go)}
  .tgroup{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .tgroup label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  .tgroup input[type=range]{width:88px}
  #bpmv{font-variant-numeric:tabular-nums;color:var(--ink);width:26px;text-align:right;font-size:12px}
  header .sp{margin-left:auto}
  #work{width:9px;height:9px;border-radius:50%;background:#2c3036;transition:background .1s;flex:0 0 auto}
  #work.on{background:var(--hot)}

  /* ---------------- main ---------------- */
  main{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,.86fr);
    gap:12px;padding:12px 16px;min-height:0;overflow:hidden
  }
  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;min-height:0;display:flex;flex-direction:column;overflow:hidden
  }
  .card h2{
    margin:0 0 9px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);font-weight:700;display:flex;align-items:center;gap:10px;flex:0 0 auto
  }
  .card h2 .sp{margin-left:auto}
  .rowbtn{
    font:inherit;font-size:10px;letter-spacing:.10em;text-transform:uppercase;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);cursor:pointer;
    padding:4px 10px;border-radius:6px
  }
  .rowbtn:hover{color:var(--ink);border-color:#4c535b}

  /* ---------------- the machine: pads + steps ---------------- */
  /* The lanes FILL the card rather than sitting in the middle of it: a pad you
     play wants to be a big target, and a 900px laptop has the room. */
  #grid{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;min-height:0}
  .lane{display:grid;grid-template-columns:112px 22px minmax(0,1fr);gap:6px;align-items:stretch;flex:1 1 0;min-height:0}
  .pad{
    font:inherit;font-size:12px;font-weight:600;letter-spacing:.05em;
    padding:0 9px;border-radius:8px;cursor:pointer;text-align:left;
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap
  }
  .pad kbd{
    font:inherit;font-size:9px;color:#5c626a;border:1px solid #383e45;border-radius:3px;
    padding:0 4px;flex:0 0 auto
  }
  .pad:hover{border-color:#4c535b}
  .pad.lit{background:var(--hot);border-color:var(--hot);color:#1a1005}
  .mute{
    font:inherit;font-size:10px;cursor:pointer;border-radius:5px;padding:0;
    background:var(--panel2);border:1px solid var(--line);color:#4b5158;text-align:center
  }
  .mute.on{color:var(--go);border-color:#3c5a45}
  .steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;min-height:0}
  .st{
    height:100%;min-height:0;border-radius:5px;cursor:pointer;padding:0;
    background:#191c20;border:1px solid #2b3037
  }
  .st.q{background:#1e2228}
  .st:hover{border-color:#4c535b}
  .st.on{background:var(--ink);border-color:var(--ink)}
  .st.on.q{background:var(--ink)}
  .st.now{box-shadow:0 0 0 2px var(--hot) inset}
  #ruler{display:grid;grid-template-columns:112px 22px minmax(0,1fr);gap:6px;flex:0 0 auto;margin-bottom:2px}
  #ruler div:last-child{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
  #ruler b{
    font-weight:400;font-size:9px;color:#4b5158;text-align:center;letter-spacing:.06em
  }
  /* accent lane sits under the voices — the machine's one global step control */
  .lane.acc .pad{color:var(--acc);border-color:#4a2b28;background:#20191a}
  .lane.acc .st.on{background:var(--acc);border-color:var(--acc)}

  /* ---------------- knob rack ---------------- */
  #rack{
    flex:1 1 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0 18px;min-height:0;overflow:hidden
  }
  .rcol{display:flex;flex-direction:column;gap:16px;min-width:0}
  .grp{display:flex;flex-direction:column;gap:9px}
  .grp>h3{
    margin:2px 0 0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:#5c626a;font-weight:700;border-bottom:1px solid #262a2f;padding-bottom:3px
  }
  .knob{display:flex;flex-direction:column;gap:1px}
  .knob label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
  .knob .ends{display:flex;justify-content:space-between;font-size:9px;color:#4b5158;margin-top:-2px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;
    margin:0;padding:0;border:0;cursor:pointer
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;background:#15171a;border-radius:2px;border:1px solid var(--line)
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:16px;border-radius:4px;background:var(--ink);
    margin-top:-7px;border:1px solid #000
  }
  input[type=range]::-moz-range-track{height:4px;background:#15171a;border-radius:2px;border:1px solid var(--line)}
  input[type=range]::-moz-range-thumb{width:12px;height:16px;border-radius:4px;background:var(--ink);border:1px solid #000}
  .knob.moved label{color:var(--ink)}

  /* ---------------- footer ---------------- */
  footer{
    display:flex;align-items:center;gap:16px;padding:8px 16px;
    background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:11px
  }
  footer .sp{margin-left:auto}
  footer kbd{
    font:inherit;font-size:10px;color:var(--dim);border:1px solid #383e45;border-radius:3px;padding:0 4px
  }
  #boot{
    position:fixed;inset:0;background:rgba(10,11,13,.94);display:flex;align-items:center;
    justify-content:center;z-index:30;cursor:pointer;flex-direction:column;gap:12px
  }
  #boot.off{display:none}
  #boot b{font-size:20px;letter-spacing:.16em;text-transform:uppercase}
  #boot span{color:var(--dim);font-size:13px}

  /* the song's own grooves, by lane */
  #lanes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 9px;flex:0 0 auto}
  #lanes .rowbtn.on{color:#1a1005;background:var(--hot);border-color:var(--hot)}
  #grooveIds{flex:1 0 100%;font-size:10px;color:#5c626a;letter-spacing:.04em;min-height:13px}

  /* ---------------- phone ---------------- */
  /* The desktop machine is two columns of a fixed-height screen; a phone gets
     one scrolling column instead. The sixteen-lane step grid cannot give a
     thumb 44px per step at 390px, so on a phone it is replaced by a 3x3 kit of
     big pads and a 4x4 step editor for whichever lane was tapped last. */
  #phone{display:none}
  .pad,.kp,.st{touch-action:manipulation;-webkit-touch-callout:none}
  .pad,.kp{touch-action:none}
  @media (max-width:600px){
    html,body{height:auto}
    body{overflow:auto;overflow-x:hidden;font-size:15px;-webkit-user-select:none}
    #app{display:block;height:auto;overflow:visible}
    header{flex-wrap:wrap;gap:8px;padding:10px}
    header h1{font-size:15px;flex:1 0 100%;order:0}
    header .sp{display:none}
    .tbtn{min-height:46px;font-size:13px;padding:0 10px;flex:1 1 0;order:1}
    #work{order:1;align-self:center}
    .tgroup{order:2;flex:1 0 100%;display:grid;grid-template-columns:62px minmax(0,1fr) 34px;gap:8px}
    .tgroup label{font-size:12px}
    .tgroup input[type=range]{width:100%}
    #bpmv{font-size:14px;width:auto}
    main{display:block;padding:8px;overflow:visible}
    .col{display:block}
    .card{overflow:visible;margin-bottom:10px;padding:10px}
    .card h2{font-size:12px;flex-wrap:wrap;gap:8px}
    .rowbtn{min-height:44px;font-size:12px;padding:0 12px}
    #ruler,#grid{display:none}
    #lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
    #lanes .rowbtn{min-height:48px;padding:0 6px}
    #grooveIds{grid-column:1 / -1;font-size:12px}
    #phone{display:block}
    #kitpads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .kp{min-height:64px;font-size:14px;justify-content:center;text-align:center;white-space:normal}
    .kp.sel{box-shadow:0 0 0 2px var(--ink) inset}
    .prow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
    .prow .rowbtn{min-height:48px}
    .prow .rowbtn.on{color:var(--ink);border-color:var(--hot)}
    .prow .rowbtn.acc.sel{color:var(--acc);border-color:var(--acc)}
    .plabel{margin:12px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
    .plabel b{color:var(--ink)}
    #ed{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
    #ed .st{height:48px}
    #ed.acc .st.on{background:var(--acc);border-color:var(--acc)}
    #rack{display:block;overflow:visible}
    .rcol{gap:14px;margin-bottom:14px}
    .grp>h3{font-size:12px}
    .knob label{font-size:13px}
    .knob .ends{font-size:12px;margin-top:0}
    input[type=range]{height:44px}
    input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-12px;border-radius:13px}
    input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:13px}
    footer{flex-wrap:wrap;font-size:13px;padding:10px}
    footer span:first-child{display:none}
    #boot span{font-size:15px}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Unison <span>· 808</span></h1>
    <button class="tbtn" id="play">play</button>
    <div class="tgroup">
      <label for="bpm">tempo</label>
      <input type="range" id="bpm" min="60" max="180" step="1" value="104">
      <span id="bpmv">104</span>
    </div>
    <div class="tgroup">
      <label for="swing">swing</label>
      <input type="range" id="swing" min="0" max="0.6" step="0.01" value="0">
    </div>
    <div class="tgroup">
      <label for="vol">volume</label>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.4">
    </div>
    <span class="sp"></span>
    <button class="tbtn" id="draw">draw a panel</button>
    <button class="tbtn" id="reset">reset</button>
    <span id="work" title="building the kit"></span>
  </header>

  <main>
    <!-- ============ left: the machine ============ -->
    <div class="col">
      <div class="card" style="flex:1 1 auto">
        <h2>the kit
          <span class="sp"></span>
          <button class="rowbtn" id="padAcc" title="pads hit plain or accented (the accent knob sets how hard)">hits: plain</button>
          <button class="rowbtn" id="patClear">clear</button>
          <button class="rowbtn" id="patInit">pattern</button>
        </h2>
        <div id="lanes" title="a groove drawn from the song's own drum books for that lane"></div>
        <div id="ruler"><b></b><b></b><div id="rulerSteps"></div></div>
        <div id="grid"></div>
        <div id="phone">
          <div id="kitpads"></div>
          <div class="prow">
            <button class="rowbtn acc" id="selAcc">accent lane</button>
            <button class="rowbtn on" id="selMute">in pattern</button>
            <button class="rowbtn" id="pagePlay">play</button>
          </div>
          <div class="plabel">pattern · <b id="selName">bass drum</b></div>
          <div id="ed"></div>
        </div>
      </div>
    </div>

    <!-- ============ right: every knob ============ -->
    <div class="col">
      <div class="card" style="flex:1 1 auto">
        <h2>the panel <span class="sp"></span><span style="color:#4b5158;letter-spacing:.06em">every knob, live</span></h2>
        <div id="rack"></div>
      </div>
    </div>
  </main>

  <!-- Provenance lives in the tooltip, not in the layout. Nothing that measures
       the sound appears on this screen. -->
  <footer title="engine @a919509 · built 2026-10-04">
    <span><kbd>1</kbd>–<kbd>9</kbd> play a voice &nbsp;·&nbsp; <kbd>space</kbd> start / stop</span>
    <span class="sp"></span>
    <span>Nothing is sampled. Every hit is synthesised in the browser by the engine's own code, live off the knobs.</span>
  </footer>
</div>

<div id="boot"><b>Unison 808</b><span>tap anywhere to start the audio</span></div>

<!-- ===================== inlined engine (verbatim, private repo) ===================== -->
<script type="text/plain" id="src-engine">
/* ===== src/core/prng.js @ a919509 — verbatim from jeffdavis-studio/unison-engine ===== */
// prng.js — Unison determinism core: ONE PRNG stream per song, seeded from the
// token hash, consumed in canonical draw order (Technical Architecture v1.2).
//
// Discipline: every module draws from the same stream, in a documented, fixed
// order. Never draw conditionally in a way that changes how many draws happen
// for the same hash (draw first, discard if unused). Reordering draws is a
// breaking change to every existing output.
(function (g) {
  "use strict";
  const U = (g.U = g.U || {});

  // sfc32 — small fast counter PRNG, 128-bit state, well-tested for this use.
  // Seeded from the last 32 hex chars (four 32-bit words) of the token hash.
  // XOR constants keep degenerate hashes (all zeros) from collapsing the state.
  U.makePrng = function (hash) {
    let h = String(hash).replace(/^0x/i, "").toLowerCase();
    if (!/^[0-9a-f]*$/.test(h)) throw new Error("makePrng: non-hex hash");
    h = h.padStart(32, "0");
    const word = (i) => parseInt(h.slice(h.length - 8 * (i + 1), h.length - 8 * i), 16) >>> 0;
    let a = (word(3) ^ 0x9e3779b9) >>> 0;
    let b = (word(2) ^ 0x243f6a88) >>> 0;
    let c = (word(1) ^ 0xb7e15162) >>> 0;
    let d = (word(0) ^ 0x8aed2a6b) >>> 0;

    function r() {
      a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
      const t = (a + b) | 0;
      a = b ^ (b >>> 9);
      b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11);
      d = (d + 1) | 0;
      const out = (t + d) | 0;
      c = (c + out) | 0;
      return (out >>> 0) / 4294967296;
    }
    for (let i = 0; i < 15; i++) r(); // warm-up: decorrelate from raw seed words

    return {
      r,                                                        // [0,1)
      ri: (lo, hi) => lo + Math.floor(r() * (hi - lo + 1)),     // int, inclusive
      pick: (arr) => arr[Math.floor(r() * arr.length)],
      chance: (p) => r() < p,
    };
  };

  // FORKED STREAMS (added 2026-10-01 for the bass guitar's session player).
  // A module that needs its own randomness WITHOUT moving the song's draw
  // order takes a fork: a separate sfc32 stream seeded from (hash, label)
  // through FNV-1a + murmur3's fmix32, four words, one per lane of the seed.
  // It never reads or advances the song stream, so adding or removing a
  // fork's draws cannot shift any canonical draw (session.js header) — the
  // same discipline the architecture reserves for the visual layer. Distinct
  // labels give independent streams; same (hash, label) = same stream.
  U.forkPrng = function (hash, label) {
    const s = String(hash).replace(/^0x/i, "").toLowerCase() + ":" + String(label);
    let hex = "";
    for (let k = 0; k < 4; k++) {
      let x = (0x811c9dc5 ^ Math.imul(k + 1, 0x9e3779b9)) >>> 0;
      for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; }
      x ^= x >>> 16; x = Math.imul(x, 0x85ebca6b) >>> 0;
      x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35) >>> 0;
      x ^= x >>> 16;
      hex += (x >>> 0).toString(16).padStart(8, "0");
    }
    return U.makePrng(hex);
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ===== src/core/mix.js @ a919509 — verbatim from jeffdavis-studio/unison-engine ===== */
// mix.js — the fan-in ≤2 summing rule, as a primitive.
//
// Bake-off finding (2026-07-21, decision brief in Drive): Chrome's offline
// audio renders are NOT bit-reproducible wherever a node sums 3+ inputs —
// float addition isn't associative and the browser doesn't fix the summation
// order. Chain-mixing every summing point at fan-in ≤2 makes renders
// bit-identical (SHA-256-equal) across pages and loads. Tone.js cannot adopt
// this fix; it is why the engine is raw Web Audio.
//
// RULE: no AudioNode in this engine may ever receive more than two .connect()s.
// Anywhere three or more signals meet, they meet through U.chainMixer.
(function (g) {
  "use strict";
  const U = (g.U = g.U || {});

  // Serial chain of 2-input gains. add() splices a fresh gain between the
  // accumulator and `out`, so every summing node sums exactly two signals in a
  // fixed order. Order of add() calls is part of the deterministic contract.
  U.chainMixer = function (ctx, out) {
    let acc = null;
    let count = 0;
    return {
      add(node) {
        count++;
        if (!acc) { acc = ctx.createGain(); node.connect(acc); acc.connect(out); return; }
        const link = ctx.createGain();
        acc.disconnect(out);
        acc.connect(link);
        node.connect(link);
        link.connect(out);
        acc = link;
      },
      get count() { return count; },
    };
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ===== src/instruments/tr808.js @ a919509 — verbatim from jeffdavis-studio/unison-engine ===== */
// tr808.js — THE MACHINE. A TR-808-lineage core voice: bass drum, snare,
// closed hat, open hat, each with a front panel the token actually turns.
//
// Homage, not trademark (founding brief): the circuits below are modelled on
// the early-80s Japanese analogue rhythm machine that defines the electro /
// early hip-hop lane — close, deliberately not slavish. Nothing user-facing
// names a model number.
//
// WHY THIS EXISTS BESIDE drums.js AND NOT INSIDE IT. drums.js is the generic
// kit: twelve voices, two flavour presets, every constant hardcoded. It still
// owns clap, rim, toms, cowbell and congas, and it still supplies the whole
// `studio` (Linn-lineage) kit, which is a different machine and its own later
// task. What this file adds is the thing drums.js structurally could not be: a
// real machine with a real panel, whose four core voices are SYNTHESISED FROM A
// DRAWN PARAMETER SET rather than from constants. Extending drums.js in place
// would have entangled the 808 panel with the Linn voicing that has to stay put
// until its own build. So: new module, four voices, drums.js untouched except
// for the four-line hand-off that lets a machine-flavour kit take its kick,
// snare and hats from here.
//
// THE CIRCUITS, in the order they appear below.
//
//   BASS DRUM — a bridged-T network rung by the trigger pulse. It is close to a
//   pure decaying sine that starts sharply above its resting pitch and falls to
//   it in about 20ms; DECAY is feedback into the network (a longer ring, not a
//   different pitch); TONE mixes in the raw trigger click ahead of the ring.
//   Modelled here as: sine + fast pitch envelope + a small fast-dying second
//   harmonic (the network's asymmetry) + a high-passed click + gentle
//   saturation, which is what the machine's output stage does when the drum is
//   loud.
//
//   SNARE — two tuned bridged-T oscillators (a low body and a partial roughly a
//   twelfth above it) plus a separate noise generator through a bandpass. TUNE
//   moves both oscillators. SNAPPY is the noise level against the drum body —
//   the one knob everyone actually turns. TONE here drives the noise brightness
//   and how long the noise rings, which is the audible half of the machine's
//   own tone control.
//
//   HATS — six square-wave oscillators at fixed inharmonic frequencies, summed,
//   high-passed, and gated by a VCA. Closed and open hat share ONE oscillator
//   bank and differ only in their envelope and filter setting, exactly as the
//   machine does — which is also why they share a VCA, and why a closed hat
//   cuts an open one off. That choke is implemented in the kit (drums.js
//   `fire`), because it is a scheduling behaviour, not a waveform.
//
//   TOMS (low / mid / high) — the same bridged-T ring as the bass drum, damped
//   harder and tuned up, with the trigger pulse itself audible as a short
//   noise thud in front of it. One knob each, TUNING, exactly as the machine
//   has. The DECAY is a property of each circuit, not a knob: measured across
//   the corpus's five TUNING cells per family it barely moves (LT 89.9→86.1 ms,
//   MT 57.9→55.1, HT 44.5→41.5), while the pitch moves 1.22x. So decay is a
//   constant per family with a small tuning-dependent shortening, and TUNING
//   is a frequency knob and nothing else.
//
//   HAND CLAP — ONE noise source through ONE bandpass, gated by a VCA that is
//   opened three times in fast succession and then held open onto a long
//   decay. Not "three noise bursts plus a tail" as a generic clap is written:
//   the bursts and the tail are the same noise through the same filter, which
//   is why an 808 clap sounds like one event and not like four. No knob — the
//   machine gives the clap a LEVEL and nothing else.
//
//   RIM SHOT — a bridged-T rung once and damped hard. Two resonances and a
//   trigger click, over in about 13 ms. Also no knob.
//

// numbers below are that measurement, not an approximation of the idea of an
// 808 — clap burst spacing off a 0.5 ms envelope, rim resonances off a window
// sized to a 13 ms hit, tom fundamentals off an interpolated FFT peak.
//

//     Fixed count, drawn for every song whether or not the 808 is the kit, so

//

    bdDecay:  [0.0158, 0.4959, 0.70], // sec — geometric; machine spans 16.9–535.6 ms, we spanned 128–319

    sdTone:   [0.15, 0.90],     // INERT — position-driven (noise brightness + ring length)
    sdLevel:  [0.84, 1.16],

  // have re-rolled the kick and snare of every hash for a tom knob, which is a

  // with this file.
  const ONSET = {

    // converge as it decays. Modelled as a quadratic term, y = x + d*x², which
    // is the shape that behaves that way for free — at amplitude A the peak

    // loudest and vanishes as A falls, with no envelope to schedule. It also
    // adds the even harmonic a real bridged-T asymmetry adds. The DC the

    // still covers it and the shared PRNG stream is untouched by construction.
    // THE GATE HAS A WIDTH, 2026-09-13 — and it is what fixes decay t20.
    // cc77b57 shipped the charge stage above and disclosed a regression with
    // it: decay t20 went 55.9 -> 64.9 ms against the machine's 46.9, the
    // largest row left on the voice. The cause is structural, not a bad fit.
    // With the charge and the discharge MULTIPLIED, the tail is still charging
    // through its own peak, so the first milliseconds after the peak are held
    // up by a rising term. The envelope has no corner; it cannot have one.
    // MEASURED FIRST, TWO-SIDED, AT SIX WINDOW LENGTHS — this thread has three
    // cases of a statistic that turned out to be its own probe:
    //     window (ms)      1      2      3      5      8     12
    //     REF  t20      25.9   43.9   47.9   46.4   55.9   57.9
    //     OURS t20      43.9   61.4   61.4   63.4   67.8   70.3
    // The number drifts with the window on BOTH sides, so no absolute value
    // here is quotable — but the gap is 15-20 ms at every window from 2 ms up
    // and never reverses. Read as a shape at a 10 ms window: the machine falls
    // ~20 dB in ~47 ms after its peak (tau ~25 ms) then flattens to tau ~85 ms;
    // ours took 65 ms for the first 20 dB (tau ~35 ms) then ran at tau ~46.
    // Too slow early and too fast late. The machine's knee is SHARPER than
    // ours. Our tail already had two rates; what it did not have was a corner.
    // AND THE EXISTING CONSTANTS COULD NOT BUY ONE. A full two-round ladder on
    // all four tail axes moved nothing (FITTED = {}, 0.1375 unchanged), and the
    // 42-cell cpTailRise x cpTailTau grid — they are coupled, so a coordinate
    // ladder cannot see the diagonal — shows why: t20 IS reachable there, 48.9
    // ms at rise 0.008 / tau 0.018, and it costs the attack, peak 34.43 instead
    // of 38.42 and rise 10-90 collapsing to 4.99 ms. TOTAL 0.1870. One RC
    // cannot both hold the peak out to 38 ms and drop 20 dB by 85 ms.
    // THE CIRCUIT. The gate is a pulse, and a pulse has a width. The cap
    // charges through the series resistance only while the gate is OPEN, and
    // the discharge starts from the instant it closes — so the envelope peaks
    // at the gate's trailing edge and turns a corner there. One constant, and
    // it is the one physical fact the product form leaves out.
    // cpTailGate = 0 selects the product form and returns the cc77b57 circuit
    // BIT-FOR-BIT (asserted: 93,829 samples, sample-for-sample identical).
    // WHAT IT BOUGHT, and what it cost. t20 44.9 ms vs 46.9 (0.3248 -> 0.0436),
    // rise 10-90 exactly on the machine at 16.96 (0.1716 -> 0.0000), peak held
    // at 38.42, centroid @80ms 0.1322 -> 0.0246. Against: per-band tau 0.2652
    // -> 0.3411, which is an artefact of the aggregate and worth reading before
    // treating as a loss — btau averages |log(ours/ref)| over the bands both
    // sides can measure, and on the nine the old circuit could measure the new
    // one is BETTER (0.2554 vs 0.2647). The row rises because 30-60 Hz is newly
    // measurable at 12.2 ms against the machine's 36.8, so a tenth and badly
    // matched term joins the mean. We gained low end and were charged for it.
    // NEITHER HALF WORKS ALONE, which is the evidence this is a circuit change
    // and not a fit: the gate with cpLpTau held at 0.035 scores 0.1573 and
    // cpLpTau 0.045 with no gate scores 0.1462 — both WORSE than the 0.1375
    // baseline. Only the pair is better. The buffer-length solver above DOES
    // have to know about this one (unlike cpTailRise, a width delays the
    // discharge rather than shortening it), so the gate is added there.
    cpTailGate: 0.0160,               // sec, how long the gate stays open
    // THE CLAP DARKENS AS IT DECAYS — 2026-08-18, and this is the whole defect
    // the 8/18 pass was chasing under the wrong name. Per-band tau on CP.WAV
    // falls monotonically with frequency: 110.1 ms at 120-240 Hz, 89.6, 73.9,
    // 57.7, then 26.1 / 21.0 / 19.5 above 1.92 kHz — a 5.6x tilt. One VCA on
    // already-filtered noise can only produce a FLAT tilt, and ours measured
    // flat at 33-38 ms in every band. Said the other way round, the machine's
    // centroid runs 1992 -> 2708 (20ms) -> 1647 (80ms) -> 1163 (160ms) while
    // ours sat flat and slightly RISING, which is the shape DICTIONARY.md
    // indexes as metallic. Modelled as a low-pass whose corner sweeps down
    // through the hit — one filter, three constants, and it grades the
    // per-band decay for free instead of one corner flattening it again.
    // cpLpStages is how many poles that sweep is. One pole could not make the
    // tilt steep enough: fitted at one stage the low bands still came back
    // 43/58/49/42 ms against the machine's 110/90/74/58, and pushing the tail
    // envelope out to fix them dragged the high bands out with it. Two poles
    // roll off 12 dB/oct instead of 6, which lets the tail envelope be long
    // enough for the bottom while the top still dies on schedule.
    // THE LOW END IS AUDIBLE AND THE OBJECTIVE CANNOT SEE IT — 2026-09-13,
    // ANSWERED, AND DELIBERATELY NOT FIXED. Kept here rather than in a thread
    // because the mechanism has now been built and thrown away twice.
    // THE DEFICIT, re-measured on this tree without a filter at all — a
    // whole-signal FFT, so no group delay and no window to argue about, which
    // is what the 08-30 reading got wrong with a causal 4-pole low-pass:
    //     band        0-30   30-60  60-120  120-240  240-480   480+   (dB re
    //     CP.WAV     -37.0   -46.8   -43.9    -39.3    -26.8   -0.0    total)
    //     ours       -59.2   -58.9   -56.0    -46.2    -28.5   -0.0
    // The headline "16.8 dB below 120 Hz" was hiding its own shape: the
    // machine's sub-120 energy is dominated by 0-30 Hz, most of which is below
    // hearing. In the band an ear actually has, 30-120 Hz, the deficit is
    // 12.1 dB, not 16.8.
    // THE MECHANISM TESTED. VCA control-voltage feedthrough: the tail gate's
    // own curve added back after BOTH output high-passes, so no filter change
    // can reach it. Raw, it is a near-DC blob and the objective hates it at
    // every level (0.1195 -> 0.1373 at the first step, monotone up from there)
    // — which is what 08-30 found and reported as "no level at which this
    // helps". THAT CLAIM NEEDS ONE CORRECTION: the tail CV is unipolar, so the
    // raw bleed puts its energy at literal DC, which no coupling cap passes and
    // no speaker reproduces. AC-couple it at 20 Hz, as any real output stage
    // does, and the objective stops getting worse.
    // BUT IT STILL CANNOT SEE IT. AC-coupled, the total reads 0.1177 / 0.1181 /
    // 0.1179 / 0.1178 / 0.1181 / 0.1182 across levels 0.0001 to 0.0015 — a
    // 15x change of level moving the fourth decimal non-monotonically — and the
    // whole surface over six corners x six levels lies between 0.118 and 0.126.
    // That is a STEP at zero followed by a plateau, not a fitted optimum: any
    // nonzero low-frequency floor changes which bands the per-band statistics
    // can measure, and that discretisation is the entire 0.0014. A constant
    // fitted to it would be fitted to the objective's own gate.
    // AND IT IS AUDIBLE, which is the answer the question was actually asked
    // for. At the level that closes the 30-120 Hz deficit to the machine
    // (0.004, AC-coupled) audibility.mjs reads peak NMR 28.08 dB, lit frac
    // 0.0054 — over the gate on both criteria, and still over it at half that
    // level (22.07 dB, 0.0030). So of the two branches 08-30 left open, it is
    // (b): the deficit is real, it is audible, and the canonical objective has
    // no row that can see it. Closing it will never show up as a number, and
    // nothing in this lane should be fitted to it.
    // ONE SHAPE MISMATCH, for whoever does fix it: the bleed over-delivers at
    // 30-60 Hz and under-delivers at 60-120 relative to the machine, at every
    // corner tried. Feedthrough of this envelope is the wrong spectral slope,
    // so the mechanism is probably not exactly right even though the band is.
    // The working stage is a 64-line patch in
    // files/unison/clap-t20-2026-09-13/clap-cv-bleed.patch in the studio
    // workspace; it adds no samples and does not re-roll the shared PRNG.
    cpLpStart: 22000, cpLpEnd: 850, cpLpTau: 0.045, cpLpStages: 2,
    // Second high-pass pass. Peak band balance had us +14.4 dB at 120-240 and
    // +9.2 at 240-480 against the machine, and within 3 dB everywhere above
    // 480 — one pole at 620 Hz is not steep enough to keep the thump out.
    cpHp2Hz: 1600,

    // RIM SHOT. Two resonances off a 1024-point window sized to the 13 ms hit:
    // 476.1 Hz at 0 dB and 1711.6 Hz at −5.7 dB. Damping from the band decays
    // (240-960 Hz t20 = 8.7 ms, 960-1.92k t20 = 5.8 ms — the high resonance
    // dies first, which is why the hit reads as a click and not a tone).
    rsF1: 476.1, rsF2: 1711.6, rsA2: 0.38,
    rsTau1: 0.0040, rsTau2: 0.0028, rsClick: 1.00,
    // The third mode, 2026-08-18. The 8/17 window found it (934.6 Hz at
    // -10.2 dB, and 732.3 at -13.1) and only the top two were modelled, which
    // left a 15.7 dB hole in the 960 Hz-1.92 kHz band against the machine.
    // MORE MODES, measured 2026-08-18. The 8/17 pass took two peaks off a
    // 1024-point window and stopped. Reading RS.WAV's top twelve gives a whole
    // comb — 476 / 732 / 935 / 1255 / 1475 / 1712 / 2153 / 2551 / 2974 / 3874
    // Hz at 0 / -13.1 / -10.2 / -19.7 / -20.7 / -5.7 / -17.9 / -19.2 / -18.0 /
    // -22.7 dB — and the two-mode model left a 15.7 dB hole at 960 Hz-1.92 kHz
    // and a 31.1 dB hole at 1.92-3.84 kHz. Five modes cover the comb's spine.
    rsF3: 934.6, rsA3: 0.55, rsTau3: 0.0038,
    rsF4: 2153, rsA4: 0.2, rsTau4: 0.0038,
    rsF5: 2974, rsA5: 0.13, rsTau5: 0.0030,
    // MODE AMPLITUDES REALIGNED TO THE PEAKS THEY WERE MEASURED FROM,
    // 2026-08-22. The frequencies above came off RS.WAV's top-twelve peaks, but
    // the AMPLITUDES did not — they were left to the 08-18 fitter, which was
    // still trying to make a bandlimited-free click's missing colour out of
    // sine level and pushed three of them far past what the spectrum says:
    //   mode      measured   was     inflation
    //   rsA2      0.519      1.05      2.02x     (1712 Hz, -5.7 dB)
    //   rsA3      0.309      0.65      2.10x     ( 935 Hz, -10.2 dB)
    //   rsA4      0.127      0.45      3.53x     (2153 Hz, -17.9 dB)
    //   rsA5      0.126      0.13      1.03x     (2974 Hz, -18.0 dB)
    // rsA2 at 1.05 made the 1712 Hz mode LOUDER than the 476 Hz fundamental,
    // which no reading of the reference supports. rsA5 — the one mode the
    // fitter happened to leave alone — was already dead on, which is the tell.
    // Re-laddered on the full objective they land at 0.38 / 0.55 / 0.2 / 0.13:
    // near the measured values, all interior to their ladders, none at a bound.
    // WHICH MODE LEADS. Windowed at 128 points over the first 2.9 ms the
    // machine's strongest peak is 1728 Hz, not 476 — the high mode leads the
    // hit and the low one takes over from 3 ms (479 Hz at 0 dB, 1726 still at
    // -3.9). That is why the machine reads as a click with a pitch in it. Ours
    // had it the other way round: energy(0-3ms)/energy(3-13ms) was 6.18 against
    // the machine's 1.33, i.e. our hit was five times too front-loaded.
    // The excitation, named for what it is rather than left as three literals.
    rsClickHz: 300, rsClickTau: 0.00500, rsClickLen: 0.0050,
    // THE CLICK IS BANDLIMITED, 2026-08-22. It was white noise, one-pole
    // high-passed at 300 Hz and nothing else, so it ran flat to Nyquist and put
    // us +10.0 dB at 7.68-15.36k and +21.8 at 15.36-20k against the machine —
    // "splatter", and the largest single term inside the rim's largest
    // canonical row. The machine's click leaves through a lossy network and a
    // bandlimited output stage: RS.WAV falls -8.5 dB from band 7 to band 8 and
    // -12.3 dB more into band 9 (~-17 dB/octave up there, band 9 being only 0.7
    // octaves wide). ONE POLE CANNOT DO THAT — 1.7 octaves of 6 dB/oct buys
    // -10 dB where -22 is asked — so this is two cascaded poles.
    //
    // Checked FIRST that the machine's top bands are signal and not the WAV's
    // own dither, because the last thing in this task that looked like a target
    // turned out to be a noise floor. Within-band against RS.WAV's own per-band
    // floor (analysis/band-floor.mjs), band 8 sits 40.1 dB clear of its floor
    // and band 9 sits 27.5 dB clear. Real machine, so a real target.
    // Order matters as much as corner, and the two trade against each other.
    // A GENTLE filter placed LOW does close bands 8 and 9, but it takes band 7
    // with it — 2 poles at 4 kHz measures -7.2 dB at 3.84-7.68k where we were
    // already right, and the full objective rejects it (0.1557 against 0.1228).
    // The machine's shape is the opposite: flat through band 7, then a cliff.
    // That is what an output stage's anti-alias filter looks like, so the model
    // is a STEEP filter placed HIGH rather than a gentle one placed low.
    rsClickLp: 13000, rsClickLpPoles: 3,
    // THE DAMPER, 2026-08-30 — the rim's decay has a KNEE, and the knee is why
    // three passes of tau laddering could not reach t40.
    //
    // WHAT THE REFERENCE DOES. RS.WAV's decay is not one rate and not a smooth
    // acceleration. It is two straight segments in dB with a corner between
    // them. Fitted separately over -2..-16 dB and -18..-50 dB, read at FIVE
    // window lengths so the corner cannot be an artefact of the analysis
    // window (1 / 2 / 3 / 5 / 8 ms):
    //   REF   seg1 tau  6.78 / 5.15 / 4.79 / 4.52 / 4.33 ms
    //         seg2 tau  1.10 / 1.21 / 1.20 / 1.21 / 1.21 ms   <- flat
    //   OURS  seg1 tau  4.34 / 3.65 / 3.61 / 3.60 / 3.62 ms
    //         seg2 tau  4.17 / 3.98 / 3.96 / 3.96 / 3.95 ms   <- one rate
    // The machine's second segment reads 1.2 ms at every window from 1 to 8 ms.
    // A statistic that does not move as the window changes by 8x is not a
    // window effect. The corner sits at the -16 dB crossing, 10.0 ms in on the
    // least-smeared (1 ms) read.
    //
    // WHY THIS IS NOT THE CLOSED QUESTION. d4cae29 proved no ADDITIVE decay
    // stage can reach this: a sum of exponentials is a log-sum-exp of affine
    // functions, so its dB envelope can only ever DEcelerate. That proof is
    // sound and it is not violated here, because this stage is MULTIPLICATIVE.
    // In dB a product is a sum, so exp(-t/tau) x exp(-(t-t0)/g) is piecewise
    // linear with a STEEPER second segment — an accelerating decay, reachable,
    // and reachable only this way. The circuit reading is a damper that lands
    // on the ringing network when the trigger one-shot's pulse ends, and it is
    // the exact mirror of the clap's cpTailSlow (e91ba61), where a junction
    // LEAVING the load made the decay slow down instead.
    //
    // NOR IS IT THE TRUNCATION THAT WAS DISPROVED. Truncation is an instant cut
    // to zero and reads tail tonality 0.000. This keeps ringing to -70 dB over
    // the following 5 ms; the tail frames still hold real signal.
    //
    // MEASURED FIRST, THEN LADDERED, AND THE TWO AGREE. rsGateAt 0.010 is the
    // measured corner. rsGateTau 0.0022 against the modes' own ~4 ms gives an
    // effective second-segment tau of 1.4 ms by hand and 1.58 ms measured, in
    // reach of the machine's 1.20 from 3.96. Both won a joint 8x7 grid, not a
    // coordinate descent — the neighbourhood reads 0.04-0.06 throughout, so
    // this is a plateau rather than a spike.
    //
    // STILL SHORT, DISCLOSED. Our seg2 reads 1.58 ms against the machine's
    // 1.20, so the damper is about 30% slow even at the objective's optimum,
    // and the per-frame bed measurement at 11.6 ms reads 0.886 tonal against
    // the machine's 0.704. There is a real broadband-in-the-tail remainder
    // underneath this; the damper is most of the answer, not all of it.
    rsGateAt: 0.010, rsGateTau: 0.0022,

    // TOMS. Decay per family from the corpus, taken at the middle of each
    // TUNING knob, with the small shortening the knob actually causes folded in
    // as `tomTauTilt` (LT 89.9→86.1 ms over the whole knob is −4.2%).
    ltTau: 0.0875, mtTau: 0.0579, htTau: 0.0418,
    tomTauTilt: -0.05,
    // The bridged-T's pitch drop. Small — a tom is nearly a steady sine by
    // 10 ms, unlike the kick, which sweeps 2.4x.
    tomDrop: 0.09, tomDropTau: 0.014,
    tomClick: 0.16, tomClickHp: 1800, tomClickTau: 0.0016,
  };
  U.CIRCUIT_808 = CIRCUIT;

  // ---- bass drum -----------------------------------------------------------

  function bassDrum(p, rnd) {
    const tau = p.bdDecay;
    const x = alloc(Math.min(2.6, tau * 8 + 0.06));
    const fEnd = p.bdTune;
    const fStart = fEnd * 2.4;
    // A higher-tuned drum sweeps down faster — the network's Q rises with pitch.
    const tauP = 0.03183 - 0.013 * p.pos.bdTune;
    let ph = 0, ph2 = 0;
    for (let i = 0; i < x.length; i++) {
      const t = i / SR;
      const f = fEnd + (fStart - fEnd) * Math.exp(-t / tauP);
      ph += (2 * Math.PI * f) / SR;
      ph2 += (2 * Math.PI * f * 2) / SR;
      // ONSET.bdDepth is ZERO on purpose — see ONSET above. The machine's kick
      // is at full amplitude on its first half-cycle; the 14 ms "rise" the rig
      // reports is its own window rippling against a 55 Hz waveform. The term
      // stays so analysis/onset-ladder.mjs can re-derive that, and multiplies
      // by exactly 1.0 while the depth is zero.
      const env = Math.exp(-t / tau) * (1 - ONSET.bdDepth * Math.exp(-t / ONSET.bdRise));
      x[i] = (Math.sin(ph) + 0.13 * Math.sin(ph2) * Math.exp(-t / 0.012)) * env;
    }
    // TONE: the trigger pulse itself, high-passed, sitting in front of the ring.
    const cn = Math.round(0.006 * SR);
    const click = new Float32Array(cn);
    for (let i = 0; i < cn; i++) {
      const t = i / SR;
      click[i] = ((rnd() * 2 - 1) * 0.5 + (i === 0 ? 1 : 0)) * Math.exp(-t / 0.0009);
    }
    onePoleHP(click, 1400);
    for (let i = 0; i < cn && i < x.length; i++) x[i] += click[i] * p.bdTone * 0.9;
    // HALF-CYCLE ASYMMETRY, 2026-08-17. See CIRCUIT.bdAsym. Applied BEFORE the
    // output-stage saturation, because on the machine it is the ringing network
    // that is asymmetric and the output stage that then rounds the result — the
    // other order would have the saturator flatten the asymmetry it is supposed
    // to pass on. At bdAsym = 0 this loop is `x + 0*x*x`, which is exactly x in
    // IEEE754, so the drum is bit-identical to one without the term.
    if (CIRCUIT.bdAsym !== 0) {
      for (let i = 0; i < x.length; i++) x[i] = x[i] + CIRCUIT.bdAsym * x[i] * x[i];
      onePoleHP(x, 12);   // the output stage's AC coupling: take the DC back out
    }
    // output-stage saturation: rounds the transient, thickens the fundamental
    const k = Math.tanh(1.25);
    for (let i = 0; i < x.length; i++) x[i] = Math.tanh(x[i] * 1.25) / k;
    return normalize(shape(x), 0.98 * p.bdLevel);
  }

  // ---- snare ---------------------------------------------------------------

  // DECAY, read off the machine's own panel grid rather than fitted blind.
  //
  // The 08-11 rig's Finding 1 (snare decay far too long) and Finding 4 (our TONE
  // knob lengthens the hit; the machine's does not) are the same bug seen twice,
  // and measuring the corpus's 25 TONE x SNAPPY cells says what the shape should
  // be. Machine tauMs, rows TONE 0..100, cols SNAPPY 0..100:
  //
  //            sn0   sn25   sn50   sn75  sn100
  //    tn0    28.5   28.5   28.7   31.0   30.4
  //   tn25    28.5   28.6   28.4   29.8   30.6
  //   tn50    27.5   27.6   28.4   29.4   32.6
  //   tn75    22.3   22.4   26.8   30.6   31.8
  //  tn100    16.1   16.1   25.4   29.5   31.3
  //
  // Read the edges. At SNAPPY 0 the tail is the drum alone (the machine's tail
  // tonality there is 0.98-0.99 at every TONE), so that column IS the body decay:
  // 28.5 ms falling to 16.1 as TONE opens. At SNAPPY 100 the tail is the noise,
  // and it sits at ~31 ms no matter where TONE is. So the machine's TONE shortens
  // the BODY and leaves the NOISE alone — ours did the opposite, stretching the
  // noise from 32 to 137 ms while the drum barely moved. Hence:
  //
  //   tauBody  = 16.1 ms + 12.4 ms * (1 - TONE)     the sn0 column, endpoint to endpoint
  //   tauNoise = 32 ms, flat                         the sn100 row, which is flat
  //
  // Laddered over all 25 cells against the machine (mean |log ratio|, lower is
  // better) — the shaped model beats both today's and a fully flat pair:
  //
  //   candidate                       tau     t20     t40
  //   current                      1.0465  0.9851  1.0097
  //   flat 32/26 (no TONE term)    0.1091  0.2292  0.1037
  //   16.1+12.4 / 32 flat  <-      0.1004  0.1820  0.0892
  //
  // TONE now only moves the noise's bandpass, which is what a TONE knob is for.
  function snareDrum(p, rnd) {
    const tauBody = 0.01687 + 0.0124 * (1 - p.pos.sdTone);
    const tauNoise = 0.032;
    const x = alloc(Math.max(tauBody, tauNoise) * 7 + 0.03);
    const noise = new Float32Array(x.length);
    for (let i = 0; i < noise.length; i++) noise[i] = rnd() * 2 - 1;
    bandpass(noise, 572.1 + 3300 * p.pos.sdTone, 0.85);
    onePoleHP(noise, 700);
    const f1 = p.sdTune, f2 = f1 * 1.83;
    const snap = p.sdSnappy;
    let p1 = 0, p2 = 0;
    for (let i = 0; i < x.length; i++) {
      const t = i / SR;
      p1 += (2 * Math.PI * f1) / SR;
      p2 += (2 * Math.PI * f2) / SR;
      const body = (Math.sin(p1) + 0.62 * Math.sin(p2)) * Math.exp(-t / tauBody);
      const nz = noise[i] * Math.exp(-t / tauNoise);
      // The noise term used to be `0.30 + 0.95 * snap` — a floor of 0.30 that no
      // SNAPPY setting could remove, so our snare was never the tonal drum the
      // machine is at SNAPPY 0 (tail tonality 0.98-0.99 there, ours ~0.5). Same
      // value at snap = 1 (1.25), but the knob now actually reaches zero.
      x[i] = body * (1 - 0.60 * snap) + nz * (1.25 * snap);
    }
    return normalize(shape(x), 0.95 * p.sdLevel);
  }

  // ---- hats ----------------------------------------------------------------
  // The machine's six metallic oscillators. Fixed, inharmonic, and the reason
  // an 808 hat sounds like nothing else.
  const OSC = [205.3, 304.4, 369.6, 522.7, 540.0, 800.0];

  // FREQUENCY JITTER — the thing that makes this a bank of oscillators rather
  // than a chord. Added 2026-08-13, and it is the largest single change in this
  // file since it was written.
  //
  // The machine's six oscillators are free-running Schmitt triggers, and their
  // edge timing is genuinely noisy. Six IDEAL squares are not: they are a line
  // spectrum, and the measurement said so loudly — tonal fraction 0.64-0.71 at
  // 20-40 ms against the reference machine's 0.24-0.27, on both hats, at every
  // panel position. That gap is why the 08-12 fitter AND Jeff's ear, blind to
  // each other, both ran ohTone to its darkest, least-detuned rail: they were
  // both trying to buy noise with a tone control, which does not sell it.
  //
  // WHAT WAS MEASURED BEFORE THIS WAS WRITTEN (analysis/hat-variants.mjs, twelve
  // candidates over both hats and three panel cells):
  //   detune spread   ±3% / ±8% per oscillator: tonality 0.64 -> 0.68 / 0.66.
  //                   NOTHING. Moving partials around does not fill the space
  //                   between them, and this was the obvious first idea.
  //   noise blend     15% / 35% band-limited noise: tonality does fall (0.19 /
  //                   0.09) — and the centroid rises 12856 / 14228 Hz against
  //                   the machine's 11122. It buys the number by making a
  //                   different, brighter instrument. Rejected on the centroid.
  //   extra partials  six more inharmonic oscillators: 0.58. Half the distance,
  //                   twice the CPU, and the bank stops being six oscillators.

// mixer, which is both slow to render and enormous in memory. Synthesizing each
// voice ONCE into a Float32Array and triggering it as an AudioBufferSourceNode

// voices, which is literally what the 1982 desk in front of us is.

// math at load time, nothing is a recording, and no audio ships with the piece.
// The project's "no samples ever" rule is intact.

// song's PRNG stream, so voice construction consumes no draws and can't shift
// the canonical draw order. Note the honest caveat: this code leans on Math.sin
// /Math.exp, whose last-bit results are engine-defined — the same class of
