  // generic closed hat standing in for the Linn's cabasa and tambourine — two
  // different instruments, one trim, so it is the mean of the pair.
  // Re-measured 2026-09-30 after the Linn's DAC/VCF revision and its
  // percussion group moving 3.5 dB down against the main voices (9/29 trims:
  // kick 4.2, snare 5.3, hats -4.2, tomsFills 0.8, ePerc 2.7, percTime -6.4,
  // percAccent 2.0). The trims hold each strip where the generic kit had it,
  // so the percussion strips come back up here by the same measurement.
  // Re-measured again for revision 3 (2026-09-30, the lossless refit, the
  // percussion group at -2.2 dB, the crash and ride on the hats strip; data
  // in analysis/fits/linn-kit-trim-r3-2026-09-30.json; revision-2 trims kick
  // 4.2, snare 4.9, hats -3.9, tomsFills 1.9, ePerc 6.2, percTime -2.3,
  // percAccent 5.0). Hats sd 1.1 dB with the ride songs' reference hat at
  // the hat's own hit gain; percTime sd 2.4 (tambourine vs cabasa, as above).
  // Re-measured for revision 4 (2026-10-01: kick second mode and output
  // coupling, snare body, the hat and cymbal chips' own clocks and output
  // filters, the conga strike; analysis/fits/linn-kit-trim-r4-2026-10-01.json;
  // revision-3 trims kick 4.2, snare 4.9, hats -5.3, tomsFills 4.3, ePerc 4.3,
  // percTime -5.8, percAccent 5.0). Kick sd 0.8, snare 0.9, hats 0.8.
  // The cymbals' hit gains on the hats strip (2026-09-30): the ride brought to
  // the closed hat's K-weighted loudness as an eighth-note line, the crash to
  // the open hat's as a single hit (harness/linn-cymbal-gain.mjs).
  const LINN_RIDE_GAIN = 0.242, LINN_CRASH_GAIN = 0.461;
  U.LINN_CYMBAL_GAIN = { ride: LINN_RIDE_GAIN, crash: LINN_CRASH_GAIN };  // read by harness/linn-kit-trim.mjs
  const LINN_TRIM_DB = { kick: 7.4, snare: 3.8, hats: -6.7, tomsFills: 4.3, ePerc: 4.3, percTime: -5.8, percAccent: 5.9 };

  // OB-Xa on the chord strips (sheet.polyVoice === "obxa", draw 31): which
  // patch each strip plays. No extra draw.
  const OBXA_FOR_STRIP = {
    compA: () => "comp",
    pad: () => "pad",
    color: (P) => (P.color.kind === "brassOffbeat" ? "brass" : "stab"),
  };
  // Patch-loudness trim for the OB-Xa, dB on the strip's trim gain (desk.js
  // guarantee 2), against the Juno patch it REPLACES on that strip (comp →
  // Juno comp, pad → Juno pad, brass/stab → Juno stab). MEASURED 2026-09-29,
  // harness/obxa-poly-trim.mjs (data in analysis/fits/obxa-poly-trim-2026-09-29.json):
  // two songs per pattern kind with the strip up, each song's real strip line
  // played solo through both voices, K-weighted loudness (BS.1770 pre-filter).
  // Mean gap Juno − OB-Xa over the songs:
  //   comp  +4.5 dB  (8 songs, sd 0.8)      brass −4.1 dB  (2 songs, sd 0.5)
  //   pad   +0.5 dB  (6 songs, sd 0.6)      stab  +0.8 dB  (2 songs, sd 0.1)
  // Plain RMS agrees within 0.3 dB (after the pulse-DC fix in obxa.js, which
  // this measurement found). Brass and stab rest on the two colour kinds' two
  // songs each; the section-hit lines are 8 notes.
  const OBXA_TRIM_DB = { comp: 4.5, pad: 0.5, brass: -4.1, stab: 0.8 };
  U.OBXA_TRIM_DB = OBXA_TRIM_DB;
  U.OBXA_FOR_STRIP = OBXA_FOR_STRIP;

  // FM keys on the chord strips (sheet.polyVoice === "fm", draw 31): compA
  // plays the tine EP, colour plays glass on section hits and FM brass on the
  // brass offbeats. The PAD is not an FM strip: it stays on the Juno pad
  // (null here). No extra draw.
  const FM_FOR_STRIP = {
    compA: () => "ep",
    pad: () => null,
    color: (P) => (P.color.kind === "brassOffbeat" ? "brass" : "glass"),
  };
  // Patch-loudness trims for the FM voice, dB on the strip's trim gain,
  // against the patch each FM patch REPLACES (ep → Juno comp on compA; glass
  // and brass → Juno stab on colour; FM bass → Juno bass on the bass strip).
  // MEASURED K-weighted 2026-10-01, harness/fm-trim.mjs (data in
  // analysis/fits/fm-trim-2026-10-01.json): three songs per pattern kind with
  // the strip up, each song's real strip line solo through both voices,
  // BS.1770 pre-filter. Mean gap reference − FM:
  //   ep    +0.6 dB (12 songs, sd 2.7)     brass −4.4 dB (3 songs, sd 0.1)
  //   glass −8.3 dB (3 songs, sd 0.2)      bass  −1.1 dB (33 songs, sd 1.3)
  // Plain RMS agrees within 0.7 dB. The EP's spread is its velocity: accent
  // and ghost comps move an FM EP's level and tone more than the Juno comp's,
  // so the gap depends on the pattern (−3.4..+5.1). Bass on non-sub808 lines
  // against Juno "bass" (the Minimoog's reference); on sub808 lines the Juno
  // "sub" reads +6.9 dB over the FM bass, the same Juno-sub gap the Minimoog
  // note in the README describes — left alone.
  const FM_TRIM_DB = { ep: 0.6, glass: -8.3, brass: -4.4, bass: -1.1 };
  U.FM_TRIM_DB = FM_TRIM_DB;
  U.FM_FOR_STRIP = FM_FOR_STRIP;
  U.MOOG_BASS_FOR_KIND = MOOG_BASS_FOR_KIND;

  // Bass guitar on the bass strip (sheet.bassVoice === "bassguitar", draw 21's
  // residual): the voicing per pattern kind, by lane. Finger is the default
  // session bass; funk slaps its 16th lines, riffs and one-note grooves; new
  // wave picks its octaves, eighths and riffs; synth-pop palm-mutes its
  // eighths and quarters. pedal and sub808 never reach here
  // (U.BASSGUITAR_NEVER).
  const BASSGUITAR_FOR_KIND = (kind, lane) => {
    if (kind === "synco16" || kind === "seq16") return lane === "funk" ? "slap" : "finger";
    if (kind === "oneNote") return lane === "funk" ? "slap" : "finger";
    if (kind === "octaveAlt" || kind === "octavePush") return lane === "newWave" ? "pick" : "finger";
    if (kind === "rootEighths" || kind === "rootQuarters") return lane === "synthPop" ? "muted" : lane === "newWave" ? "pick" : "finger";
    if (kind === "riffHook") return lane === "funk" ? "slap" : lane === "newWave" ? "pick" : "finger";
    return "finger";                                   // walk, octaveSlide
  };
  U.BASSGUITAR_FOR_KIND = BASSGUITAR_FOR_KIND;
  // Voicing-loudness trims, dB on the bass strip's trim gain, against the
  // Juno "bass" patch at 0 dB (the reference every bass-strip trim uses).
  // MEASURED K-weighted 2026-10-01, harness/bassguitar-trim.mjs (data in
  // analysis/fits/bassguitar-trim-2026-10-01.json): songs that drew the bass
  // guitar, three per (lane, pattern kind), each song's real bass-strip line
  // (after the session player) solo through the Juno bass and through the
  // voicing it drew, BS.1770 pre-filter. Mean gap Juno bass − voicing:
  //   finger −1.5 dB (25 songs, sd 1.1)     muted +11.1 dB (3 songs, sd 0.3)
  //   pick   +1.2 dB (9 songs, sd 0.3)      slap   +1.1 dB (6 songs, sd 1.4)
  // Plain RMS agrees within 0.2 dB. The muted note is short by design (a
  // palm-muted eighth against the Juno's held one), hence its large trim;
  // muted rests on synth-pop's three root-eighths songs.
  const BASSGUITAR_TRIM_DB = { finger: -1.5, pick: 1.2, muted: 11.1, slap: 1.1 };
  U.BASSGUITAR_TRIM_DB = BASSGUITAR_TRIM_DB;

  // The human shakers on the percTime strip (sheet.percShakers, draw 17's
  // residual): the voicing for the pattern, by lane. Running 16ths are the
  // shaker's part (the cabasa's on funk, the Linn cabasa's human twin);
  // eighths go to the maracas on new wave and synth R&B and stay on the
  // shaker elsewhere; the off-beat 16ths are a shaker part.
  U.SHAKERS_FOR_PATTERN = function (id, lane) {
    if (id === "perctime.16ths") return lane === "funk" ? "cabasa" : "shaker";
    if (id === "perctime.8ths") return lane === "newWave" || lane === "synthRnB" ? "maracas" : "shaker";
    return "shaker";
  };
  // Shaker strip trims, dB on the percTime strip's trim gain (this REPLACES
  // the strip's trim — on a Linn song the Linn's −5.8 dB), so the human
  // instrument sits where the voice it replaces sat. Keyed by THAT voice — the
  // kit's quiet closed hat (hit gain 0.30, every non-Linn kit), the Linn's
  // cabasa (16ths, 8ths) or its tambourine (off16) — then by voicing.
  // MEASURED K-weighted 2026-10-02, harness/shakers-trim.mjs (data:
  // analysis/fits/shakers-trim-2026-10-02.json): songs whose draw 17 residual
  // drew the shakers, four per (lane, pattern, machine), strip up; the strip's
  // real strokes after the session player solo through the shakers at 0 dB,
  // and the same song's kit hits on the strip solo through its own kit with
  // its strip trim, BS.1770 pre-filter. Mean gap (kit − shakers):
  //   closed hat → shaker  +1.5 dB (20 songs, sd 1.4)
  //   closed hat → cabasa  −4.4 dB (4, sd 0.5)
  //   Linn cabasa → shaker −6.1 dB (20, sd 1.1)
  //   Linn cabasa → maracas −13.9 dB (8, sd 2.2)
  //   Linn cabasa → cabasa −13.0 dB (4, sd 0.8)
  //   Linn tambourine → shaker −1.1 dB (16, sd 1.1)
  // RMS agrees within 0.2 dB. The rest are never drawn (off16 is always the
  // shaker; maracas only on new wave and synth R&B, whose machine is always
  // the Linn) and are DERIVED, for the legacyDrums A/B only: the voicing's gap
  // to the shaker over the Linn cabasa, added to that voice's shaker trim.
  const SHAKERS_TRIM_DB = {
    hatClosed: { shaker: 1.5, cabasa: -4.4, maracas: -6.3 },
    cabasa: { shaker: -6.1, maracas: -13.9, cabasa: -13.0 },
    tamb: { shaker: -1.1, maracas: -8.9, cabasa: -8.0 },
  };
  U.SHAKERS_TRIM_DB = SHAKERS_TRIM_DB;
  // AUDIBILITY ALLOWANCE, dB added to the measured trim per voicing (set by
  // the render check, NOT by the loudness measurement — Fable may weigh it).
  // At equal K-weighted loudness the shaker's energy sits in a narrow band
  // above ~5 kHz, where the voices it replaces spread wider, so it lights
  // fewer time-frequency cells over the mix: on ff4411a4 (synth-pop eighths
  // over the Linn cabasa) it failed the audibility gate at the measured trim
  // (lit fraction 0.0008; the Linn cabasa it replaced read 0.0021, the floor
  // is 0.002), read 0.0017 at +3 dB and 0.0031 at +6 dB; two of the other
  // three shaker songs sat near the floor too (0.0026, 0.0045). So +6 dB on
  // the shaker voicing everywhere. The maracas the same way: 9e56db24 (synth
  // R&B eighths over the Linn cabasa) read 0.0014 at the measured trim (the
  // other maracas song 0.0036), so +4 dB. The cabasa as measured (0.0042 and
  // 0.0173 on its two songs).
  const SHAKERS_AUDIBLE_DB = { shaker: 6, maracas: 4, cabasa: 0 };
  U.SHAKERS_AUDIBLE_DB = SHAKERS_AUDIBLE_DB;
  // the stroke velocity the percTime strip hands the player (before the
  // section level); the strip trim sets the loudness
  const SHAKER_VEL = 0.8;

  // The human hand drums on the percAccent strip (sheet.percCongas, draw 18's
  // residual): the voicing for the pattern, by lane. The tumbao and the
  // single hit are conga parts; the two-hit phrase ending goes to the bongos
  // on synth-pop and new wave (a lighter, higher answer) and the congas
  // elsewhere.
  U.CONGAS_FOR_PATTERN = function (id, lane) {
    if (id === "percaccent.phrase_end") return lane === "synthPop" || lane === "newWave" ? "bongos" : "congas";
    return "congas";
  };
  const CONGA_PATTERN = { "percaccent.tumbao": "tumbao", "percaccent.sparse": "sparse", "percaccent.phrase_end": "phrase_end" };
  // Hand-drum strip trims, dB on the percAccent strip's trim gain (REPLACES the
  // strip's trim — on a Linn song the Linn's), so the human drums sit where
  // the congas they replace sat. Keyed by THAT voice — the generic kit's
  // congaHi / congaLo (drums.js, every non-Linn kit: the 808 panel does not
  // own congas) or the Linn's conga chips — then by voicing. MEASURED
  // K-weighted 2026-10-02, harness/congas-trim.mjs (data:
  // analysis/fits/congas-trim-2026-10-02.json): songs whose draw 18 residual
  // drew the hand drums, four per (lane, pattern, machine), strip up; the
  // strip's real strokes after the conga player (ghosts included) solo through
  // the voicing at 0 dB, and the same song's kit hits on the strip solo
  // through its own kit with its strip trim, BS.1770 pre-filter. Mean gap
  // (kit − drums):
  //   kit congas  → congas +2.9 dB (24 songs, sd 1.4)
  //   Linn congas → congas +3.1 dB (40, sd 2.1)
  //   Linn congas → bongos +3.4 dB (8, sd 1.4)
  // RMS agrees within 0.1 dB. kit → bongos is never drawn (the bongos play
  // the phrase ending on synth-pop and new wave, whose machine is always the
  // Linn) and is DERIVED for the legacyDrums A/B: the bongos' gap to the
  // congas over the Linn, added to the kit's congas trim.
  const CONGAS_TRIM_DB = {
    kit: { congas: 2.9, bongos: 3.2 },
    linn: { congas: 3.1, bongos: 3.4 },
  };
  U.CONGAS_TRIM_DB = CONGAS_TRIM_DB;
  // the written hits' velocities handed to the conga player (before the
  // section level): the kit's 0.6 / 0.7 hit gains, scaled so a written open
  // tone sits at the voice's reference touch (0.8)
  const CONGA_VEL = { tumbao: 0.8, sparse: 0.8, phrase_end: 0.9 };

  // The rhythm guitar on the rhythmGtr strip (draws 85–87, 2026-10-03). The
  // phrase mask (draw 86) picks which bars of each four-bar phrase the guitar
  // plays: mostly every bar (a rhythm part is a part), sometimes laying out
  // for a bar, sometimes every other bar.
  const GTR_PHRASE = ["xxxx", "xxxx", "xxxx", "xxx.", "xx.x", ".xxx", "x.x.", "xxxx"];
  U.GTR_PHRASE = GTR_PHRASE;
  // Strip trim, dB on the rhythmGtr strip's trim gain, per voicing: the
  // guitar replaces nothing, so it is set against the compA comp it plays
  // alongside — the guitar strip solo 2-3 dB under the compA strip solo,
  // K-weighted (BS.1770 pre-filter), on songs where both are up.
  // MEASURED 2026-10-03, harness/rhythm-guitar-trim.mjs (data:
  // analysis/fits/rhythm-guitar-trim-2026-10-03.json): 60 songs, four per
  // (lane, voicing) where drawn, guitar and compA both up; each part's real
  // events over the first 40 s played solo through its own instrument (compA
  // with its poly trim and lane-leaned fader, the guitar at 0 dB with its
  // fader). Mean trim: funk +2.4 dB (20 songs, sd 2.9), skank 0.0 (20, sd
  // 4.5; one song at −16.2 where compA's comp sits far over the guitar — the
  // other 19 average +0.9), chop −1.4 (20, sd 2.9). RMS agrees within 0.2 dB.
  const GTR_TRIM_DB = { funk: 2.4, skank: 0.0, chop: -1.4 };
  U.GTR_TRIM_DB = GTR_TRIM_DB;

  U.realizeSession = function (ctx, desk, sheet, R, t0, opts) {
    opts = opts || {};
    const s16 = (60 / sheet.bpm) / 4;
    const swing = sheet.swing;
    const scale = SCALES[sheet.mode];
    const P = sheet.picks;
    let events = 0;

    // ---- the mixing board, set before a note is scheduled ----
    // Order matters: the lane's mix lean multiplies the house faders, the
    // production style sets the room, then the mutes decide what is up. Nothing
    // here adds or removes a node, so the fan-in ≤2 contract is untouched.
    desk.applyLaneMix(sheet.lane);
    U.applyProduction(desk, sheet.production);
    for (const id in sheet.mutes) desk.setMute(id, sheet.mutes[id]);
    // A muted strip's fader is at zero, so skipping its scheduling below is an
    // optimization, not a second decision. Read the desk, not the sheet.
    const up = (id) => !desk.strips[id].muted;

    // Per-lane arrangement lean: when each strip enters the arrangement.
    // earlyHipHop pulls the drums in early and holds the pitched strips back.
    const entry = Object.assign({}, ENTRY);
    const entryBias = (U.LANE_ARRANGE[sheet.lane] || {}).entry;
    if (entryBias) for (const id in entryBias) entry[id] = (entry[id] || 0) + entryBias[id];

    const infl = (patch) => sheet.influencePatches.indexOf(patch) > -1;

    const stepT = (bar, i) => t0 + (bar * 16 + i) * s16 + (i % 2 ? swing * s16 : 0);

    // --- harmony resolution ---
    const chorusChords = sheet.harmony.chorus || null;
    function chordAt(bar) {
      const b = sheet.bars[bar];
      const list = (b.section === "chorus" && chorusChords) ? chorusChords : sheet.harmony.chords;
      const idx = Math.floor(bar / sheet.harmony.barsPer) % list.length;
      return { deg: list[idx][0], type: list[idx][1] };
    }
    const bassMidi = (deg) => fold(36 + sheet.tonicPc + deg, 33, 44);
    const midMidi = (deg) => fold(60 + sheet.tonicPc + deg, 55, 66);
    function tones(rootMidi, type, n) {
      const iv = U.CHORD_INTERVALS[type] || U.CHORD_INTERVALS.m;
      const out = [];
      for (let i = 0; i < (n || iv.length); i++) out.push(rootMidi + iv[i % iv.length] + 12 * Math.floor(i / iv.length));
      return out;
    }
    // scale degree index -> midi, relative to the tonic
    const degMidi = (base, d) => base + scale[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);

    // --- instruments ---
    const kitStrips = {};
    for (const id of ["kick", "snare", "hats", "tomsFills", "ePerc", "percTime", "percAccent"]) kitStrips[id] = desk.strips[id];
    // The kit's machine is drawn (draw 69, U.DRUM_MACHINE): the 808 on the
    // machine lanes, the Linn-family machine on the studio lanes, either on
    // funk. legacyDrums still builds the generic drums.js kit for an A/B.
    // A Linn kit carries its measured K-weighted trim per strip (LINN_TRIM_DB
    // below), so swapping the machine does not move the mix.
    const machine = opts.legacyDrums ? null : sheet.drumMachine;
    const use808 = machine === "808" && sheet.kit === "machine";
    const useLinn = machine === "linn";
    if (useLinn) for (const id in kitStrips) kitStrips[id].trim.gain.value = Math.pow(10, (LINN_TRIM_DB[id] || 0) / 20);
    const kit = U.createDrumKit(ctx, kitStrips, sheet.kit, use808 ? sheet.panel808 : useLinn ? sheet.panelLinn : null);
    const lv = (e, dflt) => (useLinn && e.linnVoice) || e.voice || dflt;
    // The Linn's cymbals (2026-09-30), on the hats strip: the CRASH on the
    // first downbeat of the song and of every new section (the form's section
    // boundaries, sheet.bars), the RIDE in place of the closed hat for the
    // whole song when the sheet drew it. Their hit gains bring each to the
    // closed hat's loudness on the strip, measured K-weighted
    // (harness/linn-cymbal-gain.mjs), so the strip's trim holds.
    const rideSong = useLinn && sheet.linnRide;
    const crashOn = useLinn && up("hats");

    // The bass strip's instrument is drawn (draw 21, U.BASS_VOICE). Juno:
    // "sub" on sub808 patterns, "bass" otherwise. Minimoog: the lane patch for
    // the pattern kind, with its measured trim on the strip.
    let bassInst, bgVoicing = null;
    if (sheet.bassVoice === "bassguitar") {
      // the session player (sheet.bassPlayer, drawn by buildSong from a fork
      // of the hash, src/session/bassplayer.js) plays the line in the bar loop
      bgVoicing = BASSGUITAR_FOR_KIND(P.bass.kind, sheet.lane);
      desk.strips.bass.trim.gain.value = Math.pow(10, BASSGUITAR_TRIM_DB[bgVoicing] / 20);
      bassInst = U.createBassGuitar(ctx, desk.strips.bass, bgVoicing);
    } else if (sheet.bassVoice === "fm") {
      desk.strips.bass.trim.gain.value = Math.pow(10, FM_TRIM_DB.bass / 20);
      bassInst = U.createFm(ctx, desk.strips.bass, "bass");
    } else if (sheet.bassVoice === "minimoog") {
      const moogPatch = MOOG_BASS_FOR_KIND[P.bass.kind] || "round";
      desk.strips.bass.trim.gain.value = Math.pow(10, MOOG_BASS_TRIM_DB[moogPatch] / 20);
      bassInst = U.createMinimoog(ctx, desk.strips.bass, moogPatch);
    } else {
      bassInst = U.createJuno(ctx, desk.strips.bass, P.bass.kind === "sub808" ? "sub" : "bass");
    }
    // The chord strips' poly synth is drawn too (draw 31, U.POLY_VOICE). OB-Xa:
    // the patch for the strip (colour follows its pattern: brass on the brass
    // offbeats, stab on section hits), its measured trim on the strip, and one
    // slop seed (draw 32) for all three strips — one machine on the session.
    // FM: the strip's FM patch and its measured trim; the pad stays Juno.
    const poly = (strip, junoPatch) => {
      if (sheet.polyVoice === "fm") {
        const fp = FM_FOR_STRIP[strip](P);
        if (!fp) return U.createJuno(ctx, desk.strips[strip], junoPatch);
        desk.strips[strip].trim.gain.value = Math.pow(10, FM_TRIM_DB[fp] / 20);
        return U.createFm(ctx, desk.strips[strip], fp);
      }
      if (sheet.polyVoice !== "obxa") return U.createJuno(ctx, desk.strips[strip], junoPatch);
      const op = OBXA_FOR_STRIP[strip](P);
      desk.strips[strip].trim.gain.value = Math.pow(10, OBXA_TRIM_DB[op] / 20);
      return U.createObxa(ctx, desk.strips[strip], op, null, sheet.polySeed);
    };
    // The percTime strip's instrument: the kit's voice, or (sheet.percShakers,
    // draw 17's residual) a session percussionist's shaker, maracas or cabasa
    // played through the shaker player (sheet.shakerPlayer, a fork of the
    // hash). Created only when drawn and the strip is up, so a song without
    // the shakers builds exactly the graph it always did. On a Linn song the
    // human instrument replaces the Linn's cabasa / tambourine on this strip.
    let shakersInst = null;
    if (sheet.percShakers && up("percTime")) {
      const replaced = lv(P.percTime, "hatClosed");
      desk.strips.percTime.trim.gain.value = Math.pow(10, ((SHAKERS_TRIM_DB[replaced] || SHAKERS_TRIM_DB.hatClosed)[sheet.percShakers] + SHAKERS_AUDIBLE_DB[sheet.percShakers]) / 20);
      shakersInst = U.createShakers(ctx, desk.strips.percTime, sheet.percShakers);
    }
    // The percAccent strip's instrument: the kit's congas, or (sheet.percCongas,
    // draw 18's residual) a session percussionist's congas or bongos played
    // through the conga player (sheet.congaPlayer, a fork of the hash).
    // Created only when drawn and the strip is up, so a song without them
    // builds exactly the graph it always did. On a Linn song the human drums
    // replace the Linn's conga chips on this strip.
    let congasInst = null;
    if (sheet.percCongas && up("percAccent")) {
      desk.strips.percAccent.trim.gain.value = Math.pow(10, CONGAS_TRIM_DB[useLinn ? "linn" : "kit"][sheet.percCongas] / 20);
      congasInst = U.createCongas(ctx, desk.strips.percAccent, sheet.percCongas);
    }
    // The rhythmGtr strip's instrument (draws 85–87): the rhythm guitar in the
    // voicing for its pattern, played through the session guitarist
    // (sheet.gtrPlayer, a fork of the hash, gtrplayer.js). Created only when
    // the strip is up, so a song whose guitar is muted builds exactly the
    // graph it always did.
    let gtrInst = null;
    if (sheet.gtrVoicing && up("rhythmGtr") && sheet.gtrPlayer) {
      desk.strips.rhythmGtr.trim.gain.value = Math.pow(10, GTR_TRIM_DB[sheet.gtrVoicing] / 20);
      gtrInst = U.createRhythmGuitar(ctx, desk.strips.rhythmGtr, sheet.gtrVoicing);
    }
    const inst = {
      bass: bassInst,
      compA: poly("compA", "comp"),
      pad: poly("pad", "pad"),
      arp: U.createJuno(ctx, desk.strips.arp, "arp"),
      lead: U.createJuno(ctx, desk.strips.lead, "lead"),
      counter: U.createJuno(ctx, desk.strips.counter, "arp"),
      color: poly("color", "stab"),
    };
    // `lvl` is the current bar's section level; every velocity and drum gain
    // rides it, so the whole band gets louder into a chorus.
    let lvl = 1;
    const note = (part, t, midi, vel, dur) => { inst[part].noteOn(t, midi, vel * lvl, dur); events++; };
    // `accent` is the machine's accent track. The books don't carry one, so it
    // is derived the way an 808 is actually programmed: the quarter-note steps
    // of the bar get the accent. Ignored entirely by the generic kit.
    const hit = (strip, voice, t, gain, accent) => { kit.fire(strip, voice, t, gain * lvl, accent); events++; };
    const beat = (i) => i % 4 === 0;

    // effective energy after the density dial (sparse ↔ dense)
    const eff = (e) => e + (sheet.density - 0.5) * 0.30;
    const on = (role, bar) => up(role) && eff(sheet.bars[bar].energy) >= entry[role];

    // foreground: the voice the song is about gets in earlier; the other backs off
    const leadEntry = sheet.foreground === "lead" ? entry.lead - 0.2 : entry.lead + 0.25;

    // ---- the bar loop. ONE draw per bar, used for every variation decision. ----
    for (let bar = 0; bar < sheet.totalBars; bar++) {
      const b = sheet.bars[bar];
      const v = R.r();                                  // the bar's variation draw
      lvl = SECTION_LEVEL[b.section];
      const ch = chordAt(bar);
      const nch = chordAt(Math.min(bar + 1, sheet.totalBars - 1));
      const bRoot = bassMidi(ch.deg);
      const mRoot = midMidi(ch.deg);
      const bTones = tones(bRoot, ch.type, 4);
      const mTones = tones(mRoot, ch.type, 4);
      const dense = eff(b.energy);

      // --- kick ---
      if (P.kick.p && on("kick", bar)) {
        const pat = P.kick.p;
        for (let i = 0; i < 16; i++) {
          if (pat[i] === "." ) continue;
          if (P.kick.halftime && bar % 2 === 1) continue;
          hit("kick", "kick", stepT(bar, i), i === 0 ? 1.0 : 0.88, beat(i));
        }
      }
      // reggae one-drop couples snare to the kick on beat 3 — the kick half is
      // patched at sheet time, this is the snare half of the same patch
      const oneDrop = infl("oneDrop");

      // --- snare ---
      if (P.snare.p && on("snare", bar)) {
        const voice = P.snare.clap ? "clap" : "snare";
        const pat = oneDrop ? "........x......." : P.snare.p;
        for (let i = 0; i < 16; i++) {
          const c = pat[i];
          if (c === ".") continue;
          if (c === "g") hit("snare", "snare", stepT(bar, i), 0.22);
          else {
            hit("snare", voice, stepT(bar, i), 0.95, beat(i));
            // clap patterns double the clap with a quiet snare body
            if (P.snare.clap) hit("snare", "snare", stepT(bar, i), 0.35, beat(i));
          }
        }
      }

      // --- hats ---
      if (P.hats.p && on("hats", bar)) {
        for (let i = 0; i < 16; i++) {
          const c = P.hats.p[i];
          if (c === ".") continue;
          // dub strip dropouts: whole bars of hats vanish
          if (infl("dropouts") && v < 0.30) break;
          const hv = c === "o" ? "hatOpen" : rideSong ? "ride" : "hatClosed";
          hit("hats", hv, stepT(bar, i), (c === "o" ? 0.85 : (beat(i) ? 0.9 : 0.62)) * (hv === "ride" ? LINN_RIDE_GAIN : 1), beat(i));
        }
      }
      if (crashOn && b.indexInSection === 0) hit("hats", "crash", stepT(bar, 0), LINN_CRASH_GAIN, true);

      // --- tomsFills (fill windows only) ---
      if (b.fillWindow && on("tomsFills", bar)) {
        const k = P.tomsFills.kind;
        if (k === "accent") {
          hit("tomsFills", "tomLo", stepT(bar, 14), 0.9);
        } else if (k === "descend") {
          const steps = [10, 12, 13, 14], voices = ["tomHi", "tomHi", "tomMid", "tomLo"];
          for (let i = 0; i < 4; i++) hit("tomsFills", voices[i], stepT(bar, steps[i]), 0.85);
        } else if (k === "takeover") {
          const voices = ["tomHi", "tomHi", "tomMid", "tomMid", "tomLo", "tomLo", "tomLo", "tomLo"];
          for (let i = 0; i < 8; i++) hit("tomsFills", voices[i], stepT(bar, i * 2), 0.8 + 0.02 * i);
        }
      }

      // --- ePerc ---
      if (on("ePerc", bar)) {
        if (P.ePerc.kind === "congaRun") {
          const steps = [2, 3, 6, 10, 11, 14];
          for (let i = 0; i < steps.length; i++) hit("ePerc", i % 2 ? "congaLo" : "congaHi", stepT(bar, steps[i]), 0.7);
        } else if (P.ePerc.p2) {
          // 2-bar figure (the son clave) — the bar takes its own half, same as
          // the bass books' RIFF2. No accent, matching the 1-bar branch below:
          // the accent track is a kick/snare/hats behaviour on this strip today
          // and this entry is not the place to change that.
          const off = (bar % 2) * 16;
          for (let i = 0; i < 16; i++) {
            if (P.ePerc.p2[off + i] === ".") continue;
            hit("ePerc", lv(P.ePerc, "cowbell"), stepT(bar, i), 0.55);
          }
        } else if (P.ePerc.p) {
          for (let i = 0; i < 16; i++) if (P.ePerc.p[i] !== ".") hit("ePerc", lv(P.ePerc, "cowbell"), stepT(bar, i), 0.55);
        }
      }

      // --- percTime ---
      if (P.percTime.p && on("percTime", bar)) {
        if (shakersInst) {
          // the bar's strokes through the session percussionist (U.playShakerBar:
          // direction, timing, accent, touch, drift), into the human instrument
          const st = [];
          for (let i = 0; i < 16; i++) if (P.percTime.p[i] !== ".") st.push({ i, vel: SHAKER_VEL });
          for (const o of U.playShakerBar(st, { bar, s16, swing }, sheet.shakerPlayer)) {
            shakersInst.strike(stepT(bar, o.i) + o.off, o.vel * lvl, o.dir);
            events++;
          }
        } else {
          for (let i = 0; i < 16; i++) if (P.percTime.p[i] !== ".") hit("percTime", lv(P.percTime, "hatClosed"), stepT(bar, i), 0.30);
        }
      }

      // --- percAccent ---
      if (on("percAccent", bar) && congasInst) {
        // the bar's written hits (the kit's own: steps, drums) through the
        // session percussionist (U.playCongaBar: stroke types, ghost touches,
        // timing, accent, variation, drift), into the human drums
        const pk = CONGA_PATTERN[P.percAccent.id] || (P.percAccent.kind === "phraseEnd" ? "phrase_end" : "tumbao");
        const hits = [];
        if (P.percAccent.kind === "phraseEnd") { if (b.last) hits.push({ i: 12, vel: CONGA_VEL.phrase_end, drum: "hi" }, { i: 14, vel: CONGA_VEL.phrase_end, drum: "lo" }); }
        else if (P.percAccent.p) for (let i = 0; i < 16; i++) if (P.percAccent.p[i] !== ".") hits.push({ i, vel: CONGA_VEL[pk] || 0.8, drum: i % 3 ? "hi" : "lo" });
        if (hits.length) for (const o of U.playCongaBar(hits, { bar, s16, swing, pattern: pk }, sheet.congaPlayer)) {
          congasInst.strike(stepT(bar, o.i) + o.off, o.vel * lvl, o.drum, o.stroke);
          events++;
        }
      } else if (on("percAccent", bar)) {
        if (P.percAccent.kind === "phraseEnd") {
          if (b.last) { hit("percAccent", "congaHi", stepT(bar, 12), 0.7); hit("percAccent", "congaLo", stepT(bar, 14), 0.7); }
        } else if (P.percAccent.p) {
          for (let i = 0; i < 16; i++) if (P.percAccent.p[i] !== ".") hit("percAccent", i % 3 ? "congaHi" : "congaLo", stepT(bar, i), 0.6);
        }
      }

      // --- bass ---
      if (on("bass", bar)) {
        const k = P.bass.kind;
        // On a bass-guitar song the bar's notes are COLLECTED and the session
        // player plays them (U.playBassBar: timing, touch, length, ghosts,
        // slides); every synth bass plays them as written, as before.
        const barEv = bgVoicing ? [] : null;
        const put = bgVoicing
          ? (i, midi, vel, durSteps) => barEv.push({ i, midi, vel, dur: durSteps })
          : (i, midi, vel, durSteps) => note("bass", stepT(bar, i), midi, vel, durSteps * s16);
        if (k === "rootEighths") {
          for (let i = 0; i < 16; i += 2) put(i, bRoot, i === 0 ? 0.95 : 0.8, 1.7);
        } else if (k === "rootQuarters") {
          for (let i = 0; i < 16; i += 4) put(i, bRoot, 0.9, 3.6);
        } else if (k === "octaveAlt") {
          for (let i = 0; i < 16; i += 2) put(i, (i / 2) % 2 ? bRoot + 12 : bRoot, i % 4 === 0 ? 0.95 : 0.78, 1.6);
        } else if (k === "octavePush") {
          for (let i = 0; i < 16; i += 2) put(i, (i / 2) % 2 ? bRoot + 12 : bRoot, 0.9, 1.4);
          if (v < 0.5) put(15, bRoot + 12, 0.8, 1.0);
        } else if (k === "seq16") {
          for (let i = 0; i < 16; i++) put(i, bTones[i % 4] - (i % 8 < 4 ? 0 : 0), 0.72 + (i % 4 === 0 ? 0.2 : 0), 0.9);
        } else if (k === "walk") {
          put(0, bRoot, 0.95, 3.6); put(4, bRoot, 0.85, 3.6); put(8, bRoot, 0.85, 3.6);
          const target = bassMidi(nch.deg);
          put(12, bRoot + (target > bRoot ? 2 : -2), 0.8, 1.7);
          put(14, target - (target > bRoot ? 1 : -1), 0.8, 1.7);
        } else if (k === "synco16") {
          const mask = SYNCO16[sheet.masks.bass % SYNCO16.length];
          for (let i = 0; i < 16; i++) if (mask[i] !== ".") put(i, i % 8 === 0 ? bRoot : bTones[(i * 3) % 4], i === 0 ? 0.95 : 0.8, 1.1);
        } else if (k === "octaveSlide") {
          for (let i = 0; i < 16; i += 4) { put(i, bRoot, 0.9, 1.8); put(i + 3, bRoot + 12, 0.7, 0.9); }
        } else if (k === "pedal") {
          put(0, bRoot, 0.9, 15.5);
        } else if (k === "sub808") {
          put(0, bRoot, 1.0, 7.0); put(8, bRoot, 0.9, 6.5);
        } else if (k === "oneNote") {
          const mask = ONE_NOTE[sheet.masks.bass % ONE_NOTE.length];
          const pitch = bassMidi(sheet.harmony.chords[0][0]);
          for (let i = 0; i < 16; i++) if (mask[i] !== ".") put(i, pitch, i === 0 ? 0.95 : 0.78, 1.1);
        } else if (k === "riffHook") {
          const riff = RIFF2[sheet.masks.bass % RIFF2.length];
          const off = (bar % 2) * 16;
          for (let i = 0; i < 16; i++) {
            const c = riff[off + i];
            if (c === ".") continue;
            put(i, degMidi(bRoot, +c), i === 0 ? 0.95 : 0.82, 1.4);
          }
        }
        if (bgVoicing && barEv.length) {
          for (const n of U.playBassBar(barEv, { bar, s16, swing }, sheet.bassPlayer)) {
            const ex = {};
            if (n.mute) ex.mute = true;
            if (n.slide) ex.slide = n.slide;
            // slap: the octave and upper notes are popped, the rest thumbed
            if (bgVoicing === "slap" && !n.mute && n.midi >= bRoot + 7) ex.art = "pop";
            inst.bass.noteOn(stepT(bar, n.i) + n.off, n.midi, n.vel * lvl, n.dur * s16, ex);
            events++;
          }
        }
      }

      // --- compA ---
      if (on("compA", bar)) {
        const k = P.compA.kind;
        const chord = (i, vel, durSteps) => { for (const m of mTones) note("compA", stepT(bar, i), m, vel, durSteps * s16); };
        if (k === "grid") {
          for (let i = 0; i < 16; i++) if (P.compA.p[i] !== ".") chord(i, 0.8, 1.4);
        } else if (k === "hold") {
          chord(0, 0.75, 15.5);
        } else if (k === "gateChop") {
          const mask = GATE[sheet.masks.comp % GATE.length];
          for (let i = 0; i < 16; i++) if (mask[i] !== ".") chord(i, 0.7, 0.9);
        } else if (k === "rhodes16") {
          for (let i = 0; i < 16; i++) {
            if ((i + sheet.masks.comp) % 3 === 0) continue;
            note("compA", stepT(bar, i), mTones[(i * 2 + Math.floor(i / 4)) % mTones.length], 0.55, 1.2 * s16);
          }
        }
      }

      // --- rhythmGtr ---
      // the pattern's written strokes (U.gtrWritten: direction by the hand's
      // down-up) through the session guitarist (ghost chucks, timing, accent,
      // spread, variation, drift), on the bar's chord tones as compA has them
      if (gtrInst && on("rhythmGtr", bar) && GTR_PHRASE[sheet.masks.gtr % GTR_PHRASE.length][b.indexInSection % 4] === "x") {
        const pr = P.rhythmGtr;
        for (const o of U.playGtrBar(U.gtrWritten(pr), { bar, s16, swing, pattern: pr.id }, sheet.gtrPlayer)) {
          gtrInst.strike(stepT(bar, o.i) + o.off, o.vel * lvl, o.stroke, mTones, o.strings, o.spreadMul);
          events++;
        }
      }

      // --- pad ---
      if (on("pad", bar)) {
        const k = P.pad.kind;
        const wantSection = k !== "sectionOnly" || b.section === "chorus" || b.section === "bridge";
        if (wantSection) {
          if (k === "swell") {
            if (bar % 2 === 0) for (const m of mTones) note("pad", stepT(bar, 0), m + 12, 0.6, 2 * 16 * s16);
          } else {
            for (const m of mTones) note("pad", stepT(bar, 0), m + 12, 0.6, 15.6 * s16);
          }
        }
      }

      // --- arp ---
      if (on("arp", bar)) {
        const k = P.arp.kind;
        const t4 = tones(mRoot, ch.type, 4);
        for (let i = 0; i < 16; i++) {
          let midi = null;
          if (k === "up16") midi = t4[i % 4] + 12 * Math.floor((i % 8) / 4);
          else if (k === "updown16") { const seq = [0, 1, 2, 3, 4, 3, 2, 1]; midi = t4[seq[i % 8] % 4] + (seq[i % 8] >= 4 ? 12 : 0); }
          else if (k === "octavePulse") { if (i % 2) continue; midi = (i / 2) % 2 ? t4[0] + 12 : t4[0]; }
          else if (k === "random8") { if (i % 2) continue; midi = t4[(i * 5 + bar * 3) % 4] + (((i + bar) % 3 === 0) ? 12 : 0); }
          if (midi != null) note("arp", stepT(bar, i), midi, 0.6, 0.9 * s16);
        }
      }

      // --- lead ---
      if (up("lead") && eff(b.energy) >= leadEntry) {
        const k = P.lead.kind;
        const active = k === "soloWindow" ? (b.section === "bridge" || (b.section === "chorus" && v < 0.5)) : true;
        if (active) {
          const ph = PHRASES[(sheet.masks.lead + (k === "instrumental" ? 2 : 0)) % PHRASES.length];
          const off = (bar % 2) * 16;
          const base = midMidi(0) + 12;
          for (let i = 0; i < 16; i++) {
            const c = ph[off + i];
            if (c === "." || c === "-") continue;
            let dur = 1;
            while (off + i + dur < 32 && ph[off + i + dur] === "-") dur++;
            note("lead", stepT(bar, i), degMidi(base, +c), 0.85, dur * 1.05 * s16);
          }
        }
      }

      // --- counter ---
      if (on("counter", bar)) {
        const src = P.counter.kind === "ostinato" ? COUNTER_OST : PHRASES;
        const ph = src[sheet.masks.counter % src.length];
        // "answer" phrases sit in the gaps — second half of each 2-bar unit
        const active = P.counter.kind === "ostinato" || bar % 2 === 1;
        if (active) {
          const off = (bar % 2) * 16;
          const base = midMidi(0);
          for (let i = 0; i < 16; i++) {
            const c = ph[off + i];
            if (c === "." || c === "-") continue;
            note("counter", stepT(bar, i), degMidi(base, +c), 0.6, 1.3 * s16);
          }
        }
      }

      // --- color (the ORCH5-flavor stab) ---
      if (on("color", bar)) {
        if (P.color.kind === "sectionHit") {
          if (b.indexInSection === 0) for (const m of mTones) note("color", stepT(bar, 0), m, 0.9, 1.6 * s16);
        } else if (P.color.kind === "brassOffbeat") {
          for (const i of [6, 14]) for (const m of mTones) note("color", stepT(bar, i), m, 0.7, 1.2 * s16);
        }
      }
    }

    // A mono voice renders its line only once it has seen every note (note n+1
    // decides whether note n was legato) — see minimoog.js — and the OB-Xa's
    // and the FM voice's allocators need the whole line (obxa.js, fm.js). The
    // Juno has no flush(), so on a Juno strip this does nothing.
    for (const k of Object.keys(inst)) if (inst[k].flush) inst[k].flush();
    if (shakersInst) shakersInst.flush();
    if (congasInst) congasInst.flush();
    if (gtrInst) gtrInst.flush();

    // `retain` must stay reachable until startRendering() resolves — see the
    // determinism note in juno.js. The caller owns keeping it alive.
    return { events, lengthSec: sheet.lengthSec, retain: [kit, inst] };
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>
"use strict";
/* =========================================================================
   UNISON 808 — THE INSTRUMENT

   WHAT THIS IS. The whole machine, to play. All nine voices are hittable, all
   twenty-one knobs are on screen and forceable, and a sixteen-step pattern runs
   underneath so the kit is heard AS A KIT rather than as nine one-shots in a
   row. Every sound is synthesised here, now, from the engine's own tr808.js —
   the same file the song render calls. There are no samples anywhere in this
   page and there never will be.

   WHAT THIS ISN'T. Not a bench, and not an A/B. There is deliberately NOT ONE
   MEASUREMENT on this screen: no residuals, no decay figures, no reference to
   compare against. Numbers are Morgan's surface and ears are Jeff's, and the
   split is the point — the moment a figure appears here the page starts arguing
   with the ear instead of serving it. Tempo is a musical control, not a
   measurement, which is why it is the one number allowed.

   WHERE IT OPENS. At CENTRE for every knob a fit moved, because the centre now
   IS the fit — opening at a fitted position would apply it twice and give you a
   machine no token can draw. The knobs that were measured and DECLINED open at
   the shipped value, since nothing moved the centre onto those. Every one of
   them, and why, is in analysis/fits/. See analysis/build-instrument-page.mjs.

   ONE HARD RULE, same as the listening page: this page never writes anything.
   It reads no network, uploads nothing, and stores nothing.
   ========================================================================= */

var SR = 44100;
var NSTEP = 16;

var ENGINE_SRC = document.getElementById("src-engine").textContent;
var WORKER_BODY = document.getElementById("src-workerbody").textContent;
(new Function(ENGINE_SRC))();
var U = window.U;
var R808 = U.PANEL_808_RANGES;

/* =========================================================================
   THE VOICES — every one build808 returns, in the machine's own panel order.
   The roster is written here rather than derived, because the LABELS and the
   keyboard order are a human decision; but it is checked against the engine at
   boot, so a voice added to tr808.js can never go quietly missing from Jeff's
   instrument the way it did from render-voice.mjs.
   ========================================================================= */
var VOICES = [
  { id: "kick",      label: "bass drum" },
  { id: "snare",     label: "snare" },
  { id: "hatClosed", label: "closed hat" },
  { id: "hatOpen",   label: "open hat" },
  { id: "clap",      label: "hand clap" },
  { id: "rim",       label: "rim shot" },
  { id: "tomLo",     label: "low tom" },
  { id: "tomMid",    label: "mid tom" },
  { id: "tomHi",     label: "high tom" },
  // The machine kit's other three voices. On an 808 song the kit is
  // U.createDrumKit(ctx, strips, "machine", panel): the nine above come from
  // tr808.js, and these stay drums.js's generic machine voices (the note above
  // PANEL_VOICES in drums.js: the circuits exist, they are not written yet).
  // No knob moves them. Their buffers are taken from a real createDrumKit kit.
  { id: "cowbell",   label: "cowbell",    kit: true },
  { id: "congaHi",   label: "conga high", kit: true },
  { id: "congaLo",   label: "conga low",  kit: true }
];
var ROSTER_808 = VOICES.filter(function (v) { return !v.kit; });
// the hit gains session.js gives these strips (ePerc 0.55, percAccent 0.6):
// the generic voices are normalised hot, and at 1.0 they sit over the kit
var KIT_GAIN = { cowbell: 0.55, congaHi: 0.6, congaLo: 0.6 };
var KIT_ONLY = {};
VOICES.forEach(function (v) { if (v.kit) KIT_ONLY[v.id] = true; });

/* =========================================================================
   THE RACK — all twenty-one knobs, grouped the way the front panel groups
   them. Ends are named in words, never in units: "short → long" is what the
   hand is doing, and a figure there would be a target to hit instead of a
   sound to find.

   The level knobs ARE here, unlike on the listening page, and for the opposite
   reason: there is nothing to level-match against, so level is a real musical
   control — it is how the kit gets balanced.
   ========================================================================= */
var RACK = [
  [ { title: "bass drum", knobs: [
        { key: "bdTune",   label: "tune",   lo: "low",   hi: "high" },
        { key: "bdDecay",  label: "decay",  lo: "short", hi: "long" },
        { key: "bdTone",   label: "tone",   lo: "soft",  hi: "hard" },
        { key: "bdLevel",  label: "level",  lo: "back",  hi: "front" } ] },
    { title: "snare drum", knobs: [
        { key: "sdTune",   label: "tune",   lo: "low",   hi: "high" },
        { key: "sdSnappy", label: "snappy", lo: "body",  hi: "wires" },
        { key: "sdTone",   label: "tone",   lo: "dark",  hi: "bright" },
        { key: "sdLevel",  label: "level",  lo: "back",  hi: "front" } ] } ],

  [ { title: "closed hat", knobs: [
        { key: "chDecay",  label: "decay",  lo: "tight", hi: "loose" },
        { key: "chTone",   label: "tone",   lo: "dark",  hi: "bright" },
        { key: "chLevel",  label: "level",  lo: "back",  hi: "front" } ] },
    { title: "open hat", knobs: [
        { key: "ohDecay",  label: "decay",  lo: "short", hi: "long" },
        { key: "ohTone",   label: "metal",  lo: "flat",  hi: "sharp" },
        { key: "ohLevel",  label: "level",  lo: "back",  hi: "front" } ] },
    { title: "hand clap", knobs: [
        { key: "cpLevel",  label: "level",  lo: "back",  hi: "front" } ] },
    { title: "rim shot", knobs: [
        { key: "rsLevel",  label: "level",  lo: "back",  hi: "front" } ] } ],

  [ { title: "toms", knobs: [
        { key: "ltTune",   label: "low tune",  lo: "low", hi: "high" },
        { key: "mtTune",   label: "mid tune",  lo: "low", hi: "high" },
        { key: "htTune",   label: "high tune", lo: "low", hi: "high" },
        { key: "tomLevel", label: "level",     lo: "back", hi: "front" } ] },
    { title: "accent", knobs: [
        { key: "accent",   label: "depth",  lo: "even",  hi: "hard" } ] } ]
];
// "metal" is on the OPEN hat and moves BOTH hats, because in the machine and in
// the engine the two share one oscillator bank. That is not a bug to hide with
// a duplicate knob; it is the instrument, and it is why the closed hat changes
// when you touch it.

/* =========================================================================
   PANEL STATE — positions, 0..1, because positions are what the engine's own
   fit records are written in and what several knobs (pitch sweep, hat detune,
   snare tone) actually read.
   ========================================================================= */
function centrePos() {
  var p = {};
  for (var k in R808) p[k] = 0.5;
  return p;
}
function fittedPos() {
  var p = centrePos(), f = window.FIT_POS || {};
  for (var k in f) if (k in p) p[k] = f[k];
  return p;
}
// The engine owns the position -> value map, curves and all. Asking it is the
// only way this page cannot drift from the renderer: a second copy here was
// exactly the bug render-voice.mjs shipped with, harmless while every range was
// linear and silently wrong the moment one carried a curve.
function panelFrom(pos) { return U.panel808FromPos(pos); }

var state = {
  pos: fittedPos(),
  voices: null,                   // id -> Float32Array, the built kit
  buffers: {},                    // id -> AudioBuffer
  pattern: {},                    // id -> [16] booleans, plus "accent"
  mutes: {},                      // id -> true when muted
  playing: false,
  step: 0,
  bpm: 104,
  swing: 0,
  vol: 0.4,                       // 0.8 clipped: book grooves with cowbell/congas reach ~2x a single hit
  moved: {},                      // knobs the hand has touched, for the label tint
  padAcc: false,                  // pads hit accented (the machine's only dynamics)
  sel: "kick"                     // the lane the phone's step editor shows
};

/* THE PATTERN it opens on. Every one of the nine voices appears in it, which is
   not decoration: a kit where one voice is silent should be audible as such
   within a bar, without hunting for the pad. The toms descend through the back
   half as a fill; the rim answers the snare. */
var INIT_PATTERN = {
  kick:      [0, 6, 10],
  snare:     [4, 12],
  hatClosed: [0, 2, 4, 6, 8, 10, 12],
  hatOpen:   [14],
  clap:      [12],
  rim:       [7],
  tomHi:     [11],
  tomMid:    [13],
  tomLo:     [15],
  accent:    [0, 8]
};
function blankPattern() {
  var p = {}, i;
  var ids = VOICES.map(function (v) { return v.id; }).concat(["accent"]);
  ids.forEach(function (id) {
    p[id] = [];
    for (i = 0; i < NSTEP; i++) p[id].push(false);
  });
  return p;
}
function initPattern() {
  var p = blankPattern();
  for (var id in INIT_PATTERN) INIT_PATTERN[id].forEach(function (s) { p[id][s] = true; });
  return p;
}
state.pattern = initPattern();

var el = {};
["play", "bpm", "bpmv", "swing", "vol", "draw", "reset", "work", "grid", "rack",
 "ruler", "rulerSteps", "patClear", "patInit", "boot",
 "padAcc", "kitpads", "selAcc", "selMute", "pagePlay", "selName", "ed", "lanes"]
  .forEach(function (id) { el[id] = document.getElementById(id); });

/* =========================================================================
   BUILDING THE KIT — in a worker, and LATEST-WINS.

   build808 costs about 110 ms with the hat oscillator bank cached and about a
   second when a hat knob moves and it has to be rebuilt. Queueing every drag
   frame would stack those; instead exactly one build is ever in flight and only
   the most recent request survives, so the wait is one build long no matter how
   far the knob travels. That is what makes this continuous rather than batched.
   ========================================================================= */
var worker = null, seq = 0, pending = null, queued = null, inFlight = false;
(function () {
  try {
    var url = URL.createObjectURL(new Blob([ENGINE_SRC + "\n" + WORKER_BODY], { type: "text/javascript" }));
    worker = new Worker(url);
    worker.onmessage = function (e) {
      var d = e.data;
      inFlight = false;
      if (d.ok && pending === d.id) adopt(d.voices);
      else if (!d.ok) console.error("build808:", d.err);
      pump();
    };
    worker.onerror = function (err) { console.error("worker died, building on the main thread", err); worker = null; };
  } catch (err) { worker = null; }
})();

function requestBuild(pos) {
  queued = JSON.parse(JSON.stringify(pos));
  el.work.className = "on";
  pump();
}
function pump() {
  if (!queued || inFlight) { if (!queued && !inFlight) el.work.className = ""; return; }
  var pos = queued; queued = null;
  var panel = panelFrom(pos);
  if (!worker) {
    // No worker (file:// in some browsers) is a slower instrument, not a broken
    // one. It blocks the UI for the build; it does not change a sample.
    try { adopt(U.build808(panel)); } catch (e) { console.error(e); }
    el.work.className = "";
    return;
  }
  inFlight = true;
  pending = ++seq;
  worker.postMessage({ id: pending, panel: panel });
}
function adopt(voices) {
  state.voices = voices;
  state.buffers = {};
  if (actx) for (var i = 0; i < VOICES.length; i++) makeBuffer(VOICES[i].id);
  el.work.className = queued || inFlight ? "on" : "";
}

/* =========================================================================
   AUDIO
   ========================================================================= */
var actx = null, master = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
    master = actx.createGain();
    master.gain.value = state.vol;
    master.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
// The machine kit, built once on the first audio: createDrumKit synthesises
// its buffers and resamples them to the context. Only the generic voices are
// read from it — cowbell and the congas take nothing from the panel, so one
// build serves every knob position. Hits play through this page's own path
// (master, accent gain, flash) rather than kit.fire, because kit.fire adds
// every hit to a U.chainMixer, which grows one gain node per hit: right for a
// song scheduled once, a leak on a page tapped for an hour.
var drumKit = null;
function kitBuffer(id) {
  if (!drumKit) {
    try { drumKit = U.createDrumKit(actx, {}, "machine", panelFrom(state.pos)); }
    catch (e) { console.error("createDrumKit:", e); return null; }
  }
  return drumKit.buffers[id] || null;
}
function makeBuffer(id) {
  if (KIT_ONLY[id]) { var kb = kitBuffer(id); if (kb) state.buffers[id] = kb; return kb; }
  var x = state.voices && state.voices[id];
  if (!x || !x.length) return null;
  var ab = actx.createBuffer(1, x.length, SR);
  ab.copyToChannel(x, 0);
  state.buffers[id] = ab;
  return ab;
}
function bufferFor(id) {
  if (!actx) audio();
  return state.buffers[id] || makeBuffer(id);
}

// The 808's hi-hats share one output: a closed hat CHOKES a ringing open hat.
// Without this the pattern's open hat rings straight through the next closed
// one and the kit stops sounding like the machine at exactly the moment the
// groove needs it most.
var openHat = null;
function stopOpenHat(at) {
  if (!openHat) return;
  try {
    openHat.gain.gain.setValueAtTime(openHat.gain.gain.value, at);
    openHat.gain.gain.linearRampToValueAtTime(0, at + 0.004);   // ramped, or it clicks
    openHat.src.stop(at + 0.006);
  } catch (e) {}
  openHat = null;
}
function fire(id, at, accented) {
  var buf = bufferFor(id);
  if (!buf) return;
  var ctx = audio();
  var t = at == null ? ctx.currentTime + 0.001 : at;
  var acc = U.accent808(panelFrom(state.pos));
  var g = ctx.createGain();
  g.gain.value = (accented ? acc.hit : acc.rest) * (KIT_GAIN[id] || 1);
  var src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(g); g.connect(master);
  if (id === "hatClosed") stopOpenHat(t);
  src.start(t);
  if (id === "hatOpen") { stopOpenHat(t); openHat = { src: src, gain: g }; }
  flash(id, t - ctx.currentTime);
}
function flash(id, delay) {
  setTimeout(function () {
    var pads = document.querySelectorAll('.pad[data-v="' + id + '"]');
    Array.prototype.forEach.call(pads, function (pad) {
      pad.classList.add("lit");
      setTimeout(function () { pad.classList.remove("lit"); }, 90);
    });
  }, Math.max(0, delay * 1000));
}

/* =========================================================================
   THE SEQUENCER — lookahead scheduling, because setTimeout is not a clock.
   Steps are placed on the AudioContext's own timeline ahead of time; the timer
   only decides WHICH steps to place, so a busy main thread (a knob drag, a
   rebuild landing) cannot make the groove stumble.
   ========================================================================= */
var LOOKAHEAD = 0.12, TICK = 25;
var nextTime = 0, nextStep = 0, ticker = null;

function stepDur() { return 60 / state.bpm / 4; }
function stepOffset(i) {
  // Swing delays the off-eighths, the way a drum machine's shuffle does.
  return (i % 2 === 1) ? state.swing * 0.5 * stepDur() : 0;
}
function scheduleAhead() {
  var ctx = audio();
  while (nextTime < ctx.currentTime + LOOKAHEAD) {
    var i = nextStep;
    var at = nextTime + stepOffset(i);
    var accented = !!state.pattern.accent[i];
    for (var v = 0; v < VOICES.length; v++) {
      var id = VOICES[v].id;
      if (state.mutes[id]) continue;
      if (state.pattern[id][i]) fire(id, at, accented);
    }
    paintNow(i, at - ctx.currentTime);
    nextTime += stepDur();
    nextStep = (nextStep + 1) % NSTEP;
  }
}
function start() {
  audio();
  state.playing = true;
  el.play.className = "tbtn on";
  el.play.textContent = "stop";
  el.pagePlay.textContent = "stop";
  el.pagePlay.classList.add("on");
  nextStep = 0;
  nextTime = actx.currentTime + 0.06;
  scheduleAhead();
  ticker = setInterval(scheduleAhead, TICK);
}
function stop() {
  state.playing = false;
  el.play.className = "tbtn";
  el.play.textContent = "play";
  el.pagePlay.textContent = "play";
  el.pagePlay.classList.remove("on");
  if (ticker) clearInterval(ticker);
  ticker = null;
  stopOpenHat(actx ? actx.currentTime : 0);
  paintNow(-1, 0);
}
function paintNow(i, delay) {
  setTimeout(function () {
    var olds = document.querySelectorAll(".st.now");
    if (i >= 0 && !state.playing) return;   // a step queued before stop() must not repaint after it
    for (var k = 0; k < olds.length; k++) olds[k].classList.remove("now");
    if (i < 0) return;
    var cur = document.querySelectorAll('.st[data-s="' + i + '"]');
    for (var j = 0; j < cur.length; j++) cur[j].classList.add("now");
  }, Math.max(0, delay * 1000));
}

/* =========================================================================
   THE GRID
   ========================================================================= */
function buildGrid() {
  el.rulerSteps.innerHTML = "";
  for (var i = 0; i < NSTEP; i++) {
    var b = document.createElement("b");
    b.textContent = (i % 4 === 0) ? String(i / 4 + 1) : "";
    el.rulerSteps.appendChild(b);
  }
  el.grid.innerHTML = "";
  var rows = VOICES.map(function (v, n) { return { id: v.id, label: v.label, key: n < 9 ? String(n + 1) : "", acc: false }; });
  rows.push({ id: "accent", label: "accent", key: "", acc: true });
  rows.forEach(function (row) {
    var lane = document.createElement("div");
    lane.className = "lane" + (row.acc ? " acc" : "");

    var pad = document.createElement("button");
    pad.className = "pad";
    pad.dataset.v = row.id;
    pad.innerHTML = (row.key ? '<kbd>' + row.key + "</kbd>" : "<kbd>·</kbd>") +
      "<span>" + row.label + "</span>";
    if (!row.acc) pad.addEventListener("pointerdown", function () { fire(row.id, null, state.padAcc); });
    else pad.disabled = true;
    lane.appendChild(pad);

    var mute = document.createElement("button");
    mute.className = "mute" + (row.acc || state.mutes[row.id] ? "" : " on");
    mute.textContent = row.acc ? "" : "●";
    mute.title = "mute this voice in the pattern";
    if (row.acc) { mute.style.visibility = "hidden"; }
    else mute.addEventListener("click", function () {
      state.mutes[row.id] = !state.mutes[row.id];
      mute.className = "mute" + (state.mutes[row.id] ? "" : " on");
    });
    lane.appendChild(mute);

    var steps = document.createElement("div");
    steps.className = "steps";
    for (var i = 0; i < NSTEP; i++) {
      var s = document.createElement("button");
      s.className = "st" + (Math.floor(i / 4) % 2 === 0 ? " q" : "") +
        (state.pattern[row.id][i] ? " on" : "");
      s.dataset.s = i;
      s.dataset.v = row.id;
      steps.appendChild(s);
    }
    steps.addEventListener("click", function (e) {
      var s = e.target.closest(".st");
      if (!s) return;
      var i = +s.dataset.s, id = s.dataset.v;
      state.pattern[id][i] = !state.pattern[id][i];
      s.classList.toggle("on", state.pattern[id][i]);
      if (!state.playing && state.pattern[id][i] && id !== "accent") fire(id, null, false);
    });
    lane.appendChild(steps);
    el.grid.appendChild(lane);
  });
  buildEd();
}

/* =========================================================================
   THE PHONE KIT — the same voices and the same pattern, laid out for a thumb:
   nine pads in a 3x3, and one lane's sixteen steps as a 4x4 (a beat per row)
   for whichever pad was hit last. Hidden above 600px, where the grid above
   already is all of this.
   ========================================================================= */
function labelOf(id) {
  if (id === "accent") return "accent";
  for (var i = 0; i < VOICES.length; i++) if (VOICES[i].id === id) return VOICES[i].label;
  return id;
}
function select(id) {
  state.sel = id;
  var kp = el.kitpads.querySelectorAll(".kp");
  for (var i = 0; i < kp.length; i++) kp[i].classList.toggle("sel", kp[i].dataset.v === id);
  el.selAcc.classList.toggle("sel", id === "accent");
  buildEd();
}
function buildKitpads() {
  el.kitpads.innerHTML = "";
  VOICES.forEach(function (v) {
    var b = document.createElement("button");
    b.className = "pad kp" + (v.id === state.sel ? " sel" : "");
    b.dataset.v = v.id;
    b.textContent = v.label;
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      fire(v.id, null, state.padAcc);
      if (state.sel !== v.id) select(v.id);
    });
    el.kitpads.appendChild(b);
  });
}
function buildEd() {
  if (!el.ed) return;
  var id = state.sel;
  el.ed.innerHTML = "";
  el.ed.className = id === "accent" ? "acc" : "";
  el.selName.textContent = labelOf(id);
  el.selMute.style.visibility = id === "accent" ? "hidden" : "";
  el.selMute.textContent = state.mutes[id] ? "muted" : "in pattern";
  el.selMute.classList.toggle("on", !state.mutes[id]);
  for (var i = 0; i < NSTEP; i++) {
    var s = document.createElement("button");
    s.className = "st" + (Math.floor(i / 4) % 2 === 0 ? " q" : "") + (state.pattern[id][i] ? " on" : "");
    s.dataset.s = i;
    s.dataset.v = id;
    s.textContent = "";
    el.ed.appendChild(s);
  }
}
el.ed.addEventListener("click", function (e) {
  var s = e.target.closest(".st");
  if (!s) return;
  var i = +s.dataset.s, id = s.dataset.v;
  state.pattern[id][i] = !state.pattern[id][i];
  s.classList.toggle("on", state.pattern[id][i]);
  var twin = el.grid.querySelector('.st[data-v="' + id + '"][data-s="' + i + '"]');
  if (twin) twin.classList.toggle("on", state.pattern[id][i]);
  if (!state.playing && state.pattern[id][i] && id !== "accent") fire(id, null, false);
});
el.selAcc.addEventListener("click", function () { select("accent"); });
el.selMute.addEventListener("click", function () {
  var id = state.sel;
  if (id === "accent") return;
  state.mutes[id] = !state.mutes[id];
  var m = el.grid.querySelector('.pad[data-v="' + id + '"] + .mute');
  if (m) m.className = "mute" + (state.mutes[id] ? "" : " on");
  buildEd();
});
el.pagePlay.addEventListener("click", function () { state.playing ? stop() : start(); });
el.padAcc.addEventListener("click", function () {
  state.padAcc = !state.padAcc;
  el.padAcc.textContent = "hits: " + (state.padAcc ? "accented" : "plain");
  el.padAcc.style.color = state.padAcc ? "var(--acc)" : "";
});

/* =========================================================================
   THE RACK
   ========================================================================= */
function buildRack() {
  el.rack.innerHTML = "";
  RACK.forEach(function (col) {
    var c = document.createElement("div");
    c.className = "rcol";
    col.forEach(function (grp) {
      var g = document.createElement("div");
      g.className = "grp";
      var h = document.createElement("h3");
      h.textContent = grp.title;
      g.appendChild(h);
      grp.knobs.forEach(function (kn) {
        var row = document.createElement("div");
        row.className = "knob" + (state.moved[kn.key] ? " moved" : "");
        row.innerHTML = '<label>' + kn.label + "</label>" +
          '<input type="range" data-k="' + kn.key + '" min="0" max="1" step="0.002">' +
          '<div class="ends"><span>' + kn.lo + "</span><span>" + kn.hi + "</span></div>";
        var input = row.querySelector("input");
        input.value = state.pos[kn.key];
        input.addEventListener("input", function () {
          state.pos[kn.key] = parseFloat(input.value);
          state.moved[kn.key] = true;
          row.className = "knob moved";
          requestBuild(state.pos);
        });
        // Not playing? A knob you turn in silence still has to speak, or the
        // instrument only works while the pattern runs.
        input.addEventListener("change", function () {
          if (!state.playing) setTimeout(function () { fire(voiceOfKnob(kn.key), null, false); }, 130);
        });
        g.appendChild(row);
      });
      c.appendChild(g);
    });
    el.rack.appendChild(c);
  });
}
function paintRack() {
  var inputs = el.rack.querySelectorAll("input[type=range]");
  for (var i = 0; i < inputs.length; i++) inputs[i].value = state.pos[inputs[i].dataset.k];
}
var KNOB_VOICE = {
  bd: "kick", sd: "snare", ch: "hatClosed", oh: "hatOpen",
  cp: "clap", rs: "rim", lt: "tomLo", mt: "tomMid", ht: "tomHi"
};
function voiceOfKnob(k) {
  if (k === "tomLevel") return "tomMid";
  if (k === "accent") return "kick";
  return KNOB_VOICE[k.slice(0, 2)] || "kick";
}

/* =========================================================================
   WIRING
   ========================================================================= */
el.play.addEventListener("click", function () { state.playing ? stop() : start(); });
el.bpm.addEventListener("input", function () {
  state.bpm = +el.bpm.value;
  el.bpmv.textContent = state.bpm;
});
el.swing.addEventListener("input", function () { state.swing = +el.swing.value; });
el.vol.addEventListener("input", function () {
  state.vol = +el.vol.value;
  if (master) master.gain.value = state.vol;
});
el.reset.addEventListener("click", function () {
  state.pos = fittedPos();
  state.moved = {};
  buildRack();
  requestBuild(state.pos);
});
// A DRAWN panel — the machine a song actually gets. Every hash pulls a different
// 808 out of the same circuits, and hearing that spread is half of knowing
// whether the instrument is any good.
el.draw.addEventListener("click", function () {
  var hex = "0x" + Array.from({ length: 64 }, function () {
    return "0123456789abcdef"[Math.floor(Math.random() * 16)];
  }).join("");
  var p = U.draw808Panel(U.makePrng(hex));
  for (var k in state.pos) if (p.pos && k in p.pos) state.pos[k] = p.pos[k];
  state.moved = {};
  buildRack();
  requestBuild(state.pos);
});
/* =========================================================================
   THE SONG'S GROOVES — one bar from the engine's own drum books, the way a
   song on that lane draws it: U.KICK[lane], U.SNARE and U.HATS (gated by
   lane with U.forLane, picked with U.pickWeighted), tempo and swing at the
   lane's median (U.SONG_TEMPO + U.LANE_FEEL). Tap a lane again for another
   draw. Book marks: x hit, o open hat, g ghost (the grid has no ghost
   velocity, so a ghost is left out rather than played full), clap:true puts
   the clap on the snare's steps, as session.js does.
   ========================================================================= */
var grooveLane = null;
function drawGroove(lane) {
  var hex = "0x" + Array.from({ length: 64 }, function () {
    return "0123456789abcdef"[Math.floor(Math.random() * 16)];
  }).join("");
  var R = U.makePrng(hex);
  var kick = U.pickWeighted(R, U.KICK[lane]);
  var snare = U.pickWeighted(R, U.forLane(U.SNARE, lane));
  var hats = U.pickWeighted(R, U.HATS);
  // the machine's percussion strips, picked the way the session picks them:
  // ePerc over U.forLane(U.EPERC, lane), percAccent over U.PERCACCENT. A song
  // mutes these strips about half the time (desk mutes 0.48 and 0.64); a
  // groove you asked to hear plays them.
  var eperc = U.pickWeighted(R, U.forLane(U.EPERC, lane));
  var pacc = U.pickWeighted(R, U.PERCACCENT);
  var p = blankPattern(), i;
  for (i = 0; i < NSTEP; i++) {
    if (kick.p[i] === "x") p.kick[i] = true;
    if (snare.p[i] === "x") { p.snare[i] = true; if (snare.clap) p.clap[i] = true; }
    if (hats.p[i] === "x") p.hatClosed[i] = true;
    if (hats.p[i] === "o") p.hatOpen[i] = true;
  }
  // as session.js realises them: congaRun on its fixed steps, alternating
  // high/low; a 1-bar figure on its voice (cowbell or rim); a 2-bar figure
  // (the son clave) by its first bar; percAccent's conga figures low on every
  // third step and high otherwise. phraseEnd only fires on a phrase's last
  // bar, which a one-bar loop does not have, so it is left out.
  var epVoice = eperc.voice === "rim" ? "rim" : "cowbell";
  if (eperc.kind === "congaRun") [2, 3, 6, 10, 11, 14].forEach(function (st, n) { p[n % 2 ? "congaLo" : "congaHi"][st] = true; });
  else if (eperc.p2) for (i = 0; i < NSTEP; i++) { if (eperc.p2[i] !== ".") p[epVoice][i] = true; }
  else if (eperc.p) for (i = 0; i < NSTEP; i++) { if (eperc.p[i] !== ".") p[epVoice][i] = true; }
  if (pacc.p) for (i = 0; i < NSTEP; i++) if (pacc.p[i] !== ".") p[i % 3 ? "congaHi" : "congaLo"][i] = true;
  // no accent: the song render never calls accent808, so a book groove is unaccented
  state.pattern = p;
  var feel = U.LANE_FEEL[lane], T = U.SONG_TEMPO;
  state.bpm = Math.round(T.bpm[0] + (T.bpm[1] - T.bpm[0]) * feel.bpmBias);
  // session.js swings odd 16ths by swing * s16; this page's slider is half that
  state.swing = 2 * (T.swing[0] + (T.swing[1] - T.swing[0]) * feel.swingBias);
  el.bpm.value = state.bpm; el.bpmv.textContent = state.bpm; el.swing.value = state.swing;
  grooveLane = lane;
  el.grooveIds.textContent = [kick.id, snare.id, hats.id, eperc.id, pacc.id].join(" · ") + " · " + state.bpm + " bpm";
  paintLanes();
  buildGrid();
  if (!state.playing) start();
}
function paintLanes() {
  var bs = el.lanes.querySelectorAll("button[data-lane]");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].dataset.lane === grooveLane);
}
U.LANES.forEach(function (lane) {
  var b = document.createElement("button");
  b.className = "rowbtn";
  b.dataset.lane = lane;
  b.textContent = U.LANE_LABEL[lane];
  b.addEventListener("click", function () { drawGroove(lane); });
  el.lanes.appendChild(b);
});
el.grooveIds = document.createElement("span");
el.grooveIds.id = "grooveIds";
el.grooveIds.textContent = "song grooves: tap a lane to draw one and play it";
el.lanes.appendChild(el.grooveIds);

el.patClear.addEventListener("click", function () { state.pattern = blankPattern(); grooveLane = null; paintLanes(); buildGrid(); });
el.patInit.addEventListener("click", function () { state.pattern = initPattern(); grooveLane = null; paintLanes(); buildGrid(); });

document.addEventListener("keydown", function (e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.code === "Space") { e.preventDefault(); state.playing ? stop() : start(); return; }
  var n = "123456789".indexOf(e.key);
  if (n >= 0 && n < VOICES.length) { e.preventDefault(); fire(VOICES[n].id, null, false); }
});
el.boot.addEventListener("click", function () {
  audio();
  for (var i = 0; i < VOICES.length; i++) makeBuffer(VOICES[i].id);
  el.boot.className = "off";
});
// First touch anywhere unlocks the audio, not only a tap on the overlay: iOS
// Safari (and a hub iframe) only lets a context start inside a user gesture.
function unlock() {
  audio();
  if (el.boot.className !== "off") el.boot.className = "off";
}
["touchend", "pointerup", "click"].forEach(function (t) {
  document.addEventListener(t, unlock, { passive: true });
});

/* =========================================================================
   BOOT
   ========================================================================= */
// The roster is a human list; the engine is the authority. If tr808.js grows a
// tenth voice, say so loudly rather than shipping an instrument that is missing
// it — that exact silence is what render-voice.mjs did for a day.
(function checkRoster() {
  var built = U.build808(panelFrom(centrePos()));
  var have = Object.keys(built), listed = ROSTER_808.map(function (v) { return v.id; });
  var missing = have.filter(function (k) { return listed.indexOf(k) < 0; });
  if (missing.length) console.error("VOICES is missing engine voices:", missing.join(", "));
  state.voices = built;
})();

buildKitpads();
buildGrid();
buildRack();
requestBuild(state.pos);

// Headless verification hooks only — nothing in the UI reads these.
window.__inst = state;
window.__fire = fire;
window.__start = start;
window.__stop = stop;
</script>
</body>
</html>
