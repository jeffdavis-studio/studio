<style>
  :root{--bg:#16161a;--panel:#1f1f25;--edge:#34343d;--ink:#e8e8ec;--dim:#8d8d99;--accent:#c9a15a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.35 ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:12px 12px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;overflow-x:hidden}
  h1{font-size:20px;margin:4px 0 2px}
  .note{color:var(--dim);font-size:14px;margin:0 0 12px}
  .song{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px;margin:0 0 10px}
  .top{display:flex;align-items:center;gap:10px}
  .play{flex:0 0 52px;height:52px;border-radius:50%;border:1px solid var(--edge);background:#2a2a32;color:var(--ink);
    font-size:20px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .song.on .play{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .title{flex:1 1 auto;min-width:0}
  .title b{display:block;font-size:16px}
  .title span{display:block;color:var(--dim);font-size:14px}
  .state{color:var(--accent);font-size:14px;min-height:1em}
  .carries{color:var(--dim);font-size:14px;margin:6px 0 0}
  .strip{position:relative;display:flex;height:44px;margin-top:8px;border-radius:6px;overflow:hidden;
    touch-action:none;cursor:pointer;background:#2a2a32}
  .strip div{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#1a1a1a;
    border-right:1px solid var(--bg);overflow:hidden;white-space:nowrap}
  .strip .intro,.strip .outro{background:#6d6d78}
  .strip .verse{background:#7f9bb8}
  .strip .chorus{background:var(--accent)}
  .strip .bridge{background:#b07fa8}
  .strip .head{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:0;pointer-events:none;display:none}
  .song.on .strip .head,.song.paused .strip .head{display:block}
  .strip .done{position:absolute;top:0;bottom:0;left:0;background:rgba(0,0,0,.35);pointer-events:none;width:0}
  #modes{display:flex;gap:8px;margin:0 0 12px}
  #modes button{flex:1 1 0;min-height:52px;font:inherit;font-size:15px;color:var(--ink);background:#2a2a32;

  #modes button small{display:block;font-size:12px;color:var(--dim)}
  #modes button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  #modes button.on small{color:#3a3a3a}
  body.live .strip{cursor:default}
  footer{color:var(--dim);font-size:13px;text-align:center;margin-top:14px}
</style>

// for the four-line hand-off that lets a machine-flavour kit take its kick,
// snare and hats from here.
//
// THE CIRCUITS, in the order they appear below.
//
//   BASS DRUM — a bridged-T network rung by the trigger pulse. It is close to a
//   pure decaying sine that starts sharply above its resting pitch and falls to
//   it in about 20ms; DECAY is feedback into the network (a longer ring, not a
//   different pitch); TONE mixes in the raw trigger click ahead of the ring.
//   Modelled here as: sine + fast pitch envelope + a small fast-dying second
//   harmonic (the network's asymmetry) + a high-passed click + gentle
//   saturation, which is what the machine's output stage does when the drum is
//   loud.
//
//   SNARE — two tuned bridged-T oscillators (a low body and a partial roughly a
//   twelfth above it) plus a separate noise generator through a bandpass. TUNE
//   moves both oscillators. SNAPPY is the noise level against the drum body —
//   the one knob everyone actually turns. TONE here drives the noise brightness
//   and how long the noise rings, which is the audible half of the machine's
//   own tone control.
//
//   HATS — six square-wave oscillators at fixed inharmonic frequencies, summed,
//   high-passed, and gated by a VCA. Closed and open hat share ONE oscillator
//   bank and differ only in their envelope and filter setting, exactly as the
//   machine does — which is also why they share a VCA, and why a closed hat
//   cuts an open one off. That choke is implemented in the kit (drums.js
//   `fire`), because it is a scheduling behaviour, not a waveform.
//
//   TOMS (low / mid / high) — the same bridged-T ring as the bass drum, damped
//   harder and tuned up, with the trigger pulse itself audible as a short
//   noise thud in front of it. One knob each, TUNING, exactly as the machine
//   has. The DECAY is a property of each circuit, not a knob: measured across
//   the corpus's five TUNING cells per family it barely moves (LT 89.9→86.1 ms,
//   MT 57.9→55.1, HT 44.5→41.5), while the pitch moves 1.22x. So decay is a
//   constant per family with a small tuning-dependent shortening, and TUNING
//   is a frequency knob and nothing else.
//
//   HAND CLAP — ONE noise source through ONE bandpass, gated by a VCA that is
//   opened three times in fast succession and then held open onto a long
//   decay. Not "three noise bursts plus a tail" as a generic clap is written:
//   the bursts and the tail are the same noise through the same filter, which
//   is why an 808 clap sounds like one event and not like four. No knob — the
//   machine gives the clap a LEVEL and nothing else.
//
//   RIM SHOT — a bridged-T rung once and damped hard. Two resonances and a
//   trigger click, over in about 13 ms. Also no knob.
//
// THE THREE FAMILIES ABOVE WERE MEASURED BEFORE THEY WERE WRITTEN
// (analysis/measure-extra-808.mjs), the order the Juno pass established. The
// numbers below are that measurement, not an approximation of the idea of an
// 808 — clap burst spacing off a 0.5 ms envelope, rim resonances off a window
// sized to a 13 ms hit, tom fundamentals off an interpolated FFT peak.
//
// DETERMINISM. Two separate stories, both deliberate:
//   - The PANEL comes from the song's PRNG stream, as a fixed block of 15 draws
//     appended at the END of tier 1 (see session.js's canonical draw order).
//     Fixed count, drawn for every song whether or not the 808 is the kit, so
//     the count can never drift with the lane.
//   - The NOISE inside the snare comes from a FIXED seed, never the song
//     stream, so the waveform build consumes no draws.
// The Math.sin / Math.exp exposure noted in drums.js applies here identically.
//
// LOUDNESS. Every voice is normalised to a fixed peak target before its LEVEL
// knob rides it, and the level ranges are narrow (about ±1.3 dB). This is
// mixdown guarantee 2 (Brief 2 §The Mixdown): a random panel draw is allowed to
// change the character of the kit, and is not allowed to change the balance of
// the record.
(function (g) {
  "use strict";
  const U = (g.U = g.U || {});

  const SR = 44100;
  const NOISE_SEED = "808808808808808808808808808808ff";
  // A SECOND fixed seed, for the hat oscillators' frequency jitter (see hats()).
  // Separate from NOISE_SEED on purpose: the hats are built BEFORE the kick and
  // snare in build808, so sharing one stream would make every future change to
  // the hat bank silently re-roll the snare's noise. Fixed seed, never the song
  // stream — same determinism story as NOISE_SEED.
  const HAT_SEED = "80811a7808ba7808ca7808da7808ea7f";

  // ---- panel ranges --------------------------------------------------------
  // The archetype-plus-range model (Brief 1 §Patch book): each knob has a
  // musically-safe span, and the draw lands anywhere in it with a soft pull
  // toward the middle. These are the build-time dials — this table IS the
  // machine's personality, and it is the thing to retune by ear.
  //
  // RE-CENTRED 2026-08-12 by analysis/apply-fit.mjs against the verified
  // reference pack (each knob's centre now sits on the fitted value; spans are
  // the originals unless a physical bound forced a shrink). Three entries below
  // are marked INERT: the DSP reads only `p.pos.<knob>` for those, so editing
  // the numbers moves the panel readout and nothing audible. Their fit lives in
  // the DSP coefficients instead. See analysis/apply-fit.mjs.
  const RANGE = {
    bdTune:   [38.906, 60.906], // Hz — where the ring settles
    bdDecay:  [0.0158, 0.4959, 0.70], // sec — geometric; machine spans 16.9–535.6 ms, we spanned 128–319
    bdTone:   [0.05, 0.55],     // click into the ring
    bdLevel:  [0.86, 1.14],
    sdTune:   [141.5, 207.5],   // Hz — lower of the two body oscillators
    sdSnappy: [0.02, 1.30],     // noise against body — see the tonality ladder below
    sdTone:   [0.15, 0.90],     // INERT — position-driven (noise brightness + ring length)
    sdLevel:  [0.84, 1.16],
    chDecay:  [0.00572, 0.02672], // sec — ≈23–119ms of hat
    chTone:   [0.15, 0.85],     // INERT — position-driven (high-pass corner + bank detune)
    chLevel:  [0.82, 1.18],
    ohDecay:  [0.0215, 0.2440, 0.20], // sec — geometric; machine spans 21.5–241.0 ms (defaded), we spanned 92–243
    ohTone:   [0.15, 0.85],     // INERT — position-driven (high-pass corner + bank detune)
    ohLevel:  [0.80, 1.15],
    accent:   [0.15, 0.95],     // the machine's one global knob
    // ---- the extended voices, 2026-08-17 --------------------------------
    // TOM TUNING, one knob per family, spanning exactly what the corpus's five
    // TUNING cells measure (interpolated FFT fundamental at 20 ms):
    //   LT  81.55 → 99.76 Hz     MT  124.71 → 154.05     HT  170.24 → 212.34
    // These are not "a range we chose" — they are the machine's, endpoint to
    // endpoint, and the whole knob is 1.22-1.25x, which is much narrower than
    // a generic tom would give you.
    ltTune:   [81.55, 99.76],
    mtTune:   [124.71, 154.05],
    htTune:   [170.24, 212.34],
    // No TONE or DECAY knobs here, because the machine has none: the tom, clap
    // and rim circuits expose LEVEL and (for the toms) TUNING. Modelling a knob
    // the machine does not have would be a different instrument.
    cpLevel:  [0.84, 1.16],
    rsLevel:  [0.82, 1.18],
    tomLevel: [0.84, 1.16],
  };
  U.PANEL_808_RANGES = RANGE;

  // sdSnappy, the knob both the 08-12 fitter and Jeff's ear railed at its 1.00
  // ceiling. Tail tonality is the axis it moves, and the machine sweeps a whole
  // drum-to-crack range on it that we only covered the top half of. Laddered
  // against the machine's five SNAPPY cells (tail tonality, RMS):
  //
  //   RANGE.sdSnappy      p0     p25     p50     p75    p100      RMS
  //   machine          0.982   0.669   0.246   0.138   0.126
  //   [0.70, 1.00]     0.262   0.214   0.183   0.154   0.137   0.3820
  //   [0.02, 1.00]     0.994   0.783   0.437   0.231   0.137   0.1081
  //   [0.02, 1.30]     0.994   0.666   0.289   0.141   0.103   0.0225
  //
  // A curve exponent was tried too and lost to the plain linear map every time.
  // The 1.30 top is deliberate headroom: 1.00 was where both fits ran out.

  // Centre-biased position: era-typical settings are likely, the ends of every
  // range stay genuinely reachable. Same shape as every other weighted draw in
  // the engine (Brief 1 §Design language).
  //
  // The exponent must be BELOW 1 — that is what pulls a uniform draw toward the
  // middle. Above 1 does the exact opposite and stacks the panel at the ends of
  // every range; the first demo render caught it doing precisely that (a single
  // draw with the kick's click at 98%, the snare's snappy at 100% and the hats
  // wide open, which is not a machine anybody would leave set that way).
  const K = 0.62;
  function centred(t) {
    return t < 0.5 ? 0.5 * Math.pow(2 * t, K) : 1 - 0.5 * Math.pow(2 - 2 * t, K);
  }
  // Two-element ranges are linear, which is right for a knob whose useful span
  // is narrow. The DECAY knobs are not that: measured across the corpus's own
  // grid, the machine's kick decay runs 16.9 -> 535.6 ms (31.8x) and its open
  // hat 21.5 -> 241.0 ms (11.2x, after cutting the sample editor's fade), and
  // both are steep at the bottom and saturating at the top. A linear map cannot
  // be both, so a third element makes the range geometric with the position
  // warped by `pos ** curve`. Fitted against the machine's five cells per knob,
  // log-RMS error:
  //
  //   kick     linear 0.3262   warped-geometric @0.70  0.1417
  //   openhat  linear 0.7869   warped-geometric @0.20  0.1710
  const span = (r, pos) =>
    r.length < 3 ? r[0] + (r[1] - r[0]) * pos
                 : r[0] * Math.pow(r[1] / r[0], Math.pow(pos, r[2]));

  // THE ONE PLACE positions become panel values. The bench rig used to carry its
  // own copy of this map (analysis/render-voice.mjs), which was harmless while
  // every range was linear and silently wrong the moment one was not — the
  // fitter would have been measuring a panel the song path never produces.
  // Everything now goes through here.
  U.panel808FromPos = function (pos) {
    const v = {}, at = {};
    for (const k in RANGE) {
      const t = pos[k] === undefined ? 0.5 : Math.max(0, Math.min(1, pos[k]));
      at[k] = t;
      v[k] = span(RANGE[k], t);
    }
    v.pos = at;                        // 0..1 knob positions, for the readout
    return v;
  };

  // EXACTLY 21 draws, in this order, always. Appended at the end of tier 1.
  //
  // WAS 15 UNTIL 2026-08-17, and the count going up is a deliberate breaking
  // change, made while nothing is published. The six new draws are APPENDED, so
  // the original fifteen keep their values for a given hash — what shifts is
  // everything drawn after the block. Adding them anywhere but the end would
  // have re-rolled the kick and snare of every hash for a tom knob, which is a
  // worse trade than a clean break. The count is fixed and drawn for every song
  // whether or not the 808 is the kit, exactly as before, so it can never drift
  // with the lane.
  U.draw808Panel = function (R) {
    const pos = {};
    for (const k of ["bdTune", "bdDecay", "bdTone", "bdLevel",
      "sdTune", "sdSnappy", "sdTone", "sdLevel",
      "chDecay", "chTone", "chLevel",
      "ohDecay", "ohTone", "ohLevel", "accent",
      "ltTune", "mtTune", "htTune", "cpLevel", "rsLevel", "tomLevel"]) {
      pos[k] = centred(R.r());
    }
    return U.panel808FromPos(pos);
  };

  // A one-line human readout of what the token turned. This is what you read
  // while listening, and what lands in the render manifest.
  U.describe808 = function (p) {
    const pct = (x) => Math.round(x * 100);
    return "BD " + p.bdTune.toFixed(0) + "Hz d" + pct(p.pos.bdDecay) + " t" + pct(p.pos.bdTone) +
      " | SD " + p.sdTune.toFixed(0) + "Hz snap" + pct(p.pos.sdSnappy) + " t" + pct(p.pos.sdTone) +
      " | CH d" + pct(p.pos.chDecay) + " t" + pct(p.pos.chTone) +
      " | OH d" + pct(p.pos.ohDecay) + " t" + pct(p.pos.ohTone) +
      " | ACC " + pct(p.pos.accent);
  };

  // ---- DSP helpers ---------------------------------------------------------
  // Deliberately a private copy of the same four primitives drums.js keeps
  // private. Roughly 30 lines duplicated in the concatenated on-chain payload;
  // hoisting them into core/ is a cheap later cleanup and is on the README's
  // open list rather than folded into this task.

  const alloc = (sec) => new Float32Array(Math.max(1, Math.round(sec * SR)));

  function onePoleHP(x, hz) {
    const a = Math.exp((-2 * Math.PI * hz) / SR);
    let yPrev = 0, xPrev = 0;
    for (let i = 0; i < x.length; i++) {
      const xi = x[i];
      const y = a * (yPrev + xi - xPrev);
      x[i] = y; yPrev = y; xPrev = xi;
    }
    return x;
  }

  function onePoleLP(x, hz) {
    const a = 1 - Math.exp((-2 * Math.PI * hz) / SR);
    let y = 0;
    for (let i = 0; i < x.length; i++) { y += a * (x[i] - y); x[i] = y; }
    return x;
  }

  function bandpass(x, hz, q) {
    const w = (2 * Math.PI * hz) / SR;
    const alpha = Math.sin(w) / (2 * q);
    const cw = Math.cos(w);
    const b0 = alpha, b2 = -alpha;
    const a0 = 1 + alpha, a1 = -2 * cw, a2 = 1 - alpha;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) {
      const xi = x[i];
      const y = (b0 * xi + b2 * x2 - a1 * y1 - a2 * y2) / a0;
      x2 = x1; x1 = xi; y2 = y1; y1 = y;
      x[i] = y;
    }
    return x;
  }

  function normalize(x, target) {
    let peak = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > peak) peak = a; }
    if (peak < 1e-9) return x;
    const k = target / peak;
    for (let i = 0; i < x.length; i++) x[i] *= k;
    return x;
  }

  // De-click only: 0.3ms in, 2ms out. A buffered one-shot must not click at
  // either end, but the fade-in is a tax on the attack and these are percussion
  // — the whole identity of a hat is in its first few milliseconds. 0.3ms (13
  // samples) is enough to kill a start-of-buffer step and short enough to be
  // inaudible as a fade.
  //
  // ORDER MATTERS: shape() runs BEFORE normalize(), never after. Written the
  // other way round first, and it cost the hats 11dB — their absolute peak
  // lands inside the fade-in window (that is what a transient IS), so fading
  // after normalizing silently undid the normalization on exactly the voices
  // with the fastest attack. Measured: closed hat came out at 0.166 against a
  // 0.62 target. normalize() must be the last thing to touch amplitude, or the
  // patch-loudness guarantee is a comment rather than a fact.
  function shape(x) {
    const inN = Math.min(x.length, Math.round(0.0003 * SR));
    for (let i = 0; i < inN; i++) x[i] *= i / inN;
    const outN = Math.min(x.length, Math.round(0.002 * SR));
    for (let i = 0; i < outN; i++) x[x.length - 1 - i] *= i / outN;
    return x;
  }

  // ---- onset bloom ---------------------------------------------------------
  // The OPEN HAT does not arrive at full amplitude on its first millisecond.
  // Its VCA opens onto a bank that is already running, but the filter after it
  // has to charge, so the front of the hit holds level for ~12 ms instead of
  // decaying from the first sample. Modelled as a small swell, not a ramp:
  //
  //   bloom(t) = 1 - depth * exp(-t / rise)
  //
  // THE KICK DELIBERATELY DOES NOT GET ONE, and that is the finding of the
  // 2026-08-14 pass rather than an omission. The brief was to give kick and
  // open hat an attack rise, on the rig's `rise 10-90` probe reading 13.97 ms
  // for the machine's kick against 0 ms for ours — an apparent 14 ms ring-up.
  // It is not one. `rise10to90Ms` comes off a 5 ms RMS envelope, and a 5 ms
  // window over a 55 Hz waveform does not average a whole cycle; it ripples at
  // twice the fundamental. Measured instead cycle by cycle — the peak of each
  // half-cycle, which no window can smear — the machine's kick is at its
  // MAXIMUM on its first positive half-cycle, 1.0 ms in:
  //
  //   ref-kick, positive half-cycles only   1.0ms 1.00   10.1ms 0.83
  //                                        26.6ms 0.88   44.3ms 0.81
  //
  // There is no ring-up to model. What the raw half-cycle series does show —
  // 0.87 / 0.91 / 0.72 / 1.00 / 0.77 / 0.84 taking both signs — is half-cycle
  // ASYMMETRY: the machine's positive and negative excursions differ by 10-25%
  // early on and converge as the hit decays. That is a real and much larger
  // difference from our symmetric sine, it is what makes the RMS probe ripple
  // in the first place, and this file does not model it. It is the honest next
  // kick task, and it is not an envelope.
  //
  // Laddering confirmed the trap. analysis/onset-ladder.mjs will happily hand
  // the kick a bloom — depth 0.44 / rise 14 ms scores 0.2249 against 0.2735 for
  // none — and the whole of that gain is the artefact. At that cell `rise 10-90`
  // goes 0 -> 14.97 ms, landing on the machine's 13.97, while `attack peak`
  // moves 23.46 -> 30.44 ms AWAY from a reference whose peak is its first
  // positive half-cycle at 1.0 ms. The objective bought a probe and sold the
  // sound. Note also that BOTH of the ladder's criteria are computed off 5 ms
  // RMS windows, so on a 55 Hz waveform neither one is independent of the
  // ripple — which is why the cycle-by-cycle series above, and not the ladder,
  // is the authority here. Fitting it would have shipped a kick that fades in
  // from silence over 14 ms.
  //
  // The open hat is the opposite case and gets the bloom: it is broadband, so
  // its RMS envelope has no ripple artefact and the ladder's criteria mean what
  // they say. Reference envelope over the first 12 ms holds 0.88-0.92 and peaks
  // at 12 ms; ours fell from 1.00 at 4 ms to 0.77 by 9 ms. Depth 0.44 / rise
  // 5.5 ms is not either criterion's argmin and is not meant to be — the shape
  // error floor is broad and flat (0.1125 at no bloom -> 0.0483 here, against a
  // best of 0.0464) and the objective's step down happens right here (0.2911 ->
  // 0.1973, against a best of 0.1835). What settles it is the third number both
  // argmins get wrong: `attack peak` lands on 13.48 ms against the reference's
  // 13.48. Past 0.56 the shape error turns back up.
  //
  // The kick keeps the TERM at depth zero rather than losing it. `1 - 0*exp(x)`
  // is exactly 1.0 in IEEE754, so the drum is bit-identical to one without it —
  // but the ladder can still sweep the kick and reproduce the finding above
  // instead of taking a comment's word for it. An absence nobody can re-measure
  // is how this gets chased a third time.
  //
  // Exposed on U for the same reason PANEL_808_RANGES is: the ladder sweeps the
  // REAL voice rather than a second copy of it that can drift out of agreement
  // with this file.
  const ONSET = {
    bdDepth: 0, bdRise: 0.0090,      // bass drum: deliberately none — see above
    ohDepth: 0.44, ohRise: 0.0055,   // open hat:  laddered 2026-08-14
  };
  U.ONSET_808 = ONSET;

  // ---- circuit constants ---------------------------------------------------
  // The parts of these voices that are NOT knobs on the machine — filter
  // corners, burst spacing, damping. Gathered here and exposed on U for the
  // same reason ONSET and PANEL_808_RANGES are: analysis/fit-circuit.mjs fits
  // them against the reference by perturbing THE REAL VOICE, so there is no
  // second copy of the synthesis to drift out of agreement with this file.
  // Every number below carries where it came from.
  const CIRCUIT = {
    // BASS DRUM half-cycle asymmetry — the 2026-08-14 pass's named next gap,
    // picked up 2026-08-17. The machine's kick is not a symmetric sine: its
    // positive and negative excursions differ 10-25% early in the hit and
    // converge as it decays. Modelled as a quadratic term, y = x + d*x², which
    // is the shape that behaves that way for free — at amplitude A the peak
    // ratio is (1+dA)/(1−dA), so the asymmetry is largest when the drum is
    // loudest and vanishes as A falls, with no envelope to schedule. It also
    // adds the even harmonic a real bridged-T asymmetry adds. The DC the
    // quadratic leaves behind is removed by a 12 Hz high-pass, which is the
    // output stage's AC coupling doing what it actually does.
    bdAsym: 0.0,          // fitted below; 0 is bit-identical to no term at all

    // HAND CLAP. Bursts read off a 0.5 ms envelope of CP.WAV — a 5 ms window
    // smears 10 ms bursts into each other, the same artefact that cost the
    // onset pass a scope item. Measured burst peaks: 2.24, 12.22, 25.19 ms,
    // i.e. gaps of 10.0 and 13.0 ms. Everything after 25 ms is the tail's own
    // noise ripple, not a fourth pulse. Band peaks put the filter at 960-1.92k
    // (40.3 dB) with 480-960 next (34.1), and the tail's strongest partial is
    // 964 Hz — so one bandpass near 1 kHz, moderate Q, not a bright clap.
    cpBandHz: 1000, cpQ: 1.4, cpHpHz: 620,
    cpGap1: 0.0100, cpGap2: 0.0130,   // sec, between burst 1-2 and 2-3
    cpBurstTau: 0.0011,               // sec, each pulse's own damping
    cpTailTau: 0.0200,                // sec, the VCA's long open after burst 3
    cpTailLevel: 0.92,
    // THE TAIL DISCHARGES AT TWO RATES, 2026-08-23. Measured, not assumed:
    // clap-tail.mjs walks CP.WAV's own RMS envelope (the fitter's 5 ms window,
    // 1 ms hop) from its peak and reads the LOCAL tau at each 5 dB step:
    //     -3   -6   -10  -15  -20  -25  -30  -35  -40  -45  -50 dB
    //     11.6 5.8  30.3 15.6 31.2 57.2 34.7 95.3 152  260  151 ms
    // The rate does not hold — it grows by an order of magnitude across the
    // hit. Fitted over every frame from -1 dB down to 8 dB above the file's own
    // floor (which is at -71.6 dB, so none of this is dither: the deepest frame
    // fitted still sits 21 dB clear of it), two exponentials land at 22.5 ms /
    // 300 ms with 97% of the level in the fast one, rms error 2.24 dB. ONE
    // exponential over the same frames is 13.46 dB — six times worse. That gap
    // is the whole of the t20/t40 defect: with a single 90 ms tail we arrived at
    // -40 dB on schedule (251 vs 242 ms) and took two and a half times too long
    // to reach -20 (117 vs 47 ms), which is exactly what a one-rate decay
    // fitted through a two-rate one has to do.
    // THE CIRCUIT REASON. The tail cap does not discharge into a resistor
    // alone — it discharges into the VCA's control junction. While the control
    // voltage is well above the junction's knee the junction conducts and loads
    // the network hard (fast rate); once it falls below, the junction stops
    // conducting and only the bleed resistor is left (slow rate). A
    // junction-loaded discharge is two-rate by construction, and the sum of two
    // exponentials is its small-signal form.
    // The slow stage is load-bearing, not a rounding term: held at 150 ms the
    // best two-exponential fit is 8.66 dB rms, barely better than one rate at
    // 13.46. It wants 250-300 ms. cpTailSlow = 0 reduces this to the old
    // single-stage tail exactly, which is the null case the ladder started from.
    cpTailSlow: 0.100,                // fraction of the tail on the slow rate
    cpTailTau2: 0.400,                // sec, the slow rate once the junction stops conducting
    cpTailRise: 0.0060,               // sec, the tail cap's CHARGE time — see below
    // THE TAIL DOES NOT START AT ITS MAXIMUM; IT CHARGES INTO IT, 2026-08-30.
    // The clap's two largest canonical rows were both in the attack and neither
    // had ever been named: attack peak 25.45 ms against the machine's 38.42
    // (dist 0.4119) and rise 10-90 3.99 ms against 16.96 (dist 1.1522, the
    // largest single row on either voice in this task).
    // MEASURED FIRST, OFF CP.WAV, AT FIVE WINDOW LENGTHS — because a 38 ms peak
    // on a hit whose last burst is at 25 ms is surprising enough that the 5 ms
    // analysis window is the first suspect:
    //     window        1ms    2ms    3ms    5ms    8ms
    //     REF  peak    36.42  39.91  35.92  38.42  37.43 ms   <- flat
    //     REF  rise    13.47  13.47  13.47  16.46  30.43 ms   <- flat to 3 ms
    //     OURS peak    23.95  23.95  24.44  25.45  26.95 ms
    //     OURS rise     1.00   1.50   2.00   3.99   5.99 ms   <- IS the window
    // Ours has no rise at all: the number tracks the window length dead on, so
    // the 3.99 in the objective is the probe measuring itself. The machine's
    // 13.5 ms does not move across a 3x window change, so it is signal.
    // The tail is what rises, and it rises BROADBAND. Per-band envelope peaks in
    // the reference land at 34.8-37.7 ms in eight of ten bands and each gains
    // 2.5-6.3 dB between 25 ms and its own peak; ours peak at 23-32 and gain
    // 0-3.7. And the reference's spectrum at 36 ms is the same shape as at
    // 12 ms — within 3 dB across every band above 240 Hz, peaking in the same
    // 960-1.92k band — so this is one noise source through one filter arriving
    // late, not a second event in the recording. It is also not a pack fade-in:
    // a fade long enough to put the peak at 38 ms would bury burst 1, and
    // burst 1 reads -5.3 dB.
    // This does NOT reopen the fourth-pulse question the comment above closes.
    // At a 1 ms window the reference's inter-burst troughs read -33 / -32 dB at
    // 9 and 22 ms and only -16.6 dB at 30 ms: the floor UNDER the ripple lifts,
    // which is an envelope rising beneath the bursts, not another burst on top
    // of them. "Everything after 25 ms is the tail" stands; what is new is that
    // the tail is not yet at full level when it starts.
    // THE CIRCUIT. The same tail cap the two-rate discharge above is about has
    // to be CHARGED before it can discharge, and it charges through the gate's
    // own series resistance. So the tail's control voltage is
    // (1 - e^{-d/cpTailRise}) on the way up and the two-rate discharge on the
    // way down, and the envelope peaks where those cross — at
    // cpTailRise * ln(1 + cpTailTau/cpTailRise) after burst 3, which for the
    // fitted constants is 13 ms and puts the peak at 36 ms. Nothing here is a
    // shaped envelope; it is one more RC on the same node.
    // TWO-SIDED BEFORE FITTING: injecting a known rise into our own clap
    // recovers monotonically — a = 0/2/4/8/12 ms reads peak 25.4/29.4/32.4/
    // 38.4/38.4 and rise 3.99/6.98/8.98/10.98/15.96 — so the probe can see a
    // rise when one is put there, and it is not reporting one that is absent.
    // cpTailRise = 0 returns the pre-2026-08-30 circuit bit-for-bit, which is
    // the null the ladder started from. The buffer-length solver above is
    // deliberately left on the discharge-only form: a rise can only make the
    // tail quieter and therefore shorter, never longer, so the existing length
    // still covers it and the shared PRNG stream is untouched by construction.
    // THE GATE HAS A WIDTH, 2026-09-13 — and it is what fixes decay t20.
    // cc77b57 shipped the charge stage above and disclosed a regression with
    // it: decay t20 went 55.9 -> 64.9 ms against the machine's 46.9, the
    // largest row left on the voice. The cause is structural, not a bad fit.
    // With the charge and the discharge MULTIPLIED, the tail is still charging
    // through its own peak, so the first milliseconds after the peak are held
    // up by a rising term. The envelope has no corner; it cannot have one.
    // MEASURED FIRST, TWO-SIDED, AT SIX WINDOW LENGTHS — this thread has three
    // cases of a statistic that turned out to be its own probe:
    //     window (ms)      1      2      3      5      8     12
    //     REF  t20      25.9   43.9   47.9   46.4   55.9   57.9
    //     OURS t20      43.9   61.4   61.4   63.4   67.8   70.3
    // The number drifts with the window on BOTH sides, so no absolute value
    // here is quotable — but the gap is 15-20 ms at every window from 2 ms up
    // and never reverses. Read as a shape at a 10 ms window: the machine falls
    // ~20 dB in ~47 ms after its peak (tau ~25 ms) then flattens to tau ~85 ms;
    // ours took 65 ms for the first 20 dB (tau ~35 ms) then ran at tau ~46.
    // Too slow early and too fast late. The machine's knee is SHARPER than
    // ours. Our tail already had two rates; what it did not have was a corner.
    // AND THE EXISTING CONSTANTS COULD NOT BUY ONE. A full two-round ladder on
    // all four tail axes moved nothing (FITTED = {}, 0.1375 unchanged), and the
    // 42-cell cpTailRise x cpTailTau grid — they are coupled, so a coordinate
    // ladder cannot see the diagonal — shows why: t20 IS reachable there, 48.9
    // ms at rise 0.008 / tau 0.018, and it costs the attack, peak 34.43 instead
    // of 38.42 and rise 10-90 collapsing to 4.99 ms. TOTAL 0.1870. One RC
    // cannot both hold the peak out to 38 ms and drop 20 dB by 85 ms.
    // THE CIRCUIT. The gate is a pulse, and a pulse has a width. The cap
    // charges through the series resistance only while the gate is OPEN, and
    // the discharge starts from the instant it closes — so the envelope peaks
    // at the gate's trailing edge and turns a corner there. One constant, and
    // it is the one physical fact the product form leaves out.
    // cpTailGate = 0 selects the product form and returns the cc77b57 circuit
    // BIT-FOR-BIT (asserted: 93,829 samples, sample-for-sample identical).
    // WHAT IT BOUGHT, and what it cost. t20 44.9 ms vs 46.9 (0.3248 -> 0.0436),
    // rise 10-90 exactly on the machine at 16.96 (0.1716 -> 0.0000), peak held
    // at 38.42, centroid @80ms 0.1322 -> 0.0246. Against: per-band tau 0.2652
    // -> 0.3411, which is an artefact of the aggregate and worth reading before
    // treating as a loss — btau averages |log(ours/ref)| over the bands both
    // sides can measure, and on the nine the old circuit could measure the new
    // one is BETTER (0.2554 vs 0.2647). The row rises because 30-60 Hz is newly
    // measurable at 12.2 ms against the machine's 36.8, so a tenth and badly
    // matched term joins the mean. We gained low end and were charged for it.
    // NEITHER HALF WORKS ALONE, which is the evidence this is a circuit change
    // and not a fit: the gate with cpLpTau held at 0.035 scores 0.1573 and
    // cpLpTau 0.045 with no gate scores 0.1462 — both WORSE than the 0.1375
    // baseline. Only the pair is better. The buffer-length solver above DOES
    // have to know about this one (unlike cpTailRise, a width delays the
    // discharge rather than shortening it), so the gate is added there.
    cpTailGate: 0.0160,               // sec, how long the gate stays open
    // THE CLAP DARKENS AS IT DECAYS — 2026-08-18, and this is the whole defect
    // the 8/18 pass was chasing under the wrong name. Per-band tau on CP.WAV
    // falls monotonically with frequency: 110.1 ms at 120-240 Hz, 89.6, 73.9,
    // 57.7, then 26.1 / 21.0 / 19.5 above 1.92 kHz — a 5.6x tilt. One VCA on
    // already-filtered noise can only produce a FLAT tilt, and ours measured
    // flat at 33-38 ms in every band. Said the other way round, the machine's
    // centroid runs 1992 -> 2708 (20ms) -> 1647 (80ms) -> 1163 (160ms) while
    // ours sat flat and slightly RISING, which is the shape DICTIONARY.md
    // indexes as metallic. Modelled as a low-pass whose corner sweeps down
    // through the hit — one filter, three constants, and it grades the
    // per-band decay for free instead of one corner flattening it again.
    // cpLpStages is how many poles that sweep is. One pole could not make the
    // tilt steep enough: fitted at one stage the low bands still came back
    // 43/58/49/42 ms against the machine's 110/90/74/58, and pushing the tail
    // envelope out to fix them dragged the high bands out with it. Two poles
    // roll off 12 dB/oct instead of 6, which lets the tail envelope be long
    // enough for the bottom while the top still dies on schedule.
    // THE LOW END IS AUDIBLE AND THE OBJECTIVE CANNOT SEE IT — 2026-09-13,
    // ANSWERED, AND DELIBERATELY NOT FIXED. Kept here rather than in a thread
    // because the mechanism has now been built and thrown away twice.
    // THE DEFICIT, re-measured on this tree without a filter at all — a
    // whole-signal FFT, so no group delay and no window to argue about, which
    // is what the 08-30 reading got wrong with a causal 4-pole low-pass:
    //     band        0-30   30-60  60-120  120-240  240-480   480+   (dB re
    //     CP.WAV     -37.0   -46.8   -43.9    -39.3    -26.8   -0.0    total)
    //     ours       -59.2   -58.9   -56.0    -46.2    -28.5   -0.0
    // The headline "16.8 dB below 120 Hz" was hiding its own shape: the
    // machine's sub-120 energy is dominated by 0-30 Hz, most of which is below
    // hearing. In the band an ear actually has, 30-120 Hz, the deficit is
    // 12.1 dB, not 16.8.
    // THE MECHANISM TESTED. VCA control-voltage feedthrough: the tail gate's
    // own curve added back after BOTH output high-passes, so no filter change
    // can reach it. Raw, it is a near-DC blob and the objective hates it at
    // every level (0.1195 -> 0.1373 at the first step, monotone up from there)
    // — which is what 08-30 found and reported as "no level at which this
    // helps". THAT CLAIM NEEDS ONE CORRECTION: the tail CV is unipolar, so the
    // raw bleed puts its energy at literal DC, which no coupling cap passes and
    // no speaker reproduces. AC-couple it at 20 Hz, as any real output stage
    // does, and the objective stops getting worse.
    // BUT IT STILL CANNOT SEE IT. AC-coupled, the total reads 0.1177 / 0.1181 /
    // 0.1179 / 0.1178 / 0.1181 / 0.1182 across levels 0.0001 to 0.0015 — a
    // 15x change of level moving the fourth decimal non-monotonically — and the
    // whole surface over six corners x six levels lies between 0.118 and 0.126.
    // That is a STEP at zero followed by a plateau, not a fitted optimum: any
    // nonzero low-frequency floor changes which bands the per-band statistics
    // can measure, and that discretisation is the entire 0.0014. A constant
    // fitted to it would be fitted to the objective's own gate.
    // AND IT IS AUDIBLE, which is the answer the question was actually asked
    // for. At the level that closes the 30-120 Hz deficit to the machine
    // (0.004, AC-coupled) audibility.mjs reads peak NMR 28.08 dB, lit frac
    // 0.0054 — over the gate on both criteria, and still over it at half that
    // level (22.07 dB, 0.0030). So of the two branches 08-30 left open, it is
    // (b): the deficit is real, it is audible, and the canonical objective has
    // no row that can see it. Closing it will never show up as a number, and
    // nothing in this lane should be fitted to it.
    // ONE SHAPE MISMATCH, for whoever does fix it: the bleed over-delivers at
    // 30-60 Hz and under-delivers at 60-120 relative to the machine, at every
    // corner tried. Feedthrough of this envelope is the wrong spectral slope,
    // so the mechanism is probably not exactly right even though the band is.
    // The working stage is a 64-line patch in
    // files/unison/clap-t20-2026-09-13/clap-cv-bleed.patch in the studio
    // workspace; it adds no samples and does not re-roll the shared PRNG.
    cpLpStart: 22000, cpLpEnd: 850, cpLpTau: 0.045, cpLpStages: 2,
    // Second high-pass pass. Peak band balance had us +14.4 dB at 120-240 and
    // +9.2 at 240-480 against the machine, and within 3 dB everywhere above
    // 480 — one pole at 620 Hz is not steep enough to keep the thump out.
    cpHp2Hz: 1600,

    // RIM SHOT. Two resonances off a 1024-point window sized to the 13 ms hit:
    // 476.1 Hz at 0 dB and 1711.6 Hz at −5.7 dB. Damping from the band decays
    // (240-960 Hz t20 = 8.7 ms, 960-1.92k t20 = 5.8 ms — the high resonance
    // dies first, which is why the hit reads as a click and not a tone).
    rsF1: 476.1, rsF2: 1711.6, rsA2: 0.38,
    rsTau1: 0.0040, rsTau2: 0.0028, rsClick: 1.00,
    // The third mode, 2026-08-18. The 8/17 window found it (934.6 Hz at
    // -10.2 dB, and 732.3 at -13.1) and only the top two were modelled, which
    // left a 15.7 dB hole in the 960 Hz-1.92 kHz band against the machine.
    // MORE MODES, measured 2026-08-18. The 8/17 pass took two peaks off a
    // 1024-point window and stopped. Reading RS.WAV's top twelve gives a whole
    // comb — 476 / 732 / 935 / 1255 / 1475 / 1712 / 2153 / 2551 / 2974 / 3874
    // Hz at 0 / -13.1 / -10.2 / -19.7 / -20.7 / -5.7 / -17.9 / -19.2 / -18.0 /
    // -22.7 dB — and the two-mode model left a 15.7 dB hole at 960 Hz-1.92 kHz
    // and a 31.1 dB hole at 1.92-3.84 kHz. Five modes cover the comb's spine.
    rsF3: 934.6, rsA3: 0.55, rsTau3: 0.0038,
    rsF4: 2153, rsA4: 0.2, rsTau4: 0.0038,
    rsF5: 2974, rsA5: 0.13, rsTau5: 0.0030,
    // MODE AMPLITUDES REALIGNED TO THE PEAKS THEY WERE MEASURED FROM,
    // 2026-08-22. The frequencies above came off RS.WAV's top-twelve peaks, but
    // the AMPLITUDES did not — they were left to the 08-18 fitter, which was
    // still trying to make a bandlimited-free click's missing colour out of
    // sine level and pushed three of them far past what the spectrum says:
    //   mode      measured   was     inflation
    //   rsA2      0.519      1.05      2.02x     (1712 Hz, -5.7 dB)
    //   rsA3      0.309      0.65      2.10x     ( 935 Hz, -10.2 dB)
    //   rsA4      0.127      0.45      3.53x     (2153 Hz, -17.9 dB)
    //   rsA5      0.126      0.13      1.03x     (2974 Hz, -18.0 dB)
    // rsA2 at 1.05 made the 1712 Hz mode LOUDER than the 476 Hz fundamental,
    // which no reading of the reference supports. rsA5 — the one mode the
    // fitter happened to leave alone — was already dead on, which is the tell.
    // Re-laddered on the full objective they land at 0.38 / 0.55 / 0.2 / 0.13:
    // near the measured values, all interior to their ladders, none at a bound.
    // WHICH MODE LEADS. Windowed at 128 points over the first 2.9 ms the
    // machine's strongest peak is 1728 Hz, not 476 — the high mode leads the
    // hit and the low one takes over from 3 ms (479 Hz at 0 dB, 1726 still at
    // -3.9). That is why the machine reads as a click with a pitch in it. Ours
    // had it the other way round: energy(0-3ms)/energy(3-13ms) was 6.18 against
    // the machine's 1.33, i.e. our hit was five times too front-loaded.
    // The excitation, named for what it is rather than left as three literals.
    rsClickHz: 300, rsClickTau: 0.00500, rsClickLen: 0.0050,
    // THE CLICK IS BANDLIMITED, 2026-08-22. It was white noise, one-pole
    // high-passed at 300 Hz and nothing else, so it ran flat to Nyquist and put
    // us +10.0 dB at 7.68-15.36k and +21.8 at 15.36-20k against the machine —
    // "splatter", and the largest single term inside the rim's largest
    // canonical row. The machine's click leaves through a lossy network and a
    // bandlimited output stage: RS.WAV falls -8.5 dB from band 7 to band 8 and
    // -12.3 dB more into band 9 (~-17 dB/octave up there, band 9 being only 0.7
    // octaves wide). ONE POLE CANNOT DO THAT — 1.7 octaves of 6 dB/oct buys
    // -10 dB where -22 is asked — so this is two cascaded poles.
    //
    // Checked FIRST that the machine's top bands are signal and not the WAV's
    // own dither, because the last thing in this task that looked like a target
    // turned out to be a noise floor. Within-band against RS.WAV's own per-band
    // floor (analysis/band-floor.mjs), band 8 sits 40.1 dB clear of its floor
    // and band 9 sits 27.5 dB clear. Real machine, so a real target.
    // Order matters as much as corner, and the two trade against each other.
    // A GENTLE filter placed LOW does close bands 8 and 9, but it takes band 7
    // with it — 2 poles at 4 kHz measures -7.2 dB at 3.84-7.68k where we were
    // already right, and the full objective rejects it (0.1557 against 0.1228).
    // The machine's shape is the opposite: flat through band 7, then a cliff.
    // That is what an output stage's anti-alias filter looks like, so the model
    // is a STEEP filter placed HIGH rather than a gentle one placed low.
    rsClickLp: 13000, rsClickLpPoles: 3,
    // THE DAMPER, 2026-08-30 — the rim's decay has a KNEE, and the knee is why
    // three passes of tau laddering could not reach t40.
    //
    // WHAT THE REFERENCE DOES. RS.WAV's decay is not one rate and not a smooth
    // acceleration. It is two straight segments in dB with a corner between
    // them. Fitted separately over -2..-16 dB and -18..-50 dB, read at FIVE
    // window lengths so the corner cannot be an artefact of the analysis
    // window (1 / 2 / 3 / 5 / 8 ms):
    //   REF   seg1 tau  6.78 / 5.15 / 4.79 / 4.52 / 4.33 ms
    //         seg2 tau  1.10 / 1.21 / 1.20 / 1.21 / 1.21 ms   <- flat
    //   OURS  seg1 tau  4.34 / 3.65 / 3.61 / 3.60 / 3.62 ms
    //         seg2 tau  4.17 / 3.98 / 3.96 / 3.96 / 3.95 ms   <- one rate
    // The machine's second segment reads 1.2 ms at every window from 1 to 8 ms.
    // A statistic that does not move as the window changes by 8x is not a
    // window effect. The corner sits at the -16 dB crossing, 10.0 ms in on the
    // least-smeared (1 ms) read.
    //
    // WHY THIS IS NOT THE CLOSED QUESTION. d4cae29 proved no ADDITIVE decay
    // stage can reach this: a sum of exponentials is a log-sum-exp of affine
    // functions, so its dB envelope can only ever DEcelerate. That proof is
    // sound and it is not violated here, because this stage is MULTIPLICATIVE.
    // In dB a product is a sum, so exp(-t/tau) x exp(-(t-t0)/g) is piecewise
    // linear with a STEEPER second segment — an accelerating decay, reachable,
    // and reachable only this way. The circuit reading is a damper that lands
    // on the ringing network when the trigger one-shot's pulse ends, and it is
    // the exact mirror of the clap's cpTailSlow (e91ba61), where a junction
    // LEAVING the load made the decay slow down instead.
    //
    // NOR IS IT THE TRUNCATION THAT WAS DISPROVED. Truncation is an instant cut
    // to zero and reads tail tonality 0.000. This keeps ringing to -70 dB over
    // the following 5 ms; the tail frames still hold real signal.
    //
    // MEASURED FIRST, THEN LADDERED, AND THE TWO AGREE. rsGateAt 0.010 is the
    // measured corner. rsGateTau 0.0022 against the modes' own ~4 ms gives an
    // effective second-segment tau of 1.4 ms by hand and 1.58 ms measured, in
    // reach of the machine's 1.20 from 3.96. Both won a joint 8x7 grid, not a
    // coordinate descent — the neighbourhood reads 0.04-0.06 throughout, so
    // this is a plateau rather than a spike.
    //
    // STILL SHORT, DISCLOSED. Our seg2 reads 1.58 ms against the machine's
    // 1.20, so the damper is about 30% slow even at the objective's optimum,
    // and the per-frame bed measurement at 11.6 ms reads 0.886 tonal against
    // the machine's 0.704. There is a real broadband-in-the-tail remainder
    // underneath this; the damper is most of the answer, not all of it.
    rsGateAt: 0.010, rsGateTau: 0.0022,

    // TOMS. Decay per family from the corpus, taken at the middle of each
    // TUNING knob, with the small shortening the knob actually causes folded in
    // as `tomTauTilt` (LT 89.9→86.1 ms over the whole knob is −4.2%).
    ltTau: 0.0875, mtTau: 0.0579, htTau: 0.0418,
    tomTauTilt: -0.05,
    // The bridged-T's pitch drop. Small — a tom is nearly a steady sine by
    // 10 ms, unlike the kick, which sweeps 2.4x.
    tomDrop: 0.09, tomDropTau: 0.014,
    tomClick: 0.16, tomClickHp: 1800, tomClickTau: 0.0016,
  };
  U.CIRCUIT_808 = CIRCUIT;

  // ---- bass drum -----------------------------------------------------------

  function bassDrum(p, rnd) {
    const tau = p.bdDecay;
    const x = alloc(Math.min(2.6, tau * 8 + 0.06));
    const fEnd = p.bdTune;
    const fStart = fEnd * 2.4;
    // A higher-tuned drum sweeps down faster — the network's Q rises with pitch.
    const tauP = 0.03183 - 0.013 * p.pos.bdTune;
    let ph = 0, ph2 = 0;
    for (let i = 0; i < x.length; i++) {
      const t = i / SR;
      const f = fEnd + (fStart - fEnd) * Math.exp(-t / tauP);
      ph += (2 * Math.PI * f) / SR;
      ph2 += (2 * Math.PI * f * 2) / SR;
      // ONSET.bdDepth is ZERO on purpose — see ONSET above. The machine's kick
      // is at full amplitude on its first half-cycle; the 14 ms "rise" the rig
      // reports is its own window rippling against a 55 Hz waveform. The term
      // stays so analysis/onset-ladder.mjs can re-derive that, and multiplies
      // by exactly 1.0 while the depth is zero.
      const env = Math.exp(-t / tau) * (1 - ONSET.bdDepth * Math.exp(-t / ONSET.bdRise));
      x[i] = (Math.sin(ph) + 0.13 * Math.sin(ph2) * Math.exp(-t / 0.012)) * env;
    }
    // TONE: the trigger pulse itself, high-passed, sitting in front of the ring.
    const cn = Math.round(0.006 * SR);
    const click = new Float32Array(cn);
    for (let i = 0; i < cn; i++) {
      const t = i / SR;
      click[i] = ((rnd() * 2 - 1) * 0.5 + (i === 0 ? 1 : 0)) * Math.exp(-t / 0.0009);
    }
    onePoleHP(click, 1400);
    for (let i = 0; i < cn && i < x.length; i++) x[i] += click[i] * p.bdTone * 0.9;
    // HALF-CYCLE ASYMMETRY, 2026-08-17. See CIRCUIT.bdAsym. Applied BEFORE the
    // output-stage saturation, because on the machine it is the ringing network
    // that is asymmetric and the output stage that then rounds the result — the
    // other order would have the saturator flatten the asymmetry it is supposed
    // to pass on. At bdAsym = 0 this loop is `x + 0*x*x`, which is exactly x in
    // IEEE754, so the drum is bit-identical to one without the term.
    if (CIRCUIT.bdAsym !== 0) {
      for (let i = 0; i < x.length; i++) x[i] = x[i] + CIRCUIT.bdAsym * x[i] * x[i];
      onePoleHP(x, 12);   // the output stage's AC coupling: take the DC back out
    }
    // output-stage saturation: rounds the transient, thickens the fundamental
    const k = Math.tanh(1.25);
    for (let i = 0; i < x.length; i++) x[i] = Math.tanh(x[i] * 1.25) / k;
    return normalize(shape(x), 0.98 * p.bdLevel);
  }

  // ---- snare ---------------------------------------------------------------

  // DECAY, read off the machine's own panel grid rather than fitted blind.
  //
  // The 08-11 rig's Finding 1 (snare decay far too long) and Finding 4 (our TONE
  // knob lengthens the hit; the machine's does not) are the same bug seen twice,
  // and measuring the corpus's 25 TONE x SNAPPY cells says what the shape should
  // be. Machine tauMs, rows TONE 0..100, cols SNAPPY 0..100:
  //
  //            sn0   sn25   sn50   sn75  sn100
  //    tn0    28.5   28.5   28.7   31.0   30.4
  //   tn25    28.5   28.6   28.4   29.8   30.6
  //   tn50    27.5   27.6   28.4   29.4   32.6
  //   tn75    22.3   22.4   26.8   30.6   31.8
  //  tn100    16.1   16.1   25.4   29.5   31.3
  //
  // Read the edges. At SNAPPY 0 the tail is the drum alone (the machine's tail
  // tonality there is 0.98-0.99 at every TONE), so that column IS the body decay:
  // 28.5 ms falling to 16.1 as TONE opens. At SNAPPY 100 the tail is the noise,
  // and it sits at ~31 ms no matter where TONE is. So the machine's TONE shortens
  // the BODY and leaves the NOISE alone — ours did the opposite, stretching the
  // noise from 32 to 137 ms while the drum barely moved. Hence:
  //
  //   tauBody  = 16.1 ms + 12.4 ms * (1 - TONE)     the sn0 column, endpoint to endpoint
  //   tauNoise = 32 ms, flat                         the sn100 row, which is flat
  //
  // Laddered over all 25 cells against the machine (mean |log ratio|, lower is
  // better) — the shaped model beats both today's and a fully flat pair:
  //
  //   candidate                       tau     t20     t40
  //   current                      1.0465  0.9851  1.0097
  //   flat 32/26 (no TONE term)    0.1091  0.2292  0.1037
  //   16.1+12.4 / 32 flat  <-      0.1004  0.1820  0.0892
  //
  // TONE now only moves the noise's bandpass, which is what a TONE knob is for.
  function snareDrum(p, rnd) {
    const tauBody = 0.01687 + 0.0124 * (1 - p.pos.sdTone);
    const tauNoise = 0.032;
    const x = alloc(Math.max(tauBody, tauNoise) * 7 + 0.03);
    const noise = new Float32Array(x.length);
    for (let i = 0; i < noise.length; i++) noise[i] = rnd() * 2 - 1;
    bandpass(noise, 572.1 + 3300 * p.pos.sdTone, 0.85);
    onePoleHP(noise, 700);
    const f1 = p.sdTune, f2 = f1 * 1.83;
    const snap = p.sdSnappy;
    let p1 = 0, p2 = 0;

    const leadBias = { newWave: 0.50, synthPop: 0.68, synthRnB: 0.55, earlyHipHop: 0.14, funk: 0.25 }[lane];
    const foreground = R.r() < leadBias ? "lead" : "bass";
    const density = +R.r().toFixed(3);                                // draw 8 — sparse↔dense

    // draws 9,10,11 — the two-stage influence draw. Stage 1 is a plain boolean
    // gate; stage 2 selects; the blend dial then decides how much of the chosen
    // influence's patch set lands. 10 and 11 are always drawn and discarded when
    // the gate fails, so the stream count stays fixed (see the header).
    const influenceGate = R.r() < U.INFLUENCE_GATE;
    const influenceRoll = R.ri(0, U.INFLUENCES.length - 1);
    const blendRoll = +R.r().toFixed(3);
    const influence = influenceGate ? U.INFLUENCES[influenceRoll] : null;
    const influenceBlend = influenceGate ? blendRoll : 0;
    let influencePatches = [];
    if (influence) {
      const all = U.INFLUENCE_PATCHES[influence];
      const n = Math.min(all.length, Math.max(1, Math.round(influenceBlend * all.length)));
      influencePatches = all.slice(0, n);
    }
    const has = (patch) => influencePatches.indexOf(patch) > -1;

    // draws 12..30 — one pattern pick per voiced desk role, in U.DESK_ROLES
    // order (plus the bass voice at 21). Books no longer carry silence entries: every one of these returns a
    // real pattern, and whether the strip is up is the mute draw further down.
    const picks = {};
    picks.kick = U.pickWeighted(R, U.KICK[lane]);
    picks.snare = U.pickWeighted(R, U.forLane(U.SNARE, lane));
    picks.hats = U.pickWeighted(R, U.HATS);
    picks.tomsFills = U.pickWeighted(R, U.FILLS);
    // ePerc is lane-gated as of 2026-08-31 (the rim entries), through the same
    // U.forLane the snare and comp books already use. One draw either way —
    // pickWeighted takes exactly one value however long the list is — so tier 1
    // stays at its fixed count and the canonical order above is untouched.
    picks.ePerc = U.pickWeighted(R, U.forLane(U.EPERC, lane));
    // draw 17 — the percTime pattern. U.pickWeighted's exact walk, kept open
    // so the residual is readable (as draws 21 and 69): a residual under the
    // lane's U.SHAKERS_SHARE puts the human shakers on the strip (decided
    // below, after the influence patches). No new draw.
    const ptList = U.PERCTIME;
    let ptTotal = 0; for (const e of ptList) ptTotal += e.w;
    let ptX = R.r() * ptTotal, ptPick = ptList[ptList.length - 1], ptResidual = 0;
    for (const e of ptList) { if (ptX - e.w < 0) { ptPick = e; ptResidual = ptX / e.w; break; } ptX -= e.w; }
    picks.percTime = ptPick;
    // draw 18 — the percAccent pattern. U.pickWeighted's exact walk, kept
    // open so the residual is readable (as draw 17): a residual under the
    // lane's U.CONGAS_SHARE puts the human congas / bongos on the strip
    // (decided below, after the influence patches). No new draw.
    const paList = U.PERCACCENT;
    let paTotal = 0; for (const e of paList) paTotal += e.w;
    let paX = R.r() * paTotal, paPick = paList[paList.length - 1], paResidual = 0;
    for (const e of paList) { if (paX - e.w < 0) { paPick = e; paResidual = paX / e.w; break; } paX -= e.w; }
    picks.percAccent = paPick;
    picks.bass = U.pickWeighted(R, U.BASS[lane]);
    const bassMask = R.ri(0, 63);          // one draw, decoded per bass kind
    // draw 21 — the bass voice. U.pickWeighted's exact walk, kept open so the
    // residual is readable (as draw 69): a residual under the lane's
    // U.BASSGUITAR_SHARE makes it a bass-guitar song, unless the pattern is
    // one a string cannot play (U.BASSGUITAR_NEVER). No new draw.
    const bvList = U.BASS_VOICE[lane];
    let bvTotal = 0; for (const e of bvList) bvTotal += e.w;
    let bvX = R.r() * bvTotal, bvPick = bvList[bvList.length - 1], bvResidual = 0;
    for (const e of bvList) { if (bvX - e.w < 0) { bvPick = e; bvResidual = bvX / e.w; break; } bvX -= e.w; }
    const bassVoice = !U.BASSGUITAR_NEVER[picks.bass.kind] && bvResidual < (U.BASSGUITAR_SHARE[lane] || 0) ? "bassguitar" : bvPick.id;
    picks.compA = U.pickWeighted(R, U.forLane(U.COMP, lane));
    const compMask = R.ri(0, 63);
    // compB — not voiced, no draws (see header). rhythmGtr: draws 85–87 below.
    picks.pad = U.pickWeighted(R, U.PAD);
    picks.arp = U.pickWeighted(R, U.ARP);
    picks.lead = U.pickWeighted(R, U.LEAD);
    const leadPhrase = R.ri(0, 63);
    picks.counter = U.pickWeighted(R, U.COUNTER);
    const counterPhrase = R.ri(0, 63);
    picks.color = U.pickWeighted(R, U.COLOR);
    // draws 31, 32 — the poly synth on the chord strips, and its slop seed
    const polyVoice = U.pickWeighted(R, U.POLY_VOICE[lane]).id;
    const polySeed = R.ri(1, 2147483646);

    // draws 33..46 — strip mutes, one per voiced role in U.DESK_ROLES order.
    // ALWAYS drawn, even where the probability is zero, so retuning a mute
    // weight can never shift the stream. This is the mixing board deciding what
    // is up, which is the only place a strip goes quiet (Jeff, 8/03).
    const arrange = U.LANE_ARRANGE[lane] || {};
    const muteBias = arrange.mute || {};
    const mutes = {};
    for (const role of U.DESK_ROLES) {
      if (U.VOICED_ROLES.indexOf(role.id) < 0) continue;
      const p = Math.min(1, Math.max(0, (role.mute || 0) + (muteBias[role.id] || 0)));
      mutes[role.id] = R.r() < p;
    }
    // Books whose whole idea is the stab ("the harmony IS the stab") pull the
    // colour strip back up. Was a book-level forceColor override; it is a mix
    // override now, same intent.
    if (harmony.forceColor) mutes.color = false;

    // draw 47 — production style (production/production.js). Genre biases the
    // weights; the effects themselves never leave the production room.
    const production = U.drawProduction(R, lane);

    // draws 48–62 — the 808 front panel. Always drawn, whatever the kit: a
    // machine-flavour song plays it, a studio-flavour song discards it, and the
    // draw count is identical either way. That is the same "draw first, discard
    // if unused" discipline the influence gate uses, and it is what will let the
    // Linn's own panel append cleanly at 61 without moving anything.
    const panel808 = U.draw808Panel(R);

    // draw 69 — the drum machine (U.DRUM_MACHINE, books.js), and draws 70–84 —
    // the Linn-family panel, appended where the note above said it would go.
    // Both always drawn; the panel is discarded on an 808 song.
    // (U.pickWeighted's exact walk, kept open so the residual is readable)
    const dmList = U.DRUM_MACHINE[lane];
    let dmTotal = 0; for (const e of dmList) dmTotal += e.w;
    let dmX = R.r() * dmTotal, dmPick = dmList[dmList.length - 1], dmResidual = 0;
    for (const e of dmList) { if (dmX - e.w < 0) { dmPick = e; dmResidual = dmX / e.w; break; } dmX -= e.w; }
    const drumMachine = dmPick.id;
    // A Linn song plays its hats strip's closed hat on the ride instead, for
    // the whole song, at the lane's rate (books.js U.LINN_RIDE).
    const linnRide = drumMachine === "linn" && dmResidual < (U.LINN_RIDE[lane] || 0);
    const panelLinn = U.drawLinnPanel(R);

    // draws 85–87 — the RHYTHM GUITAR (2026-10-03), APPENDED after the Linn
    // panel so every earlier draw stays where it was: 85 the rhythmGtr
    // pattern (U.rhythmGtrBook(lane), books.js), 86 its phrase mask (as the
    // comp mask at 23), 87 its strip mute (uniform against the lane's
    // U.RHYTHMGTR_MUTE). Always all three, for every song, muted or not. The
    // strip is NOT in U.VOICED_ROLES (that list drives the mutes at 33–46);
    // it is U.VOICED_LATE (desk.js), drawn here.
    picks.rhythmGtr = U.pickWeighted(R, U.rhythmGtrBook(lane));
    const gtrMask = R.ri(0, 63);
    mutes.rhythmGtr = R.r() < Math.min(1, Math.max(0, U.RHYTHMGTR_MUTE[lane] || 0));

    // influence patches — applied over the lane draw, never owning the song.
    // Which patches land is the blend dial (INFLUENCE_PATCHES priority order).
    if (influence === "motorik") {
      if (has("kick")) picks.kick = { id: "influence.motorik.kick", p: "x...x...x...x..." };
      if (has("hats")) picks.hats = { id: "influence.motorik.hats", p: "x.x.x.x.x.x.x.x." };
      if (has("noFills")) mutes.tomsFills = true;   // "fills forced silent" — now a mute
    } else if (influence === "disco") {
      if (has("kick")) picks.kick = { id: "influence.disco.kick", p: "x...x...x...x..." };
      if (has("hats")) { picks.hats = { id: "influence.disco.hats", p: "x.o.x.o.x.o.x.o." }; mutes.hats = false; }
      if (has("bass")) { picks.bass = { id: "influence.disco.bass", kind: "octaveAlt" }; mutes.bass = false; }
    } else if (influence === "reggaeDub") {
      // the one-drop is a COUPLED kick+snare pair on beat 3 (Brief 2), so it is
      // one patch; the realizer reads `oneDrop` off the sheet for the snare half
      if (has("oneDrop")) picks.kick = { id: "influence.dub.onedrop", p: "........x......." };
      if (has("skank")) {
        picks.compA = { id: "influence.dub.skank", kind: "grid", p: "..x...x...x...x." };
        // the guitar strip, when up, plays the skank too
        if (!mutes.rhythmGtr) picks.rhythmGtr = U.RHYTHMGTR.find((e) => e.id === "gtr.skank");
      }
    } else if (influence === "afrobeat") {
      if (has("percTime")) { picks.percTime = U.PERCTIME[0]; mutes.percTime = false; }
      if (has("percAccent")) { picks.percAccent = U.PERCACCENT[0]; mutes.percAccent = false; }
    }
    // the percTime strip's instrument: the kit (as ever) or, on draw 17's
    // residual, the human shakers with the voicing for its pattern
    const percShakers = !U.SHAKERS_NEVER[picks.percTime.id] && ptResidual < (U.SHAKERS_SHARE[lane] || 0)
      ? U.SHAKERS_FOR_PATTERN(picks.percTime.id, lane) : null;
    // the percAccent strip's instrument: the kit (as ever) or, on draw 18's
    // residual, the human hand drums with the voicing for its pattern
    const percCongas = paResidual < (U.CONGAS_SHARE[lane] || 0) ? U.CONGAS_FOR_PATTERN(picks.percAccent.id, lane) : null;
    // THE 808'S AUXILIARY PERCUSSION GATE (2026-10-04, Asana 1219144675109548;
    // Jeff: "focus on kick snare hats and clap when using that. Everything
    // else should be rare and in the background in terms of levels"). On an
    // 808 song (the 808 on the machine kit) each aux strip the kit plays —
    // tomsFills, ePerc, percAccent when the human hand drums are not on it —
    // that the desk left up stays up with probability U.PERC808_KEEP[strip]
    // (books.js), else it is muted. "Rare" is this gate; "in the background"
    // is U.TRIM_808_PERC_DB on the strip (buildSong). The rolls come from a
    // FORK, U.forkPrng(hash, "perc808"), read only on 808 songs: tier 1's
    // draw order is frozen and the mutes (33–46) come before the machine
    // (69), so the gate cannot be a song-stream draw, and every Linn and
    // studio-kit sheet is untouched. One roll per strip in this order whether
    // or not the strip is up, so a strip's fate never depends on another's.
    // Strips an influence patch forced up (afrobeat's percAccent) are the
    // song's deliberate spice: exempt from the gate, still trimmed.
    let perc808 = null;
    if (drumMachine === "808" && feel.kit === "machine") {
      if (!R.hash) throw new Error("drawSession: an 808 song needs the stream's hash (U.makePrng) for the perc808 fork");
      const G = U.forkPrng(R.hash, "perc808");
      const forcedUp = influence === "afrobeat" && has("percAccent") ? ["percAccent"] : [];
      perc808 = { gated: [], kept: [], forced: [] };
      for (const st of ["tomsFills", "ePerc", "percAccent"]) {
        const roll = G.r();
        if (mutes[st] || (st === "percAccent" && percCongas)) continue;
        if (forcedUp.indexOf(st) > -1) perc808.forced.push(st);
        else if (roll < U.PERC808_KEEP[st]) perc808.kept.push(st);
        else { mutes[st] = true; perc808.gated.push(st); }
      }
    }
    // THE LINN'S AUXILIARY PERCUSSION, SPARINGLY (2026-10-04, Asana
    // 1219146890584479; Jeff: "I like the rest of the percussion on Linn
    // better than 808. But should still be used sparingly."). The 808's gate
    // above, mirrored on Linn songs: the same strips and rule, its own fork
    // (U.forkPrng(hash, "perclinn"), read only on Linn songs) and keep table
    // (U.PERCLINN_KEEP, books.js), so every 808 and studio-kit sheet is
    // untouched. Level: U.TRIM_LINN_PERC_DB on top of the strip's
    // LINN_TRIM_DB (buildSong). percTime stays out on both machines: it plays
    // the time-keeping cabasa and tambourine (the hats-and-shaker role) and is
    // already "quiet" in books.js.
    let perclinn = null;
    if (drumMachine === "linn") {
      if (!R.hash) throw new Error("drawSession: a Linn song needs the stream's hash (U.makePrng) for the perclinn fork");
      const G = U.forkPrng(R.hash, "perclinn");
      const forcedUp = influence === "afrobeat" && has("percAccent") ? ["percAccent"] : [];
      perclinn = { gated: [], kept: [], forced: [] };
      for (const st of ["tomsFills", "ePerc", "percAccent"]) {
        const roll = G.r();
        if (mutes[st] || (st === "percAccent" && percCongas)) continue;
        if (forcedUp.indexOf(st) > -1) perclinn.forced.push(st);
        else if (roll < U.PERCLINN_KEEP[st]) perclinn.kept.push(st);
        else { mutes[st] = true; perclinn.gated.push(st); }
      }
    }
    // THE MINIMOOG ON THE MONO PITCHED STRIPS (2026-10-05, Asana
    // 1219144675065278): lead, counter (the hook riff) and arp each play the
    // Juno or the Minimoog, P(Minimoog) = U.MOOG_ROLES[lane][strip] (books.js,
    // Juno majority everywhere). A FORK, U.forkPrng(hash, "moogRoles"), read
    // for EVERY song, three rolls in this fixed order whether or not the strip
    // is up, so tier 1 stays 87 draws and no strip's voice depends on another.
    if (!R.hash) throw new Error("drawSession: the moogRoles fork needs the stream's hash (U.makePrng)");
    const MG = U.forkPrng(R.hash, "moogRoles");
    const moogW = U.MOOG_ROLES[lane];
    const leadVoice = MG.r() < moogW.lead ? "minimoog" : "juno";
    const counterVoice = MG.r() < moogW.counter ? "minimoog" : "juno";
    const arpVoice = MG.r() < moogW.arp ? "minimoog" : "juno";
    // the rhythmGtr strip's voicing for its pattern (heard only when the strip is up)
    const gtrVoicing = U.GTR_FOR_PATTERN(picks.rhythmGtr.id, lane);
    const sixties = influence === "sixtiesPop" && has("form");
    const sections = sixties ? FORMS[3].s : form.s;

    // bar map
    const bars = [];
    for (const [name, len] of sections) {
      for (let i = 0; i < len; i++) bars.push({ section: name, indexInSection: i, sectionLen: len });
    }
    for (let i = 0; i < bars.length; i++) {
      const b = bars[i];
      b.energy = SECTION_ENERGY[b.section];
      b.last = b.indexInSection === b.sectionLen - 1;
      b.fillWindow = b.last && i < bars.length - 1;
    }

    const barSec = 4 * (60 / bpm);
    return {
      lane, laneLabel: U.LANE_LABEL[lane], bpm, swing, tonicPc, mode,
      harmony, form: sixties ? FORMS[3] : form,
      foreground, density,
      influence, influenceBlend, influencePatches,
      picks, bassVoice, polyVoice, polySeed, mutes, production, panel808, drumMachine, panelLinn, linnRide, percShakers, percCongas, gtrVoicing,
      // present on 808 songs only, so every other sheet is field-for-field what it was
      ...(perc808 ? { perc808 } : {}),
      // present on Linn songs only (2026-10-04)
      ...(perclinn ? { perclinn } : {}),
      // the mono pitched strips' instrument (2026-10-05, the moogRoles fork)
      leadVoice, counterVoice, arpVoice,
      masks: { bass: bassMask, comp: compMask, lead: leadPhrase, counter: counterPhrase, gtr: gtrMask },
      bars, totalBars: bars.length, barSec, lengthSec: bars.length * barSec,
      kit: U.LANE_FEEL[lane].kit,
    };
  };

  // ---------------------------------------------------------------------------
  // TIER 2 — realization
  // ---------------------------------------------------------------------------

  // `opts` is render-time only and never touches the draw stream:
  //   legacyDrums — build the kit from the generic drums.js voices instead of
  //   the drawn 808 panel. Exists so the same hash can be rendered both ways
  //   for an A/B listen. Like forceLane, it changes what you hear, not what
  //   was drawn.
  // Minimoog bass (sheet.bassVoice === "minimoog", draw 21): which lane patch
  // plays which drawn bass pattern. The rule since 2026-09-24; no extra draw.
  const MOOG_BASS_FOR_KIND = {
    sub808: "round", pedal: "round", rootQuarters: "round", walk: "round",
    synco16: "pluck", octavePush: "pluck", oneNote: "pluck", octaveSlide: "pluck", octaveAlt: "pluck", rootEighths: "pluck",
    seq16: "squelch",
    riffHook: "fat",
  };

  // Patch-loudness trim for the Minimoog on the bass strip, in dB, landing on
  // the strip's trim gain (desk.js guarantee 2). Reference: the Juno "bass"
  // patch at 0 dB. MEASURED 2026-09-24 (harness/moog-bass-trim.mjs, data in
  // analysis/fits/minimoog-bass-trim-2026-09-24.json): 24 songs, two per bass
  // pattern kind, each song's real bass line played solo through every voice,
  // K-weighted loudness (BS.1770 pre-filter). Mean gap Juno bass − Minimoog
  // patch over the songs whose kind maps to that patch:
  //   round   +4.4 dB  (8 songs, sd 0.3)     squelch +7.8 dB  (2 songs, sd 1.1)
  //   pluck   +4.5 dB  (12 songs, sd 0.3)    fat     +5.3 dB  (2 songs, sd 0.1)
  // Plain RMS agrees within 0.3 dB. (The 9/23 "+0.4 dB" was a whole-song RMS
  // and mostly measured the other strips.) The Juno "sub" patch is NOT at the
  // bass reference: it reads +7 dB over "bass" on the same sub808 lines, which
  // is the Juno's own patch level and left alone here, so a sub808 song on the
  // Minimoog (round) sits ~7 dB K-weighted under the same song on the Juno sub.
  const MOOG_BASS_TRIM_DB = { round: 4.4, pluck: 4.5, squelch: 7.8, fat: 5.3 };
  U.MOOG_BASS_TRIM_DB = MOOG_BASS_TRIM_DB;

  // Linn-family kit level trims, dB per kit strip (drumMachine === "linn").
  // Measured K-weighted (harness/linn-kit-trim.mjs, data in
  // analysis/fits/linn-kit-trim-2026-09-30.json): each song's real strip line
  // rendered solo through the generic studio kit and through the Linn, the
  // trim is the mean difference. 12 songs per strip over the Linn lanes; sd
  // 0.8-1.2 dB on every strip but percTime (3.6), whose reference is the
  // generic closed hat standing in for the Linn's cabasa and tambourine — two
  // different instruments, one trim, so it is the mean of the pair.
  // Re-measured 2026-09-30 after the Linn's DAC/VCF revision and its
  // percussion group moving 3.5 dB down against the main voices (9/29 trims:
  // kick 4.2, snare 5.3, hats -4.2, tomsFills 0.8, ePerc 2.7, percTime -6.4,
  // percAccent 2.0). The trims hold each strip where the generic kit had it,
  // so the percussion strips come back up here by the same measurement.
  // Re-measured again for revision 3 (2026-09-30, the lossless refit, the
  // percussion group at -2.2 dB, the crash and ride on the hats strip; data
  // in analysis/fits/linn-kit-trim-r3-2026-09-30.json; revision-2 trims kick
  // 4.2, snare 4.9, hats -3.9, tomsFills 1.9, ePerc 6.2, percTime -2.3,
  // percAccent 5.0). Hats sd 1.1 dB with the ride songs' reference hat at
  // the hat's own hit gain; percTime sd 2.4 (tambourine vs cabasa, as above).
  // Re-measured for revision 4 (2026-10-01: kick second mode and output
  // coupling, snare body, the hat and cymbal chips' own clocks and output
  // filters, the conga strike; analysis/fits/linn-kit-trim-r4-2026-10-01.json;
  // revision-3 trims kick 4.2, snare 4.9, hats -5.3, tomsFills 4.3, ePerc 4.3,
  // percTime -5.8, percAccent 5.0). Kick sd 0.8, snare 0.9, hats 0.8.
  // Re-measured for revision 5 (2026-10-04, Jeff's four words: hats and
  // cymbals less metallic, kick umph, clap brighter, snare snappier;
  // analysis/fits/linn-kit-trim-r5-2026-10-04.json; revision-4 trims kick
  // 7.4, snare 3.8, hats -6.7). Kick 3.7 (sd 0.8): the held body and its
  // 97 Hz mode carry far more K-weighted loudness per hit, so the strip comes
  // down to hold the song's balance (the umph is in the shape). Snare 5.4
  // (sd 1.8, +1.3..+8.2: the shorter body reads quieter on the slow songs).
  // Hats -6.4 (sd 0.8). tomsFills, ePerc, percTime and percAccent play only
  // voices that render bit-identical to revision 4 and keep their revision-4
  // trims (this run read 4.3, 4.3, -5.6 and 6.1 on 12, 12, 10 and 11 songs).
  // The cymbals' hit gains on the hats strip (2026-09-30): the ride brought to
  // the closed hat's K-weighted loudness as an eighth-note line, the crash to
  // the open hat's as a single hit (harness/linn-cymbal-gain.mjs).
  // Re-measured for revision 5 (2026-10-04, the hats and cymbals made less
  // metallic: less plate ring, the ride's bell down; revision-4 gains ride
  // 0.242, crash 0.461).
  const LINN_RIDE_GAIN = 0.277, LINN_CRASH_GAIN = 0.552;
  U.LINN_CYMBAL_GAIN = { ride: LINN_RIDE_GAIN, crash: LINN_CRASH_GAIN };  // read by harness/linn-kit-trim.mjs
  const LINN_TRIM_DB = { kick: 3.7, snare: 5.4, hats: -6.4, tomsFills: 4.3, ePerc: 4.3, percTime: -5.8, percAccent: 5.9 };

  // The 808's auxiliary percussion "in the background" (2026-10-04, Asana
  // 1219144675109548; Jeff: "Everything else should be rare and in the
  // background in terms of levels"). dB on the strip's trim gain on an 808
  // song (drumMachine 808, kit machine) when the strip plays kit voices: the
  // toms on tomsFills, cowbell / rim / congaRun on ePerc, the kit congas on
  // percAccent (NOT the human hand drums, whose CONGAS_TRIM_DB owns that trim
  // when sheet.percCongas is set). Rare is the perc808 gate (drawSession).
  // MEASURED, harness/perc808-level.mjs (data analysis/fits/perc808-level-
  // before-2026-10-04.json): 12 808 songs per strip, each strip's real line
  // and the core four's (kick, snare + clap, hats) solo through the song's
  // own 808 panel, each at its strip's trim x fader, K-weighted, over the
  // blocks where the aux strip plays. Before: tomsFills -10.0 dB under the
  // core four (sd 4.4), ePerc -23.1 (sd 8.8: congaRun -6..-19, cowbell
  // -21..-27, rim -30..-33), percAccent -18.4 (sd 6.1). Target: each strip

  U.realizeSession = function (ctx, desk, sheet, R, t0, opts) {
    opts = opts || {};
    const s16 = (60 / sheet.bpm) / 4;
    const swing = sheet.swing;
    const scale = SCALES[sheet.mode];
    const P = sheet.picks;
    let events = 0;

    // ---- the mixing board, set before a note is scheduled ----
    // Order matters: the lane's mix lean multiplies the house faders, the
    // production style sets the room, then the mutes decide what is up. Nothing
    // here adds or removes a node, so the fan-in ≤2 contract is untouched.
    desk.applyLaneMix(sheet.lane);
    U.applyProduction(desk, sheet.production);
    for (const id in sheet.mutes) desk.setMute(id, sheet.mutes[id]);

    // optimization, not a second decision. Read the desk, not the sheet.

    // Per-lane arrangement lean: when each strip enters the arrangement.
    // earlyHipHop pulls the drums in early and holds the pitched strips back.

    const entryBias = (U.LANE_ARRANGE[sheet.lane] || {}).entry;

    const infl = (patch) => sheet.influencePatches.indexOf(patch) > -1;

    const stepT = (bar, i) => t0 + (bar * 16 + i) * s16 + (i % 2 ? swing * s16 : 0);

    const chorusChords = sheet.harmony.chorus || null;
    function chordAt(bar) {
      const b = sheet.bars[bar];
      const list = (b.section === "chorus" && chorusChords) ? chorusChords : sheet.harmony.chords;
      const idx = Math.floor(bar / sheet.harmony.barsPer) % list.length;
      return { deg: list[idx][0], type: list[idx][1] };
    }
    const bassMidi = (deg) => fold(36 + sheet.tonicPc + deg, 33, 44);
    const midMidi = (deg) => fold(60 + sheet.tonicPc + deg, 55, 66);
    function tones(rootMidi, type, n) {
      const iv = U.CHORD_INTERVALS[type] || U.CHORD_INTERVALS.m;
      const out = [];
      for (let i = 0; i < (n || iv.length); i++) out.push(rootMidi + iv[i % iv.length] + 12 * Math.floor(i / iv.length));
      return out;
    }

    const degMidi = (base, d) => base + scale[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);

    const kitStrips = {};
    for (const id of ["kick", "snare", "hats", "tomsFills", "ePerc", "percTime", "percAccent"]) kitStrips[id] = desk.strips[id];
