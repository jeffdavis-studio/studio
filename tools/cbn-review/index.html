<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color by number vol 1 — role colors</title>
<style>
  :root { --bg:#fff; --ink:#111; --line:#d8d8d8; --dim:#666; --sel:#0b62d6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:grid; grid-template-columns:206px minmax(0,1fr) 286px; height:100vh; }
  .col { min-height:0; display:flex; flex-direction:column; }
  .col.l { border-right:1px solid var(--line); }
  .col.r { border-left:1px solid var(--line); }
  .pad { padding:8px 10px; }
  h1 { font-size:13px; margin:0 0 6px; font-weight:600; }
  h2 { font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); margin:10px 0 4px; font-weight:600; }
  .scroll { overflow-y:auto; min-height:0; }
  .pg { padding:3px 10px; cursor:pointer; border-radius:4px; display:flex; justify-content:space-between; gap:6px; }
  .pg:hover { background:#f2f2f2; }
  .pg.on { background:var(--sel); color:#fff; }
  .pg small { color:var(--dim); font-variant-numeric:tabular-nums; }
  .pg.on small { color:#cfe0f8; }
  label.k { display:block; font-size:11px; color:var(--dim); margin:6px 0 2px; }
  select, button { font:inherit; width:100%; padding:3px 5px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  button { cursor:pointer; }
  button:hover { background:#f2f2f2; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #stage { flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px; }
  svg#page { height:100%; max-height:100%; width:auto; max-width:100%; aspect-ratio:612/792; display:block; background:#fff; }
  svg#page polygon { stroke:#111; stroke-width:.45; vector-effect:non-scaling-stroke; }
  svg#page polygon.hi { stroke:var(--sel); stroke-width:1.6; }
  svg#page polygon.bad { stroke:#e00; stroke-width:2; }
  #ind { border-top:1px solid var(--line); display:flex; gap:14px; align-items:center; padding:5px 10px; font-variant-numeric:tabular-nums; }
  #ind b { font-weight:600; }
  .ok { color:#0a7d24; } .no { color:#c00; }
  .cls { display:flex; align-items:center; gap:6px; padding:2px 10px; cursor:pointer; }
  .cls:hover { background:#f2f2f2; }
  .cls.on { background:#eaf1fd; box-shadow:inset 3px 0 0 var(--sel); }
  .sw { width:16px; height:16px; border:1px solid #999; border-radius:3px; flex:0 0 auto; }
  .cls .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cls .ct { color:var(--dim); font-size:11px; }
  #chart { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; padding:6px 10px 10px; }
  #chart div { aspect-ratio:1; border:1px solid #999; border-radius:3px; cursor:pointer; display:flex; align-items:flex-end; justify-content:center; font-size:9px; padding-bottom:1px; }
  #chart div:hover { outline:2px solid var(--sel); }
  .note { font-size:11px; color:var(--dim); padding:0 10px 8px; }
  @media (max-width:900px) { #app { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr) auto; } .col.l,.col.r { border:0; border-top:1px solid var(--line); } body { overflow:auto; } }
</style>
</head>
<body>
<div id="app">
  <div class="col l">
    <div class="pad"><h1>Color by number vol 1</h1><div style="font-size:11px;color:var(--dim)">Click a shape or a role, then a chart color. Save writes the file the book build reads.</div></div>
    <div class="scroll" id="pages"></div>
    <div class="pad" style="border-top:1px solid var(--line)">
      <h2>Knobs</h2>
      <label class="k">Family</label><select id="kFam"></select>
      <label class="k">Walk</label><select id="kWalk"><option value="bounce">bounce</option><option value="cycle">cycle</option></select>
      <label class="k">Hub split (fold pages)</label><select id="kHub"><option value="0">off</option><option value="1">on</option></select>
      <label class="k">Alternation class</label><select id="kAlt"></select>
      <div class="row2" style="margin-top:10px"><button id="bReset">Reset page</button><button id="bSave"><b>SAVE</b></button></div>
    </div>
  </div>
  <div class="col">
    <div id="stage"><svg id="page" viewBox="0 0 612 792" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="ind"></div>
  </div>
  <div class="col r">
    <div class="pad"><h2>Roles on this page</h2></div>
    <div class="scroll" id="classes"></div>
    <div class="pad" style="border-top:1px solid var(--line)"><h2>The 24-color chart</h2></div>
    <div id="chart"></div>
    <div class="note" id="edits"></div>
  </div>
</div>
<script>
const LS = 'cbn-assignment-2026-09-18';
let DATA = null, cur = 0, sel = null;
let state = {};   // pageId -> { manual:{cls:n}, fam, walk, hub, alt }
const $ = (s) => document.querySelector(s);
const chartHex = (n) => (DATA.chart[n - 1] || {}).hex || '#ccc';
const chartName = (n) => (DATA.chart[n - 1] || {}).name || '?';

const walkIndex = (r, k, mode) => {
  if (k <= 1) return 0;
  if (mode === 'cycle') return ((r % k) + k) % k;
  const p = 2 * k - 2, q = ((r % p) + p) % p;
  return q < k ? q : p - q;
};

/** The class each region sits in, after the knobs. */
function classing(pg, st) {
  const of = new Map();
  for (const r of pg.regions) {
    let k = r.c;
    if (st.hub && pg.hub !== null && r.i === pg.hub) k = 'hub';
    else if (st.alt && st.alt === r.c) k = r.c + '~' + r.y;
    of.set(r.i, k);
  }
  return of;
}

/** Default assignment for the current knobs: walk-preferring greedy on the
 *  family's growth ladder, with no two edge-adjacent classes sharing a color. */
function solve(pg, st) {
  const of = classing(pg, st);
  const keys = [...new Set(of.values())];
  const adj = new Map(keys.map((k) => [k, new Set()]));
  for (const [a, b] of pg.pairs) {
    const x = of.get(a), y = of.get(b);
    if (x === undefined || y === undefined || x === y) continue;
    adj.get(x).add(y); adj.get(y).add(x);
  }
  // ring rank: inherited from the build, sub-classes keep their parent's and
  // tie-break on the parity suffix so the alternation reads in walk order
  const baseRing = new Map(pg.classes.map((c) => [c.k, c.r]));
  // Rank, not distance: a sub-class sits just after its parent, and with no
  // split the ranks are exactly the ones the build used, so the tool opens on
  // the same default it shipped.
  const rank = (k) => {
    const root = k.split('~')[0];
    const b = baseRing.has(root) ? baseRing.get(root) : (baseRing.get(k) ?? 0);
    return b + (k.includes('~1') ? 0.5 : 0);
  };
  const order = [...keys].sort((a, b) => rank(a) - rank(b));
  const ring = new Map(order.map((k, i) => [k, i]));
  const ladder = (pg.ladders[st.fam] || pg.ladders[pg.family]).ladder;
  for (let size = Math.max(5, pg.kRequested); size <= ladder.length; size++) {
    const pal = ladder.slice(0, size);
    const col = new Map();
    let ok = true;
    for (const k of order) {
      const taken = new Set();
      for (const d of adj.get(k)) if (col.has(d)) taken.add(col.get(d));
      const pref = pal[walkIndex(ring.get(k), pal.length, st.walk)];
      if (pref !== undefined && !taken.has(pref)) { col.set(k, pref); continue; }
      const pick = pal.find((n) => !taken.has(n));
      if (pick === undefined) { ok = false; break; }
      col.set(k, pick);
    }
    if (ok) return { of, col, adj, keys: order };
  }
  return { of, col: new Map(order.map((k) => [k, ladder[0]])), adj, keys: order };
}

function stFor(pg) {
  if (!state[pg.id]) state[pg.id] = { manual: {}, fam: pg.family, walk: pg.mode, hub: 0, alt: '' };
  return state[pg.id];
}

function render() {
  const pg = DATA.pages[cur], st = stFor(pg);
  $('#kFam').value = st.fam; $('#kWalk').value = st.walk; $('#kHub').value = String(st.hub);
  const S = solve(pg, st);
  // Jeff's picks win over the default
  const col = new Map(S.col);
  for (const [k, n] of Object.entries(st.manual)) if (col.has(k)) col.set(k, n);

  // the page
  const bad = new Set();
  let pairsBad = 0;
  for (const [a, b] of pg.pairs) {
    const x = S.of.get(a), y = S.of.get(b);
    if (x === undefined || y === undefined || x === y) continue;
    if (col.get(x) === col.get(y)) { pairsBad++; bad.add(a); bad.add(b); }
  }
  const svg = [];
  for (const r of pg.regions) {
    const k = S.of.get(r.i), n = col.get(k);
    const pts = [];
    for (let i = 0; i < r.p.length; i += 2) pts.push(r.p[i] + ',' + r.p[i + 1]);
    const cls = (bad.has(r.i) ? 'bad' : (sel && k === sel ? 'hi' : ''));
    svg.push('<polygon class="' + cls + '" data-region="' + r.i + '" data-role="' + k + '" fill="' + chartHex(n) + '" points="' + pts.join(' ') + '"/>');
  }
  $('#page').innerHTML = svg.join('');

  // indicators
  const used = new Set(col.values());
  $('#ind').innerHTML =
    '<span><b>' + pg.id + '</b> · ' + pg.label + '</span>' +
    '<span>colors <b>' + used.size + '</b></span>' +
    '<span class="' + (pairsBad ? 'no' : 'ok') + '">edge-adjacent same color <b>' + pairsBad + '</b></span>' +
    '<span class="' + (used.size >= 5 ? 'ok' : 'no') + '">five-color floor ' + (used.size >= 5 ? 'met' : 'not met') + '</span>';

  // the role list
  const count = new Map();
  for (const r of pg.regions) count.set(S.of.get(r.i), (count.get(S.of.get(r.i)) || 0) + 1);
  const ribs = new Set(pg.classes.filter((c) => c.rib).map((c) => c.k));
  $('#classes').innerHTML = S.keys.map((k) => {
    const n = col.get(k);
    return '<div class="cls' + (sel === k ? ' on' : '') + '" data-role="' + k + '">' +
      '<span class="sw" style="background:' + chartHex(n) + '"></span>' +
      '<span class="nm">' + n + ' ' + chartName(n) + (ribs.has(k) ? ' · ribbon' : '') + (st.manual[k] ? ' ·<b>set</b>' : '') + '</span>' +
      '<span class="ct">' + (count.get(k) || 0) + '</span></div>';
  }).join('');

  // the alternation knob offers the classes that actually have both parities
  const both = S.keys.filter((k) => {
    if (k.includes('~') || k === 'hub') return false;
    const m = pg.regions.filter((r) => r.c === k);
    return m.some((r) => r.y === 0) && m.some((r) => r.y === 1) && m.length >= 4;
  });
  $('#kAlt').innerHTML = '<option value="">none</option>' + both.map((k) => '<option value="' + k + '">' + k + ' (' + (count.get(k) || pg.regions.filter((r) => r.c === k).length) + ' shapes)</option>').join('');
  $('#kAlt').value = st.alt;
  $('#kHub').disabled = pg.hub === null;
  const nEdit = Object.keys(st.manual).length;
  $('#edits').textContent = nEdit ? nEdit + ' role' + (nEdit > 1 ? 's' : '') + ' set by hand on this page. Knob changes keep them; Reset page clears them.' : 'No hand-set roles on this page yet. Nothing is recorded until you press SAVE.';
  document.querySelectorAll('.pg').forEach((e, i) => e.classList.toggle('on', i === cur));
  save(true);
}

function pick(n) {
  if (!sel) return;
  stFor(DATA.pages[cur]).manual[sel] = n;
  render();
}
function save(quiet) {
  localStorage.setItem(LS, JSON.stringify(state));
  if (quiet) return;
  const out = { built: '2026-09-18', tool: 'cbn-review', pages: {} };
  for (const pg of DATA.pages) {
    const st = stFor(pg), S = solve(pg, st);
    const col = new Map(S.col);
    for (const [k, n] of Object.entries(st.manual)) if (col.has(k)) col.set(k, n);
    out.pages[pg.id] = {
      knobs: { family: st.fam, walk: st.walk, hubSplit: !!st.hub, alternationClass: st.alt || null },
      assign: Object.fromEntries([...col]),
      handSet: Object.keys(st.manual),
      regionClass: Object.fromEntries([...S.of]),
    };
  }
  const b = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'cbn-assignment.json'; a.click();
}

fetch('data.json').then((r) => r.json()).then((d) => {
  DATA = d;
  try { const s = localStorage.getItem(LS); if (s) state = JSON.parse(s); } catch (e) {}
  $('#pages').innerHTML = d.pages.map((p, i) => '<div class="pg" data-i="' + i + '"><span>' + p.id + '</span><small>' + p.stats.roles + ' roles</small></div>').join('');
  $('#kFam').innerHTML = Object.keys(d.pages[0].ladders).map((f) => '<option value="' + f + '">' + f + '</option>').join('');
  $('#chart').innerHTML = d.chart.map((c) => {
    const lum = 0.299 * parseInt(c.hex.slice(1, 3), 16) + 0.587 * parseInt(c.hex.slice(3, 5), 16) + 0.114 * parseInt(c.hex.slice(5, 7), 16);
    return '<div data-n="' + c.n + '" title="' + c.n + ' ' + c.name + '" style="background:' + c.hex + ';color:' + (lum > 140 ? '#000' : '#fff') + '">' + c.n + '</div>';
  }).join('');
  $('#pages').onclick = (e) => { const t = e.target.closest('.pg'); if (!t) return; cur = +t.dataset.i; sel = null; render(); };
  $('#classes').onclick = (e) => { const t = e.target.closest('.cls'); if (!t) return; sel = t.dataset.role; render(); };
  $('#page').onclick = (e) => { const t = e.target.closest('polygon'); if (!t) return; sel = t.dataset.role; render(); };
  $('#chart').onclick = (e) => { const t = e.target.closest('div[data-n]'); if (t) pick(+t.dataset.n); };
  $('#kFam').onchange = (e) => { stFor(DATA.pages[cur]).fam = e.target.value; render(); };
  $('#kWalk').onchange = (e) => { stFor(DATA.pages[cur]).walk = e.target.value; render(); };
  $('#kHub').onchange = (e) => { stFor(DATA.pages[cur]).hub = +e.target.value; render(); };
  $('#kAlt').onchange = (e) => { stFor(DATA.pages[cur]).alt = e.target.value; render(); };
  $('#bReset').onclick = () => { const pg = DATA.pages[cur]; state[pg.id] = { manual: {}, fam: pg.family, walk: pg.mode, hub: 0, alt: '' }; sel = null; render(); };
  $('#bSave').onclick = () => save(false);
  render();
});
</script>
</body>
</html>
