<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16161a">
<title>Unison — the rig</title>
<!-- A hub, not a fork: each instrument is its own page, loaded whole in the
     frame below. Only one frame exists at a time, so switching unloads the
     last instrument and two never sound together. r2 (2026-10-04): every page
     rebuilt for a phone, plus a songs page that renders whole songs live. -->
<style>
  :root{--bg:#16161a;--panel:#1f1f25;--edge:#34343d;--ink:#e8e8ec;--dim:#8d8d99;--accent:#c9a15a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:14px/1.3 ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  nav{flex:0 0 auto;position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
    padding:6px;background:var(--panel);border-bottom:1px solid var(--edge)}
  @media (min-width:760px){nav{grid-template-columns:repeat(11,1fr)}}
  nav button{font:inherit;font-size:14px;line-height:1.15;min-height:44px;min-width:44px;padding:4px 2px;color:var(--ink);
    background:#2a2a32;border:1px solid var(--edge);border-radius:7px;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
  nav button.on{background:var(--accent);border-color:var(--accent);color:#1a1a1a;font-weight:600}
  #stage{flex:1 1 auto;min-height:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  footer{flex:0 0 auto;padding:3px 8px calc(3px + env(safe-area-inset-bottom));font-size:11px;color:var(--dim);
    text-align:center;background:var(--panel);border-top:1px solid var(--edge)}
</style>
</head>
<body>
<nav id="bar">
  <button data-i="808" data-src="unison-808-2026-10-04-r3.html" aria-label="drum machine 808">808</button>
  <button data-i="linn" data-src="unison-linn-2026-10-04-r3.html" aria-label="LinnDrum">Linn</button>
  <button data-i="juno" data-src="unison-juno-2026-10-04-r2.html" aria-label="Juno">Juno</button>
  <button data-i="obxa" data-src="unison-obxa-2026-10-04-r2.html" aria-label="OB-Xa">OB-Xa</button>
  <button data-i="minimoog" data-src="unison-minimoog-2026-10-05.html" aria-label="Minimoog">Moog</button>
  <button data-i="fm" data-src="unison-fm-2026-10-04-r2.html" aria-label="FM keys">FM</button>
  <button data-i="bassguitar" data-src="unison-bass-guitar-2026-10-04-r2.html" aria-label="bass guitar">bass</button>
  <button data-i="shakers" data-src="unison-shakers-2026-10-04-r3.html" aria-label="shakers">shakers</button>
  <button data-i="congas" data-src="unison-congas-2026-10-04-r3.html" aria-label="congas and bongos">congas</button>
  <button data-i="rhythm-guitar" data-src="unison-rhythm-guitar-2026-10-04-r2.html" aria-label="rhythm guitar">guitar</button>
  <button data-i="songs" data-src="unison-songs-2026-10-05.html" aria-label="songs">songs</button>
</nav>
<div id="stage"></div>
<footer>every sound is synthesized live from the engine at a919509</footer>
<script>
  // iOS mutes Web Audio under the ring/silent switch unless the page asks for
  // playback; ask, where the browser lets us.
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}

  var KEY = "unison-rig-r2-last";
  var bar = document.getElementById("bar"), stage = document.getElementById("stage");
  var buttons = [].slice.call(bar.querySelectorAll("button"));

  function open(id) {
    var b = buttons.filter(function (x) { return x.dataset.i === id; })[0] || buttons[0];
    // Unload the last instrument before it leaves the DOM, so its audio stops
    // now rather than whenever the browser collects it.
    var old = stage.querySelector("iframe");
    if (old) { try { old.src = "about:blank"; } catch (e) {} old.remove(); }
    var f = document.createElement("iframe");
    f.src = b.dataset.src;
    f.title = b.getAttribute("aria-label");
    f.setAttribute("allow", "autoplay");
    stage.appendChild(f);
    buttons.forEach(function (x) { x.className = x === b ? "on" : ""; });
    try { localStorage.setItem(KEY, b.dataset.i); } catch (e) {}
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { if (b.className !== "on") open(b.dataset.i); });
  });
  var last = null;
  try { last = localStorage.getItem(KEY); } catch (e) {}
  open(last || "808");
</script>
</body>
</html>
