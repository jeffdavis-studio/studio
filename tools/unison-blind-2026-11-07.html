<style>
  :root{--bg:#16161a;--panel:#1f1f25;--edge:#34343d;--ink:#e8e8ec;--dim:#8d8d99;--accent:#c9a15a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.35 ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:12px 12px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;overflow-x:hidden}
  h1{font-size:20px;margin:4px 0 2px}
  .note{color:var(--dim);font-size:14px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px;margin:0 0 10px}
  .top{display:flex;align-items:center;gap:10px}
  .num{flex:0 0 28px;font-size:18px;font-weight:600;text-align:center}
  .play{flex:0 0 52px;height:52px;border-radius:50%;border:1px solid var(--edge);background:#2a2a32;color:var(--ink);
    font-size:20px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .card.on .play{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .time{flex:1 1 auto;min-width:0;color:var(--dim);font-size:16px;font-variant-numeric:tabular-nums}
  .card.on .time{color:var(--accent)}
  .call{flex:0 0 auto;min-height:44px;min-width:96px;font:inherit;font-size:15px;color:var(--ink);background:#2a2a32;
    border:1px solid var(--edge);border-radius:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .card.called .call{background:#3a2f1c;border-color:var(--accent);color:var(--accent)}
  .stamp{color:var(--accent);font-size:14px;min-height:0;margin:0}
  .stamp:not(:empty){margin-top:6px}
  .verdict{margin-top:8px;font-size:15px}
  .verdict b{display:block}
  .verdict.ours b{color:var(--accent)}
  .verdict span{color:var(--dim);font-size:14px}
  #reveal{margin:16px 0 8px}
  #reveal button{width:100%;min-height:52px;font:inherit;font-size:16px;color:var(--ink);background:#2a2a32;
    border:1px solid var(--edge);border-radius:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #reveal button.sure{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
</style></head>

const cards = [...document.querySelectorAll(".card")];
let cur = null, tick = null;
const fmt = (s) => Math.floor(s) + " s";
function stop(c) { const a = c.querySelector("audio"); a.pause(); c.classList.remove("on"); c.querySelector(".play").innerHTML = "&#9654;"; }
cards.forEach((c) => {
  const a = c.querySelector("audio"), t = c.querySelector(".time");
  c.querySelector(".play").addEventListener("click", () => {
    if (cur === c && !a.paused) { stop(c); return; }
    cards.forEach((o) => { if (o !== c) stop(o); });
    cur = c; c.classList.add("on"); c.querySelector(".play").innerHTML = "&#10073;&#10073;";
    a.play().catch(() => stop(c));
    // warm the next card while this one plays, so every clip starts as fast as the last one
    const nx = cards[cards.indexOf(c) + 1];
    if (nx) { const na = nx.querySelector("audio"); if (na.preload !== "auto") { na.preload = "auto"; na.load(); } }
  });
  a.addEventListener("timeupdate", () => { t.textContent = fmt(a.currentTime); });
  a.addEventListener("ended", () => { stop(c); });
  c.querySelector(".call").addEventListener("click", () => {
    const s = c.querySelector(".stamp");
    if (c.classList.contains("called")) { c.classList.remove("called"); s.textContent = ""; return; }
    c.classList.add("called"); s.textContent = "Called at " + a.currentTime.toFixed(1) + " s";
  });
});
const rv = document.getElementById("rv");
rv.addEventListener("click", () => {
  if (!rv.classList.contains("sure")) { rv.classList.add("sure"); rv.textContent = "Yes, reveal"; return; }
  cards.forEach((c, i) => {
    const [ours, label] = R[i], v = c.querySelector(".verdict");
    v.className = "verdict" + (ours ? " ours" : ""); v.hidden = false;
    v.innerHTML = "<b>" + (ours ? "Ours" : "Real") + "</b><span></span>";
    v.querySelector("span").textContent = label;
  });
  rv.parentNode.hidden = true;
});
</script>
