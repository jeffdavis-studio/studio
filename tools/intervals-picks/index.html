<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervals hash picker</title>
<link rel="icon" href="data:,">
<!--
    Intervals hash picker. Each tile is frame.html, which runs the program
    unmodified at one hash. The URL is the whole state:

    ?v=9|10          program version (9 = main on Pages, 10 = intervals-v10 via jsDelivr)
    ?seed=<word>     seeds the hashes; a fresh one is written in on first load
    ?page=<k>        page of the seed, from 0
    ?n=<count>       tiles per page, default 24, cap 60
    ?hashes=0x..,..  exactly these hashes, no paging
    #f=0x..,..&h=..  the marks (fave, hmmm), rewritten whenever they change
-->
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f4f4f2; color: #222;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    header { padding: 12px 16px 4px; font-size: 15px; }
    header b { font-weight: 600; }
    #bar { position: sticky; top: 0; z-index: 10; background: #f4f4f2; border-bottom: 1px solid #ddd;
        padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    #bar .grp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    #bar .note { color: #777; font-size: 12px; }
    button, select { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid #bbb;
        background: #fff; border-radius: 4px; cursor: pointer; color: #222; }
    button:hover { border-color: #888; }
    #counts b { font-weight: 600; }
    #pageinfo { color: #555; font-size: 13px; }
    #export { display: none; padding: 10px 16px 14px; border-bottom: 1px solid #ddd; background: #fbfbfa; }
    #export.open { display: block; }
    #export .row { margin: 8px 0; }
    #export .lbl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; margin-bottom: 4px; }
    #export textarea { display: block; width: 100%; height: 72px; font: 12px/1.35 Menlo, Monaco, monospace;
        border: 1px solid #ccc; border-radius: 4px; padding: 6px; resize: vertical; background: #fff; }
    #grid { padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; }
    .tile { flex: 0 0 auto; position: relative; }
    .art { position: relative; background: #fff; }
    .art iframe { display: block; border: 0; pointer-events: none; background: #fff; }
    .tile.fave .art { box-shadow: 0 0 0 4px #2e9e4f; }
    .tile.hmmm .art { box-shadow: 0 0 0 4px #9a9a9a; }
    .marks { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
    .marks button { padding: 2px 8px; font-size: 12px; background: rgba(255,255,255,0.88); border-color: #ccc; }
    .tile.fave .marks .bf { background: #2e9e4f; border-color: #2e9e4f; color: #fff; }
    .tile.hmmm .marks .bh { background: #8a8a8a; border-color: #8a8a8a; color: #fff; }
    .cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; font-size: 12px; }
    .cap .hash { font-family: Menlo, Monaco, monospace; font-size: 12px; padding: 1px 6px; border: 0;
        background: transparent; color: #333; }
    .cap .hash:hover { background: #e6e6e3; }
    .cap a { color: #666; font-size: 12px; }
    .empty { padding: 24px 16px; color: #777; }
</style>
</head>
<body>
<header><b>Intervals hash picker</b> &middot; <span id="what"></span></header>
<div id="bar">
    <div class="grp">
        <select id="ver" aria-label="Version">
            <option value="9">v9 (main)</option>
            <option value="10">v10 (branch)</option>
        </select>
        <span class="note" id="vnote"></span>
    </div>
    <div class="grp" id="paging">
        <button id="prev">&larr; Prev</button>
        <span id="pageinfo"></span>
        <button id="next">Next &rarr;</button>
        <button id="rand">Random page</button>
    </div>
    <div class="grp" id="counts"></div>
    <div class="grp">
        <button id="share">Share</button>
        <button id="exp">Export</button>
    </div>
</div>
<div id="export">
    <div class="row">
        <div class="lbl">Fave hashes, one per line <button data-copy="xl">Copy</button></div>
        <textarea id="xl" readonly></textarea>
    </div>
    <div class="row">
        <div class="lbl">firsts line for Intervals_v10.js (index = position) <button data-copy="xf">Copy</button></div>
        <textarea id="xf" readonly></textarea>
    </div>
    <div class="row">
        <div class="lbl">Faves only page <button data-copy="xu">Copy</button> <a id="xo" href="#" target="_blank" rel="noopener">open</a></div>
        <textarea id="xu" readonly></textarea>
    </div>
</div>
<div id="grid"></div>
<script>
(function () {
    const ASPECT = [14, 11];
    const HEX = /^0x[0-9a-f]{64}$/;
    const q = new URLSearchParams(location.search);

    // URL state. Anything missing is filled in and written back, so the
    // address bar always reproduces the page.
    let v = q.get('v') === '10' ? '10' : '9';
    let seed = q.get('seed') || randomWord();
    let page = Math.max(0, parseInt(q.get('page'), 10) || 0);
    let n = Math.min(60, Math.max(1, parseInt(q.get('n'), 10) || 24));
    let pinned = null;
    if (q.get('hashes')) {
        pinned = q.get('hashes').toLowerCase().split(',').map(s => s.trim()).filter(s => HEX.test(s));
    }

    // Marks: faves and hmmms, in the order they were made. The fragment wins
    // over localStorage, so a shared URL carries its own marks.
    let faves = [];
    let hmmm = [];
    let frag = new URLSearchParams(location.hash.slice(1));
    if (frag.has('f') || frag.has('h')) {
        faves = list(frag.get('f'));
        hmmm = list(frag.get('h')).filter(x => faves.indexOf(x) < 0);
    } else {
        try {
            let saved = JSON.parse(localStorage.getItem(key()) || '{}');
            faves = list((saved.f || []).join(','));
            hmmm = list((saved.h || []).join(',')).filter(x => faves.indexOf(x) < 0);
        } catch (e) {
            faves = [];
            hmmm = [];
        }
    }

    function key() { return 'intervals-picks-v' + v; }

    function list(s) {
        let out = [];
        (s || '').toLowerCase().split(',').forEach(x => {
            x = x.trim();
            if (HEX.test(x) && out.indexOf(x) < 0) out.push(x);
        });
        return out;
    }

    function randomWord() {
        let a = 'bcdfghjklmnprstvwz', e = 'aeiou', w = '';
        for (let i = 0; i < 3; i++) {
            w += a[Math.floor(Math.random() * a.length)] + e[Math.floor(Math.random() * e.length)];
        }
        return w + Math.floor(Math.random() * 100);
    }

    // Seeded hashes: token g of a seed is cyrb128(seed + '/' + g) driving
    // sfc32 for eight 32-bit words. Depends only on seed and g.
    function cyrb128(str) {
        let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
        for (let i = 0, k; i < str.length; i++) {
            k = str.charCodeAt(i);
            h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
            h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
            h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
            h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
        h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
        h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        h1 ^= (h2 ^ h3 ^ h4); h2 ^= h1; h3 ^= h1; h4 ^= h1;
        return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
    }

    function seededHash(g) {
        let [a, b, c, d] = cyrb128(seed + '/' + g);
        let out = '0x';
        for (let i = 0; i < 12; i++) {
            a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
            let t = (((a + b) | 0) + d) | 0;
            d = (d + 1) | 0;
            a = b ^ (b >>> 9);
            b = (c + (c << 3)) | 0;
            c = (c << 21) | (c >>> 11);
            c = (c + t) | 0;
            if (i >= 4) out += ('00000000' + (t >>> 0).toString(16)).slice(-8);
        }
        return out;
    }

    function hashes() {
        if (pinned) return pinned;
        let out = [];
        for (let i = 0; i < n; i++) out.push(seededHash(page * n + i));
        return out;
    }

    function stateUrl(over) {
        let p = new URLSearchParams();
        p.set('v', v);
        if (over && over.hashes) {
            p.set('hashes', over.hashes.join(','));
        } else if (pinned) {
            p.set('hashes', pinned.join(','));
        } else {
            p.set('seed', seed);
            p.set('page', page);
            if (n !== 24) p.set('n', n);
        }
        let f = new URLSearchParams();
        if (faves.length) f.set('f', faves.join(','));
        if (hmmm.length) f.set('h', hmmm.join(','));
        let fs = f.toString().replace(/%2C/g, ',');
        let base = location.origin + location.pathname;
        return base + '?' + p.toString().replace(/%2C/g, ',') + (fs ? '#' + fs : '');
    }

    function save() {
        try {
            localStorage.setItem(key(), JSON.stringify({ f: faves, h: hmmm }));
        } catch (e) {}
        history.replaceState(null, '', stateUrl());
        refresh();
    }

    function frameSrc(h) {
        return 'frame.html?v=' + v + '&hash=' + h + '&aspect=' + ASPECT[0] + ':' + ASPECT[1] + '&id=999999';
    }

    function openSrc(h) {
        return v === '9'
            ? '../../intervals/Intervals_v9.html?hash=' + h + '&aspect=' + ASPECT[0] + ':' + ASPECT[1]
            : frameSrc(h);
    }

    // Tile sizes are set in pixels from the grid's width: Safari gives an
    // iframe in a flex row no size of its own.
    function tileSize() {
        let grid = document.getElementById('grid');
        let inner = grid.clientWidth - 32;
        let cols = inner < 700 ? 2 : 4;
        let tw = Math.floor((inner - 16 * (cols - 1)) / cols);
        return [tw, Math.round(tw * ASPECT[1] / ASPECT[0])];
    }

    let builtWidth = 0;

    function build() {
        let grid = document.getElementById('grid');
        grid.innerHTML = '';
        let hs = hashes();
        if (!hs.length) {
            grid.innerHTML = '<div class="empty">No valid hashes in ?hashes=.</div>';
            return;
        }
        let [tw, th] = tileSize();
        builtWidth = grid.clientWidth;
        hs.forEach(h => {
            let tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.hash = h;
            tile.style.width = tw + 'px';

            let art = document.createElement('div');
            art.className = 'art';
            art.style.width = tw + 'px';
            art.style.height = th + 'px';
            let fr = document.createElement('iframe');
            fr.setAttribute('loading', 'lazy');
            fr.setAttribute('scrolling', 'no');
            fr.setAttribute('tabindex', '-1');
            fr.title = h;
            fr.width = tw;
            fr.height = th;
            fr.style.width = tw + 'px';
            fr.style.height = th + 'px';
            fr.src = frameSrc(h);
            art.appendChild(fr);

            let marks = document.createElement('div');
            marks.className = 'marks';
            let bf = document.createElement('button');
            bf.className = 'bf';
            bf.textContent = 'fave';
            bf.onclick = () => mark(h, 'f');
            let bh = document.createElement('button');
            bh.className = 'bh';
            bh.textContent = 'hmmm';
            bh.onclick = () => mark(h, 'h');
            marks.appendChild(bf);
            marks.appendChild(bh);
            art.appendChild(marks);
            tile.appendChild(art);

            let cap = document.createElement('div');
            cap.className = 'cap';
            let lbl = document.createElement('button');
            lbl.className = 'hash';
            lbl.title = 'Copy ' + h;
            lbl.textContent = h.slice(0, 12);
            lbl.onclick = () => copy(h, lbl, h.slice(0, 12));
            let a = document.createElement('a');
            a.href = openSrc(h);
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = 'open';
            cap.appendChild(lbl);
            cap.appendChild(a);
            tile.appendChild(cap);
            grid.appendChild(tile);
        });
        refresh();
    }

    // A tap marks; a second tap on the same mark clears it.
    function mark(h, which) {
        let on = which === 'f' ? faves : hmmm;
        let off = which === 'f' ? hmmm : faves;
        let i = on.indexOf(h);
        if (i >= 0) {
            on.splice(i, 1);
        } else {
            on.push(h);
            let j = off.indexOf(h);
            if (j >= 0) off.splice(j, 1);
        }
        save();
    }

    function refresh() {
        document.querySelectorAll('.tile').forEach(t => {
            t.classList.toggle('fave', faves.indexOf(t.dataset.hash) >= 0);
            t.classList.toggle('hmmm', hmmm.indexOf(t.dataset.hash) >= 0);
        });
        document.getElementById('counts').innerHTML =
            '<span><b>' + faves.length + '</b> fave</span><span><b>' + hmmm.length + '</b> hmmm</span>';
        document.getElementById('xl').value = faves.join('\n');
        document.getElementById('xf').value = 'let firsts = [' + faves.map(h => "'" + h + "'").join(', ') + '];';
        let fu = faves.length ? stateUrl({ hashes: faves }) : '';
        document.getElementById('xu').value = fu;
        document.getElementById('xo').href = fu || '#';
        document.getElementById('xo').style.visibility = fu ? 'visible' : 'hidden';
    }

    function copy(text, el, back) {
        let done = () => {
            el.textContent = 'copied';
            setTimeout(() => { el.textContent = back; }, 1200);
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
        } else {
            fallback(text, done);
        }
    }

    function fallback(text, done) {
        let ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        done();
    }

    function go(p) {
        page = Math.max(0, p);
        history.replaceState(null, '', stateUrl());
        window.scrollTo(0, 0);
        build();
        chrome();
    }

    function chrome() {
        document.getElementById('ver').value = v;
        document.getElementById('vnote').textContent = v === '10'
            ? 'v10 is the unmerged intervals-v10 branch, via jsDelivr (up to 12 h behind)'
            : 'v9 is the program on main';
        document.getElementById('what').textContent = pinned
            ? 'v' + v + ', ' + pinned.length + ' chosen hashes'
            : 'v' + v + ', seed ' + seed + ', ' + n + ' tokens a page, 14:11 like the plotted sheet';
        document.getElementById('paging').style.display = pinned ? 'none' : 'flex';
        document.getElementById('pageinfo').textContent = 'page ' + (page + 1);
        document.getElementById('prev').disabled = page === 0;
        document.title = 'Intervals hash picker, v' + v;
    }

    document.getElementById('prev').onclick = () => go(page - 1);
    document.getElementById('next').onclick = () => go(page + 1);
    document.getElementById('rand').onclick = () => go(Math.floor(Math.random() * 100000));
    document.getElementById('ver').onchange = e => {
        v = e.target.value;
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem(key()) || '{}'); } catch (err) {}
        faves = list((saved.f || []).join(','));
        hmmm = list((saved.h || []).join(',')).filter(x => faves.indexOf(x) < 0);
        save();
        build();
        chrome();
    };
    let sb = document.getElementById('share');
    sb.onclick = () => copy(stateUrl(), sb, 'Share');
    document.getElementById('exp').onclick = () => document.getElementById('export').classList.toggle('open');
    document.querySelectorAll('[data-copy]').forEach(b => {
        b.onclick = () => copy(document.getElementById(b.dataset.copy).value, b, 'Copy');
    });
    let rt = null;
    window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
            let w = document.getElementById('grid').clientWidth;
            if (Math.abs(w - builtWidth) > 40) build();
        }, 300);
    });

    save();
    chrome();
    build();
})();
</script>
</body>
</html>
