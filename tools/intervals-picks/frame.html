<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Intervals token</title>
        <link rel="icon" href="data:,">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--
            One Intervals token for the hash picker, drawn by the program itself,
            unmodified: p5 1.11.3, then the version's dev-token-v<n>.js, then the
            program, in the order its own dev page loads them.

            ?v=9|10            v9 from ../../intervals/ (main on Pages), v10 from the
                               intervals-v10 branch through jsDelivr (cached up to 12 h)
            ?hash=0x<64 hex>   the token
            ?aspect=W:H        read by dev-token; the picker passes 14:11
            ?id=<n>            read by dev-token; the picker passes 999999 so v10's
                               firsts table, once filled, never swaps the hash shown
        -->
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #fff;
            }
            body {
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            canvas {
                display: block;
                flex: 0 0 auto;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
        <script>
            (function () {
                let v = new URLSearchParams(location.search).get('v') === '10' ? '10' : '9';
                let base = v === '10'
                    ? 'https://cdn.jsdelivr.net/gh/jeffdavis-studio/studio@intervals-v10/intervals/'
                    : '../../intervals/';
                document.write('<script src="' + base + 'dev-token-v' + v + '.js"><\/script>');
                document.write('<script src="' + base + 'Intervals_v' + v + '.js"><\/script>');
            })();
        </script>
    </head>
    <body>
    </body>
</html>
