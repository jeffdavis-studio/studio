<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Intervals token</title>
        <link rel="icon" href="data:,">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--
            One Intervals token for the hash picker, drawn by the program itself,
            unmodified: p5 1.11.3, then the version's dev-token-v<n>.js, then the
            program, in the order its own dev page loads them.

            ?v=9|9.1|10        all three from ../../intervals/ (main on Pages since the
                               10-11 merge; before that, v9.1 and v10 came from branches through
                               jsDelivr (cached up to 12 h)
            ?hash=0x<64 hex>   the token
            ?aspect=W:H        read by dev-token; the picker passes 14:11
            ?id=<n>            read by dev-token; the picker passes 999999 so the
                               program's firsts table, once filled, never swaps the
                               hash shown
        -->
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #fff;
            }
            body {
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            canvas {
                display: block;
                flex: 0 0 auto;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
        <script>
            (function () {
                let v = new URLSearchParams(location.search).get('v');
                v = ['9.1', '10'].indexOf(v) >= 0 ? v : '9';
                let base = '../../intervals/';
                let file = v.replace('.', '_');
                document.write('<script src="' + base + 'dev-token-v' + file + '.js"><\/script>');
                document.write('<script src="' + base + 'Intervals_v' + file + '.js"><\/script>');
            })();
        </script>
    </head>
    <body>
    </body>
</html>
