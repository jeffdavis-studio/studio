<style>
  :root {
    --bg: #0e0e10;
    --ink: #f3f0ea;
    --muted: #9a958c;
    --line: #2a292e;
    --accent: #e8d5a3;
    --tile: #18181c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 1400px; margin: 0 auto; padding: 36px 20px 18px; }
  h1 { font-weight: 600; letter-spacing: -0.03em; font-size: 28px; margin: 0 0 6px; }
  .lede { color: var(--muted); font-size: 14px; max-width: 62ch; line-height: 1.5; margin: 0; }
  .grid {
    max-width: 1400px; margin: 0 auto; padding: 8px 16px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; } }
  .tile {
    position: relative; aspect-ratio: 1; background: var(--tile);
    border: 0; padding: 0; cursor: pointer; overflow: hidden; border-radius: 2px;
    color: inherit; font: inherit;
  }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile img, .tile video {
    width: 100%; height: 100%; object-fit: cover; display: block;
    background: #111;
  }
  .tile .num {
    position: absolute; left: 6px; bottom: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.85); pointer-events: none;
  }
  .tile.text {
    display: flex; flex-direction: column; justify-content: flex-end;
    align-items: flex-start; text-align: left; padding: 14px 12px 28px;
    background: #1c1b20; cursor: pointer;
  }
  .tile.text .t { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 0 0 8px; }
  .tile.text .h { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; color: var(--accent); word-break: break-all; line-height: 1.4; }
  /* lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(6,6,8,.94);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 16px 32px;
  }
  .lb[hidden] { display: none; }
  .lb .stage {
    flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1400px;
    display: flex; align-items: center; justify-content: center;
  }
  .lb .stage img, .lb .stage video {
    max-width: 100%; max-height: calc(100vh - 160px);
    object-fit: contain; background: #000; box-shadow: 0 8px 40px rgba(0,0,0,.4);
  }
  .lb .meta {
    flex: 0 0 auto; max-width: 900px; width: 100%;
    padding: 16px 8px 0; text-align: center;
  }
  .lb .who { font-size: 13px; color: var(--muted); margin: 0 0 4px; letter-spacing: .04em; }
  .lb .title { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lb .hash {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--accent); word-break: break-all;
    line-height: 1.5; margin: 0; white-space: pre-wrap;
  }
  .lb .x, .lb .nav {
    position: fixed; background: transparent; border: 0; color: var(--ink);
    cursor: pointer; font-size: 28px; line-height: 1; padding: 12px;
    opacity: .75;
  }
  .lb .x:hover, .lb .nav:hover { opacity: 1; }
  .lb .x { top: 8px; right: 8px; font-size: 32px; }
  .lb .prev { left: 4px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 4px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) {
    .lb .nav { display: none; }
    .lb .stage img, .lb .stage video { max-height: calc(100vh - 200px); }
  }
</style>
</head>

const grid = document.getElementById("grid");
const lb = document.getElementById("lb");
const stage = document.getElementById("stage");
const who = document.getElementById("who");
const titleEl = document.getElementById("title");
const hashEl = document.getElementById("hash");
let idx = 0;

function label(t) {
  if (t.n > 1) return "Entry " + t.e + " · " + t.i + "/" + t.n;
  return "Entry " + t.e;
}

function mediaSrc(t) {
  if (t.k === "video") return "media/" + t.file;
  if (t.k === "img") return "media/" + t.file;
  return "";
}
function posterSrc(t) {
  return t.poster_file ? "media/" + t.poster_file : "";
}

TILES.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tile" + (t.k === "text" ? " text" : "");
  b.type = "button";
  b.setAttribute("aria-label", label(t) + (t.title ? " — " + t.title : ""));
  if (t.k === "img") {
    const img = document.createElement("img");
    img.src = mediaSrc(t);
    img.alt = label(t);
    img.loading = "lazy";
    b.appendChild(img);
  } else if (t.k === "video") {
    const v = document.createElement("video");
    v.src = mediaSrc(t);
    if (posterSrc(t)) v.poster = posterSrc(t);
    v.muted = true;
    v.loop = true;
    v.playsInline = true;
    v.autoplay = true;
    v.setAttribute("muted", "");
    v.setAttribute("playsinline", "");
    b.appendChild(v);
    const play = () => v.play().catch(() => {});
    v.addEventListener("canplay", play, { once: true });
    play();
  } else {
    if (t.title) {
      const p = document.createElement("div");
      p.className = "t";
      p.textContent = t.title;
      b.appendChild(p);
    }
    const h = document.createElement("div");
    h.className = "h";
    h.textContent = t.hash || "no hash";
    b.appendChild(h);
  }
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = t.n > 1 ? t.e + " · " + t.i + "/" + t.n : t.e;
  b.appendChild(num);
  b.addEventListener("click", () => openAt(i));
  grid.appendChild(b);
});

function openAt(i) {
  idx = (i + TILES.length) % TILES.length;
  const t = TILES[idx];
  stage.innerHTML = "";
  if (t.k === "img") {
    const img = document.createElement("img");
    img.src = mediaSrc(t);
    img.alt = t.title || label(t);
    stage.appendChild(img);
  } else if (t.k === "video") {
    const v = document.createElement("video");
    v.src = mediaSrc(t);
    if (posterSrc(t)) v.poster = posterSrc(t);
    v.controls = true;
    v.autoplay = true;
    v.loop = true;
    v.playsInline = true;
    stage.appendChild(v);
    v.play().catch(() => {});
  } else {
    const imgish = document.createElement("div");
    imgish.style.cssText = "color:#f3f0ea;max-width:36rem;padding:24px;text-align:center";
    imgish.innerHTML = "";
    if (t.title) {
      const h = document.createElement("div");
      h.style.cssText = "font-size:28px;font-weight:600;margin-bottom:16px";
      h.textContent = t.title;
      imgish.appendChild(h);
    }
    const p = document.createElement("div");
    p.style.cssText = "font-family:ui-monospace,Menlo,monospace;color:#e8d5a3;word-break:break-all;white-space:pre-wrap";
    p.textContent = t.hash || "no hash";
    imgish.appendChild(p);
    stage.appendChild(imgish);
  }
  who.textContent = label(t);
  titleEl.textContent = t.title || "";
  titleEl.style.display = t.title ? "" : "none";
  hashEl.textContent = t.hash || "no hash";
  lb.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("btnClose").focus();
}

function closeLb() {
  lb.hidden = true;
  stage.innerHTML = "";
  document.body.style.overflow = "";
}

function prev() { openAt(idx - 1); }
function next() { openAt(idx + 1); }

document.getElementById("btnClose").addEventListener("click", (ev) => { ev.stopPropagation(); closeLb(); });
document.getElementById("btnPrev").addEventListener("click", (ev) => { ev.stopPropagation(); prev(); });
document.getElementById("btnNext").addEventListener("click", (ev) => { ev.stopPropagation(); next(); });
lb.addEventListener("click", (ev) => {
  if (ev.target === lb || ev.target === stage || ev.target === who || ev.target.id === "title" || ev.target.id === "hash" || ev.target.classList.contains("meta")) {
    closeLb();
  }
});
stage.addEventListener("click", (ev) => {
  // click on empty stage (not the media) closes; click media does not
  if (ev.target === stage) closeLb();
});

document.addEventListener("keydown", (ev) => {
  if (lb.hidden) return;
  if (ev.key === "Escape") { ev.preventDefault(); closeLb(); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); prev(); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); next(); }
});
</script>
